  async run(keys) {
    const ctx = Game.ctx;
    Game.montage = true;
    Music.duck(true);
    /* монтаж рисуется на канве и сам закрашивает фон чёрным, поэтому
       на время показа снимаем затемнение — иначе кадров просто не видно */
    const fade = document.getElementById('fade');
    const wasFaded = fade.classList.contains('show');
    if (wasFaded) { fade.style.transition = 'none'; fade.classList.remove('show'); }
    for (const k of keys) {
      const fr = this.frames[k];
      if (!fr) continue;
      for (let a=0; a<=1.001; a+=0.14) { Game.montageDraw = {fr, a:Math.min(1,a)}; await wait(26); }
      Audio.beep(300 + Math.random()*160, .05, 'sine', .06);
      await wait(520);
      for (let a=1; a>=0; a-=0.16) { Game.montageDraw = {fr, a:Math.max(0,a)}; await wait(24); }
      await wait(90);
    }
    Game.montageDraw = null; Game.montage = false;
    if (wasFaded) { fade.classList.add('show'); fade.style.transition = 'opacity .5s'; }
    Music.duck(false);
  },
  draw(ctx) {
    const md = Game.montageDraw;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,CONFIG.VIEW_W,CONFIG.VIEW_H);
    if (!md) return;
    ctx.save(); ctx.globalAlpha = md.a;
    md.fr.draw(ctx);
    ctx.globalAlpha = Math.min(1, md.a * 1.2);
    if (md.fr.cap) {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 320, CONFIG.VIEW_W, 24);
      ctx.fillStyle = '#e0a0b0'; ctx.font = '10px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(md.fr.cap, CONFIG.VIEW_W/2, 336); ctx.textAlign = 'left';
    }
    ctx.restore();
  }
};

  unlock(key) {
    if (!this.DEFS.find(d => d.key === key)) return;
    if (gameState && !gameState.memories.includes(key)) {
      gameState.memories.push(key);
      UI.toast('Воспоминание: ' + this.DEFS.find(d=>d.key===key).title, 1800);
      Audio.chime();
    }
    META.memories[key] = true; saveMeta();
  },
  has(key) { return !!(META.memories[key] || (gameState && gameState.memories.includes(key))); },
  renderList() {
    const wrap = document.getElementById('memoriesList');
    wrap.innerHTML = '';
    this.DEFS.forEach((d, i) => {
      const unlocked = this.has(d.key);
      const b = document.createElement('button');
      b.className = 'listItem' + (unlocked ? '' : ' locked');
      b.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span>` +
                    `<span>${unlocked ? d.title : '???????'}</span>` +
                    (unlocked ? '<span class="tick">✦</span>' : '');
      if (unlocked) b.addEventListener('click', () => this.open(d));
      wrap.appendChild(b);
    });
  },
  open(d) {
    document.getElementById('memoryTitle').textContent = d.title;
    document.getElementById('memoryText').textContent = d.text;
    const c = document.getElementById('memoryCanvas');
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#000'; g.fillRect(0,0,200,120);
    try { d.draw(g); } catch(e) {}
    document.getElementById('memoryView').classList.add('show');
    Audio.click();
  }
};

  async show(id) {
    Game.endingShown = true;

    Music.stop();
    const d = this.DEFS[id];

    META.endingStats[id] = { trustSue:S('trustSue'), witchAmbition:S('witchAmbition'), humanity:S('humanity'), hellAffinity:S('hellAffinity') };

    document.getElementById('endingRoman').textContent = d.roman;
    document.getElementById('endingName').textContent = d.name;
    document.getElementById('endingSub').textContent = d.sub;
    document.getElementById('endingBody').textContent = this.bodyFor(id);
    const st = document.getElementById('endingStats');
    st.innerHTML = '';
    const rows = [
      ['Путь ведьмы', S('witchAmbition')],
      ['Доверие Сью', S('trustSue')],
      ['Человечность', S('humanity')],
      ['Связь с адом', S('hellAffinity')],
    ];
    rows.forEach(([k,v]) => {
      const r = document.createElement('div');
      r.className = 'statRow';
      r.innerHTML = `<span>${k}</span><span>${Math.round(v)}%</span>`;
      st.appendChild(r);
    });
    document.getElementById('btnRewind').style.display = hasCheckpoint() ? '' : 'none';
    document.getElementById('endingScreen').classList.add('show');
    Game.mode = 'menu';
    document.getElementById('dialogueBox').classList.remove('active');
    document.getElementById('choiceBox').classList.remove('show');
    UI.dimControls(true);
    updateEndingCount();
  },
  renderList() {
    const wrap = document.getElementById('endingsList');
    wrap.innerHTML = '';
    ['I','II','III','IV'].forEach(id => {
      const d = this.DEFS[id], got = !!META.endings[id];
      const b = document.createElement('button');
      b.className = 'listItem' + (got ? '' : ' locked');
      b.innerHTML = `<span class="idx">${id}</span><span>${got ? d.name : '????????'}</span>` +
                    (got ? '<span class="tick">✓</span>' : '<span class="tick">?</span>');
      if (got) b.addEventListener('click', () => {
        const s = META.endingStats[id] || {};

          '\nДоверие Сью: ' + Math.round(s.trustSue||0) + '%' +
          '\nЧеловечность: ' + Math.round(s.humanity||0) + '%');
      });
      wrap.appendChild(b);
    });
  }
};
function Dialogue0Alert(msg) {

}
function updateEndingCount() {
  const n = ['I','II','III','IV'].filter(i => META.endings[i]).length;

}

/* =====================================================================
   SAVE / LOAD / CHECKPOINT
===================================================================== */
function serializeState() {
  return {
    currentRoom:gameState.currentRoom,
    playerX:Player.x, playerY:Player.y,
    act:gameState.act, eventStep:gameState.eventStep,
    flags:gameState.flags, stats:gameState.stats, counters:gameState.counters,
    inventory:gameState.inventory, memories:gameState.memories,
    settings:gameState.settings,
  };
}
function saveGame() {
  if (!gameState || Game.endingShown) return;
  gameState.playerX = Player.x; gameState.playerY = Player.y;
  try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(serializeState())); } catch(e) {}
}
function loadGame() {
  try { const raw = localStorage.getItem(CONFIG.SAVE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}
function hasSave() { try { return !!localStorage.getItem(CONFIG.SAVE_KEY); } catch(e) { return false; } }

function saveCheckpoint(label) {
  if (!gameState) return;
  try {
    localStorage.setItem(CONFIG.CHECKPOINT_KEY, JSON.stringify({ label, state:serializeState() }));
  } catch(e) {}
}
function hasCheckpoint() { try { return !!localStorage.getItem(CONFIG.CHECKPOINT_KEY); } catch(e) { return false; } }
function loadCheckpoint() {
  try { const raw = localStorage.getItem(CONFIG.CHECKPOINT_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}
function applyState(s) {
  gameState = freshState();
  gameState.currentRoom = s.currentRoom || 'nayaRoom';
  gameState.playerX = s.playerX; gameState.playerY = s.playerY;
  gameState.act = s.act || 0;
  gameState.eventStep = s.eventStep || 0;
  gameState.flags    = Object.assign(freshState().flags, s.flags || {});
  gameState.stats    = Object.assign(freshState().stats, s.stats || {});
  gameState.counters = Object.assign(freshState().counters, s.counters || {});
  gameState.inventory = Array.isArray(s.inventory) ? s.inventory.slice() : [];
  gameState.memories  = Array.isArray(s.memories) ? s.memories.slice() : [];
  gameState.settings = Object.assign(freshState().settings, s.settings || {});
  Player.x = gameState.playerX; Player.y = gameState.playerY;
  applySettings();
  FX.clearAll(); FX.refreshCorruption();
  UI.updateInventory();
}
function applySettings() {
  const s = gameState.settings;
  Audio.volume = s.volume;
  Music.setVolume(s.music);
  FX.enabled = true;
  document.getElementById('volSlider').value = Math.round(s.volume*100);
  document.getElementById('volVal').textContent = Math.round(s.volume*100);
  document.getElementById('musSlider').value = Math.round(s.music*100);
  document.getElementById('musVal').textContent = Math.round(s.music*100);
  document.getElementById('spdSlider').value = s.textSpeed;
  document.getElementById('spdVal').textContent = s.textSpeed;
  document.getElementById('fxSlider').value = s.effects ? 1 : 0;
  document.getElementById('fxVal').textContent = s.effects ? 'вкл' : 'выкл';
}

  { jump:()=> {

      const agreed = resolve >= 3 || (respected >= 2 && trust >= 78);
      return agreed ? 'sueAgrees' : 'sueRefuses';
    }},
],

/* =====================================================================
   INPUT
===================================================================== */
const Input = {
  keys:{}, dpad:{x:0,y:0,active:false},
  init() {
    window.addEventListener('keydown', e => {
      if (Game.mode === 'menu' && !Dialogue.active) return;
      this.keys[e.code] = true;
      if (['Space','Enter'].includes(e.code)) { e.preventDefault(); Audio.resume(); doInteract(); }
      if (e.code === 'Escape') { e.preventDefault(); if (!Dialogue.active && Game.mode !== 'cutscene') togglePause(); }
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    // clearing keys on blur prevents "stuck running into a wall"
    window.addEventListener('blur', () => { this.keys = {}; this.dpad = {x:0,y:0,active:false}; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.keys = {}; });

    const dpad = document.getElementById('dpad');
    const stick = document.getElementById('dpadStick');
    const CX = 56, CY = 56, MAXR = 34, HOME = 33;
    const handleMove = (pt) => {
      const rect = dpad.getBoundingClientRect();
      let dx = (pt.clientX - rect.left) - CX, dy = (pt.clientY - rect.top) - CY;
      const d = Math.hypot(dx, dy);
      if (d > MAXR) { dx = dx/d*MAXR; dy = dy/d*MAXR; }
      stick.style.left = (HOME + dx) + 'px';
      stick.style.top  = (HOME + dy) + 'px';
      this.dpad.x = Math.abs(dx) > 8 ? Math.sign(dx) : 0;
      this.dpad.y = Math.abs(dy) > 8 ? Math.sign(dy) : 0;
      this.dpad.active = true;
    };
    const handleEnd = () => {
      stick.style.left = HOME + 'px'; stick.style.top = HOME + 'px';
      this.dpad.x = 0; this.dpad.y = 0; this.dpad.active = false;
    };
    dpad.addEventListener('touchstart', e => { e.preventDefault(); Audio.resume(); handleMove(e.touches[0]); }, {passive:false});
    dpad.addEventListener('touchmove',  e => { e.preventDefault(); handleMove(e.touches[0]); }, {passive:false});
    dpad.addEventListener('touchend',   e => { e.preventDefault(); handleEnd(); }, {passive:false});
    dpad.addEventListener('touchcancel',e => { e.preventDefault(); handleEnd(); }, {passive:false});
    let mouseDown = false;
    dpad.addEventListener('mousedown', e => { mouseDown = true; Audio.resume(); handleMove(e); });
    dpad.addEventListener('mousemove', e => { if (mouseDown) handleMove(e); });
    window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; handleEnd(); } });

    const act = document.getElementById('actionBtn');
    let actTouched = false;
    act.addEventListener('touchstart', e => { e.preventDefault(); actTouched = true; Audio.resume(); doInteract(); }, {passive:false});
    act.addEventListener('click', e => { e.preventDefault(); if (actTouched) { actTouched = false; return; } Audio.resume(); doInteract(); });

    // tap anywhere to advance dialogue (but not while a choice is open)
    const tap = document.getElementById('tapCatcher');
    const advance = (e) => {
      e.preventDefault(); e.stopPropagation();
      Audio.resume();
      if (Dialogue.active && !Dialogue.awaitingChoice) Dialogue.advance();
    };
    let tapTouched = false;
    tap.addEventListener('touchstart', e => { tapTouched = true; advance(e); }, {passive:false});
    tap.addEventListener('click', e => { if (tapTouched) { tapTouched = false; return; } advance(e); });

    document.getElementById('menuBtnGame').addEventListener('click', () => {
      Audio.click(); if (!Dialogue.active && Game.mode !== 'cutscene') togglePause(); else UI.toast('Не сейчас.');
    });
    document.getElementById('statusBtnGame').addEventListener('click', () => { Audio.click(); showStatus(); });
  },
  getMove() {
    let dx = 0, dy = 0;
    if (this.keys['ArrowLeft'] || this.keys['KeyA']) dx = -1;
    else if (this.keys['ArrowRight'] || this.keys['KeyD']) dx = 1;
    if (this.keys['ArrowUp'] || this.keys['KeyW']) dy = -1;
    else if (this.keys['ArrowDown'] || this.keys['KeyS']) dy = 1;
    if (this.dpad.active) { dx = this.dpad.x; dy = this.dpad.y; }
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    return { dx, dy };
  }
};

/* =====================================================================
   RENDER + LOOP
===================================================================== */
const Game = {
  mode:'menu', canvas:null, ctx:null, cam:{x:0,y:0}, scale:1,
  running:false, lastT:0, paused:false,
  chase:null, endingShown:false, montage:false, montageDraw:null, reviveGlow:null, motherShadow:null,
};

function resizeCanvas() {
  const c = Game.canvas;
  const cont = document.getElementById('gameContainer');
  const cw = cont.clientWidth, ch = cont.clientHeight;
  c.width = CONFIG.VIEW_W; c.height = CONFIG.VIEW_H;
  const scale = Math.min(cw / CONFIG.VIEW_W, ch / CONFIG.VIEW_H);
  c.style.width  = (CONFIG.VIEW_W * scale) + 'px';
  c.style.height = (CONFIG.VIEW_H * scale) + 'px';
  c.style.position = 'absolute';
  c.style.left = ((cw - CONFIG.VIEW_W * scale) / 2) + 'px';
  c.style.top  = '0px';
  Game.scale = scale;
  if (Game.ctx) Game.ctx.imageSmoothingEnabled = false;
}

function drawRoom() {
  const ctx = Game.ctx;
  const room = Rooms[gameState.currentRoom];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);

  let camX = clamp(Player.x - CONFIG.VIEW_W/2, 0, Math.max(0, room.w - CONFIG.VIEW_W));
  let camY = clamp(Player.y - CONFIG.VIEW_H/2, 0, Math.max(0, room.h - CONFIG.VIEW_H));
  if (room.w <= CONFIG.VIEW_W) camX = (room.w - CONFIG.VIEW_W) / 2;
  if (room.h <= CONFIG.VIEW_H) camY = (room.h - CONFIG.VIEW_H) / 2;
  if (FX.shake > 0) {
    camX += (Math.random()-.5) * FX.shake;
    camY += (Math.random()-.5) * FX.shake;
  }
  camX = Math.round(camX); camY = Math.round(camY);
  Game.cam.x = camX; Game.cam.y = camY;

  // 1. static background (painted once, then blitted)
  ctx.drawImage(World.background(gameState.currentRoom), -camX, -camY);

  // 2. anything the room wants to animate underneath the actors
  if (room.underPaint) { ctx.save(); ctx.translate(-camX, -camY); room.underPaint(ctx); ctx.restore(); }

  // 3. props, NPCs and the player, sorted by depth so you walk behind things
  // flat decals (rugs, puddles, leaf piles) belong to the floor, not to the
  // depth-sorted layer — otherwise they get drawn over whoever stands on them
  const props = World.objectsOf(room);
  for (const o of props) if (Art.meta(o.t) && Art.meta(o.t).flat) Art.drawAt(ctx, o, camX, camY);

  const draws = [];
  for (const o of props) { const m = Art.meta(o.t); if (m && m.flat) continue; draws.push({ y:o.y, obj:o }); }
  for (const n of roomNPCs(room)) draws.push({ y:n.y, npc:n });
  if (!room.cinematic) draws.push({ y:Player.y, player:true });
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) {
    if (d.obj) {
      const dm = Art.meta(d.obj.t);
      let faded = false;
      if (dm && dm.fade && d.obj.y > Player.y) {
        const sx = d.obj.x - dm.ax, sy = d.obj.y - dm.ay;
        if (Player.x > sx - 2 && Player.x < sx + dm.w + 2 &&
            Player.y > sy && Player.y - 20 < sy + dm.h) { ctx.globalAlpha = .42; faded = true; }
      }
      Art.drawAt(ctx, d.obj, camX, camY);
      if (faded) ctx.globalAlpha = 1;
      continue;
    }
    if (d.player) { Player.draw(ctx, camX, camY); continue; }
    const n = d.npc, img = Assets.images[n.sprite];
    if (!img) continue;
    const px = Math.round(n.x - 8 - camX), py = Math.round(n.y - 16 - camY);
    shadowEllipse(ctx, px + 8, py + 20, 6, 2, .3);
    ctx.drawImage(img, px, py);
  }

  // 4. room-specific animated overlay (runes, glows, story markers)
  if (room.overPaint) { ctx.save(); ctx.translate(-camX, -camY); room.overPaint(ctx); ctx.restore(); }
  if (room.prologue) {
    ctx.save(); ctx.translate(-camX, -camY);
    Prologue.drawStars(ctx); Prologue.drawFigures(ctx);
    Prologue.drawStones(ctx); Prologue.drawButterfly(ctx);
    ctx.restore();
  }

  FX.drawMagic(ctx, camX, camY);
  FX.drawParticles(ctx, camX, camY);

  if (Game.reviveGlow && Game.reviveGlow.on) {
    const g = ctx.createRadialGradient(CONFIG.VIEW_W/2, CONFIG.VIEW_H/2, 0,
                                       CONFIG.VIEW_W/2, CONFIG.VIEW_H/2, Math.max(1, Game.reviveGlow.r));
    g.addColorStop(0, '#ffe8f0'); g.addColorStop(0.6, 'rgba(255,180,210,.35)'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  }
  /* тень матери: на секунду за Наей вырастает чужой силуэт — длинные
     волосы и плащ. Появляется и гаснет, договаривать не нужно. */
  if (Game.motherShadow && Game.motherShadow.on) {
    const t = Game.motherShadow.t;
    const a = Math.sin(Math.PI * t) * 0.5;
    const px = Math.round(Player.x - camX), py = Math.round(Player.y - camY);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#0a0610';
    ctx.beginPath(); ctx.ellipse(px, py - 22, 15, 26, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(px - 15, py - 24, 30, 24);
    ctx.fillStyle = '#1a0f18';
    ctx.fillRect(px - 17, py - 40, 6, 34); ctx.fillRect(px + 11, py - 40, 6, 34);
    ctx.globalAlpha = a * .6;
    ctx.fillStyle = '#6a4050';
    ctx.fillRect(px - 5, py - 34, 3, 3); ctx.fillRect(px + 2, py - 34, 3, 3);
    ctx.restore();
  }

  // 5. shafts of daylight through the windows, then weather and light
  Lighting.drawSun(ctx, room, camX, camY);
  Weather.drawRain(ctx);
  Weather.drawLeaves(ctx);
  Lighting.draw(ctx, room, camX, camY);
  Weather.drawFog(ctx);

  // 6. interaction hint
  const near = (Game.mode === 'explore' && !Dialogue.active) ? findNearestInteractable() : null;
  if (near) {
    const ref = near.ref;
    const hx = (near.type === 'obj') ? (ref.x + ref.w/2 - camX) : (ref.x - camX);
    const hy = (near.type === 'obj') ? (ref.y - camY - 6) : (ref.y - 22 - camY);
    const label = (near.type === 'obj') ? (ref.prompt || 'A') : (ref.name || 'A');
    ctx.font = '9px Courier New';
    const w = ctx.measureText(label).width + 10;
    ctx.fillStyle = 'rgba(12,10,16,.85)';
    ctx.fillRect(hx - w/2, hy - 10, w, 12);
    ctx.strokeStyle = '#c0304d'; ctx.lineWidth = 1;
    ctx.strokeRect(hx - w/2 + .5, hy - 9.5, w, 12);
    ctx.fillStyle = '#e8c8d0'; ctx.textAlign = 'center';
    ctx.fillText(label, hx, hy);
    ctx.textAlign = 'left';
  }

  FX.drawOverlay(ctx);
}

function tick(t) {
  if (!Game.running) { return; }
  const dt = Math.min(50, (Game.lastT ? t - Game.lastT : 16));
  Game.lastT = t;

  if (Game.montage) {
    Montage.draw(Game.ctx);
    requestAnimationFrame(tick);
    return;
  }

  if (!Game.paused && gameState) {
    if (Game.mode === 'explore' && !Dialogue.active) {
      const { dx, dy } = Input.getMove();
      if (dx || dy) {
        tryMove(dx * CONFIG.PLAYER_SPEED, dy * CONFIG.PLAYER_SPEED);
        Player.moving = true;
        Player.animTimer += dt;
        if (Player.animTimer > 150) { Player.animFrame++; Player.animTimer = 0; }
        if (Math.abs(dx) > Math.abs(dy)) Player.dir = dx > 0 ? 'right' : 'left';
        else if (dy !== 0) Player.dir = dy > 0 ? 'down' : 'up';
      } else Player.moving = false;
    } else Player.moving = false;

    Chase.update(dt);
    Dialogue.update(dt);
    FX.update(dt);
    const room = Rooms[gameState.currentRoom];
    if (room) { FX.fogA *= 0.9; FX.ambient(room); Weather.update(dt, room); }
    drawRoom();
  }
  requestAnimationFrame(tick);
}

/* =====================================================================
   MENUS / SCREENS
===================================================================== */
function showMenu() {
  UI.showScreen('mainMenu', true);
  document.getElementById('btnContinue').disabled = !hasSave();
  document.getElementById('dpad').style.display = 'none';
  document.getElementById('actionBtn').style.display = 'none';
  document.getElementById('menuBtnGame').style.display = 'none';
  document.getElementById('statusBtnGame').style.display = 'none';
  document.getElementById('inventoryPanel').classList.remove('show');
  Game.mode = 'menu';
  updateEndingCount();
  Music.play('sad');
}
function hideMenu() {
  UI.showScreen('mainMenu', false);
  document.getElementById('dpad').style.display = 'block';
  document.getElementById('actionBtn').style.display = 'block';
  document.getElementById('menuBtnGame').style.display = 'block';
  document.getElementById('statusBtnGame').style.display = 'block';
  UI.updateInventory();
  UI.dimControls(false);
}

function beginPlay() {
  hideMenu();
  Game.endingShown = false;
  Game.running = true;
  Game.lastT = 0;
  Game.mode = 'explore';
  document.getElementById('endingScreen').classList.remove('show');
  FX.clearAll(); FX.refreshCorruption();
  const room = Rooms[gameState.currentRoom];
  Music.play(room.music || 'home');
  Weather.apply(room);
  Ambience.set(room.zone || (room.weather && room.weather.indoor ? 'indoor' : 'street'));
  World.invalidate();
  requestAnimationFrame(tick);
  if (!F('prologueComplete')) { Scene.play('prologue'); saveGame(); return; }
  if (room.onEnter) room.onEnter();          // fixes "scene never replays after load"
  saveGame();
}

function startNewGame() {
  gameState = freshState();
  const keep = loadGame();
  if (keep && keep.settings) gameState.settings = Object.assign(gameState.settings, keep.settings);
  Object.assign(gameState.settings, pendingSettings);
  Player.x = gameState.playerX; Player.y = gameState.playerY;
  applySettings();
  try { localStorage.removeItem(CONFIG.CHECKPOINT_KEY); } catch(e) {}
  beginPlay();
}

function continueGame() {
  const s = loadGame();
  if (!s) return;
  applyState(s);
  beginPlay();
  UI.toast('Загружено: ' + (Rooms[gameState.currentRoom] ? Rooms[gameState.currentRoom].name : ''), 1600);
}

function rewindToCheckpoint() {
  const cp = loadCheckpoint();
  if (!cp) return;
  applyState(cp.state);
  Scene.active = false; Scene.pending = null;
  Dialogue.active = false;
  Game.chase = null;
  beginPlay();
  UI.toast('Возврат: ' + (cp.label || 'последний выбор'), 2000);
}

function togglePause() {
  if (Game.mode === 'menu') return;
  const pm = document.getElementById('pauseMenu');
  if (pm.classList.contains('show')) { pm.classList.remove('show'); Game.paused = false; }
  else { pm.classList.add('show'); Game.paused = true; saveGame(); }
}

function showStatus() {
  const rows = document.getElementById('statusRows');
  rows.innerHTML = '';
  const data = [
    ['Амулеты', amuletCount() + ' / 3'],
    ['Кристалл', F('crystalTaken') ? 'отнят' : (F('gaveCrystalAway') ? 'у Сью' : (hasItem('Кристалл') ? 'есть' : '—'))],
    ['Сью', F('sueDead') && !F('sueRevived') ? '???' : (F('sueRefused') ? 'не рядом' : 'рядом')],
    ['Доверие Сью', '???'],
    ['Путь ведьмы', '???'],
    ['Акт', String(gameState ? gameState.act : 0)],
  ];
  data.forEach(([k,v]) => {
    const r = document.createElement('div');
    r.className = 'statRow';
    r.innerHTML = `<span>${k}</span><span>${v}</span>`;
    rows.appendChild(r);
  });
  UI.showScreen('statusScreen', true);
}

/* settings changed at the title screen must survive into a new game */
let pendingSettings = {};
function setSetting(key, value) {
  pendingSettings[key] = value;
  if (gameState) { gameState.settings[key] = value; saveGame(); }
}

/* =====================================================================
   INIT
===================================================================== */
window.addEventListener('load', () => {
  Game.canvas = document.getElementById('gameCanvas');
  Game.ctx = Game.canvas.getContext('2d');
  Game.ctx.imageSmoothingEnabled = false;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

  Audio.init();
  Assets.build();
  Input.init();
  loadMeta();

  // restore settings shown on the title screen from the last save
  const prev = loadGame();
  if (prev && prev.settings) {
    pendingSettings = Object.assign({}, prev.settings);
    Audio.volume = prev.settings.volume;
    Audio.musicVolume = prev.settings.music;
    document.getElementById('volSlider').value = Math.round(prev.settings.volume*100);
    document.getElementById('volVal').textContent = Math.round(prev.settings.volume*100);
    document.getElementById('musSlider').value = Math.round(prev.settings.music*100);
    document.getElementById('musVal').textContent = Math.round(prev.settings.music*100);
    document.getElementById('spdSlider').value = prev.settings.textSpeed;
    document.getElementById('spdVal').textContent = prev.settings.textSpeed;
    document.getElementById('fxSlider').value = prev.settings.effects ? 1 : 0;
    document.getElementById('fxVal').textContent = prev.settings.effects ? 'вкл' : 'выкл';
  }

  const wire = (id, fn) => document.getElementById(id).addEventListener('click', () => { Audio.resume(); Audio.click(); fn(); });

  wire('btnNew', startNewGame);
  wire('btnContinue', continueGame);
  wire('btnSettings', () => UI.showScreen('settingsPanel', true));
  wire('btnBackSettings', () => { UI.showScreen('settingsPanel', false); });
  wire('btnMemories', () => { Memories.renderList(); UI.showScreen('memoriesScreen', true); });
  wire('btnBackMemories', () => UI.showScreen('memoriesScreen', false));
  wire('btnCloseMemory', () => document.getElementById('memoryView').classList.remove('show'));
  wire('btnEndings', () => { Endings.renderList(); UI.showScreen('endingsScreen', true); });
  wire('btnBackEndings', () => UI.showScreen('endingsScreen', false));
  wire('btnBackStatus', () => UI.showScreen('statusScreen', false));

  wire('btnReset', () => {
    if (confirm('Удалить сохранение?')) {
      try { localStorage.removeItem(CONFIG.SAVE_KEY); localStorage.removeItem(CONFIG.CHECKPOINT_KEY); } catch(e) {}
      document.getElementById('btnContinue').disabled = true;
      UI.toast('Сохранение удалено');
    }
  });
  wire('btnResetAll', () => {
    if (confirm('Удалить всё, включая открытые концовки и воспоминания?')) {
      try {
        localStorage.removeItem(CONFIG.SAVE_KEY);
        localStorage.removeItem(CONFIG.CHECKPOINT_KEY);
        localStorage.removeItem(CONFIG.META_KEY);
      } catch(e) {}
      META = { endings:{}, memories:{}, endingStats:{}, hints:{} };
      document.getElementById('btnContinue').disabled = true;
      updateEndingCount();
      UI.toast('Всё удалено');
    }
  });

  document.getElementById('volSlider').oninput = (e) => {
    const v = +e.target.value;
    document.getElementById('volVal').textContent = v;
    Audio.volume = v/100; setSetting('volume', v/100);
  };
  document.getElementById('musSlider').oninput = (e) => {
    const v = +e.target.value;
    document.getElementById('musVal').textContent = v;
    Music.setVolume(v/100); setSetting('music', v/100);
  };
  document.getElementById('spdSlider').oninput = (e) => {
    const v = +e.target.value;
    document.getElementById('spdVal').textContent = v;
    setSetting('textSpeed', v);
  };
  document.getElementById('fxSlider').oninput = (e) => {
    const v = +e.target.value;
    document.getElementById('fxVal').textContent = v ? 'вкл' : 'выкл';
    setSetting('effects', v);
    FX.refreshCorruption();
    if (!v) FX.clearAll();
  };

  wire('btnResume', togglePause);
  wire('btnSaveGame', () => { saveGame(); UI.toast('Сохранено'); });
  wire('btnPauseMemories', () => { Memories.renderList(); UI.showScreen('memoriesScreen', true); });
  wire('btnPauseSettings', () => UI.showScreen('settingsPanel', true));
  wire('btnToMenu', () => { saveGame(); location.reload(); });

  wire('btnRewind', rewindToCheckpoint);
  wire('btnEndNew', () => { document.getElementById('endingScreen').classList.remove('show'); startNewGame(); });
  wire('btnEndMenu', () => location.reload());

  showMenu();
});
</script>
</body>
