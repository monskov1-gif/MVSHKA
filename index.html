<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Месть Ведьмы</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Courier New', Courier, monospace; color:#e8e8e8;
    overscroll-behavior:none;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #gameContainer {
    position:relative;
    width:100vw; height:100vh;
    width:100dvw; height:100dvh;
    max-width:520px;
    background:#0a0a0f;
    overflow:hidden;
    box-shadow:0 0 40px rgba(120,20,60,.4);
  }
  #gameCanvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#08060c; }

  button { font-family:inherit; cursor:pointer; }

  /* ==================== MENUS ==================== */
  .screen {
    position:absolute; inset:0;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  }
  .screen.show { display:flex; }

  #mainMenu {
    background:radial-gradient(ellipse at center, #22101a 0%, #05030a 80%);
    z-index:50;
  }
  #mainMenu h1 {
    font-size:clamp(26px, 8.5vw, 46px);
    color:#c0304d; letter-spacing:4px; margin-bottom:6px;
    text-shadow:0 0 22px #6a0020, 2px 2px 0 #000; text-align:center;
  }
  #mainMenu .sub { color:#7a5060; font-size:12px; margin-bottom:26px; letter-spacing:2px; text-align:center; }
  #menuEndCount { color:#9a6070; font-size:11px; margin-top:14px; letter-spacing:1px; }

  .menuBtn {
    background:rgba(60,10,25,.7);
    border:1px solid #7a1030; color:#e8c8d0;
    padding:13px 24px; font-size:15px; margin:5px;
    letter-spacing:2px; min-width:238px; max-width:100%;
    transition:background .18s, box-shadow .18s, color .18s;
  }
  .menuBtn:hover, .menuBtn:active { background:#7a1030; color:#fff; box-shadow:0 0 15px #c0304d; }
  .menuBtn:disabled { opacity:.32; cursor:not-allowed; box-shadow:none; background:rgba(60,10,25,.7); color:#e8c8d0; }
  .menuBtn.small { min-width:150px; font-size:13px; padding:10px 18px; }

  #settingsPanel, #memoriesScreen, #endingsScreen, #statusScreen {
    background:rgba(5,3,10,.96); z-index:76; overflow-y:auto; justify-content:flex-start;
  }
  .screen h2 { color:#c0304d; margin:6px 0 16px; letter-spacing:3px; font-size:19px; text-align:center; }
  #settingsPanel label { display:block; margin:12px 0 4px; color:#c8a8b0; font-size:13px; text-align:center; }
  #settingsPanel input[type=range] { width:230px; max-width:80vw; accent-color:#c0304d; }

  /* Memories / endings lists */
  .listWrap { width:100%; max-width:420px; margin-bottom:14px; }
  .listItem {
    display:flex; align-items:center; gap:10px;
    background:rgba(30,12,20,.7); border:1px solid #56122c;
    padding:9px 11px; margin-bottom:7px; color:#e0c0c8; font-size:12.5px;
    text-align:left; width:100%; letter-spacing:.5px;
  }
  .listItem.locked { opacity:.4; border-color:#33202a; cursor:default; color:#8a7078; }
  .listItem .idx { color:#a05068; font-size:11px; min-width:26px; }
  .listItem .tick { margin-left:auto; color:#c0304d; }
  #memoryView {
    display:none; position:absolute; inset:0; z-index:78;
    background:rgba(4,2,8,.97); flex-direction:column; align-items:center; justify-content:center;
    padding:24px 20px;
  }
  #memoryView.show { display:flex; }
  #memoryView h3 { color:#e0a0b0; letter-spacing:2px; margin-bottom:12px; font-size:16px; text-align:center; }
  #memoryCanvas { border:1px solid #56122c; image-rendering:pixelated; margin-bottom:14px; background:#000; }
  #memoryText { color:#c8b0b8; font-size:13px; line-height:1.55; max-width:400px; text-align:center; white-space:pre-wrap; margin-bottom:18px; }

  /* Status screen */
  .statRow {
    display:flex; justify-content:space-between; width:100%; max-width:340px;
    padding:9px 4px; border-bottom:1px solid #331824; font-size:13px; color:#d0b0b8;
  }
  .statRow span:last-child { color:#e0a0b0; }

  /* ==================== DIALOGUE ==================== */
  #dialogueBox {
    position:absolute; left:8px; right:8px;
    bottom:calc(134px + env(safe-area-inset-bottom));
    min-height:104px;
    background:linear-gradient(180deg, rgba(20,8,15,.97), rgba(10,4,8,.99));
    border:2px solid #7a1030; border-radius:6px;
    padding:9px 12px 14px;
    display:none; z-index:44;
    box-shadow:0 0 15px rgba(120,20,50,.5);
  }
  #dialogueBox.active { display:block; }
  #dialogueBox.shakeText #dialogueText { animation:txtJitter .12s infinite steps(2); }
  #dialogueBox.compact { min-height:0; }
  #dialogueBox.compact #dialogueText { min-height:0; }
  @keyframes txtJitter { 0%{transform:translate(0,0)} 50%{transform:translate(.7px,-.7px)} 100%{transform:translate(-.5px,.4px)} }

  #portrait {
    position:absolute; left:8px; top:-56px;
    width:64px; height:64px;
    background:#2a1220; border:2px solid #7a1030; border-radius:4px;
    image-rendering:pixelated; box-shadow:0 0 10px #000;
    background-size:cover;
  }
  #speakerName {
    color:#e0a0b0; font-size:13.5px; font-weight:bold;
    margin-left:78px; margin-bottom:5px; letter-spacing:1px;
    text-shadow:1px 1px 0 #000; min-height:17px;
  }
  #dialogueText { color:#e8e8e8; font-size:13.5px; line-height:1.45; min-height:58px; white-space:pre-wrap; }
  #dialogueHint { position:absolute; right:10px; bottom:5px; color:#a06070; font-size:11px; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }

  /* Tap-anywhere catcher while dialogue is open */
  #tapCatcher { position:absolute; inset:0; z-index:43; display:none; }
  #tapCatcher.show { display:block; }

  /* ==================== CHOICES ==================== */
  #choiceBox {
    position:absolute; left:8px; right:8px;
    bottom:calc(14px + env(safe-area-inset-bottom));
    max-height:66%; overflow-y:auto;
    display:none; z-index:48;
    -webkit-overflow-scrolling:touch;
  }
  #choiceBox.show { display:block; }
  #choiceBox.locked { pointer-events:none; opacity:.55; }
  #choicePrompt {
    color:#a07080; font-size:11.5px; letter-spacing:1px;
    padding:0 4px 7px; text-align:center;
  }
  .choiceOpt {
    display:block; width:100%; text-align:left;
    background:linear-gradient(180deg, rgba(40,14,26,.97), rgba(20,7,13,.98));
    border:1px solid #8a1838; color:#f0d8de;
    padding:13px 14px; margin-bottom:8px; border-radius:5px;
    font-size:13.5px; line-height:1.4; letter-spacing:.4px;
    min-height:46px;
    box-shadow:0 2px 0 rgba(0,0,0,.5);
  }
  .choiceOpt:active { background:#7a1030; color:#fff; transform:translateY(1px); }
  .choiceOpt .tag { display:block; color:#a86a80; font-size:10.5px; letter-spacing:1.5px; margin-bottom:3px; }

  /* Options unlocked by a hidden stat — coloured by which stat opened them */
  .choiceOpt.gated { border-width:1px; border-style:solid; position:relative; }
  .choiceOpt.gated .tag { color:var(--gate); font-weight:bold; }
  .choiceOpt.gated:active { background:var(--gateSolid); color:#fff; }
  #gateHint {
    display:none;
    border:1px dashed var(--gate, #e8b84a);
    background:var(--gateDim, rgba(232,184,74,.10));
    color:#e8d8c0; font-size:11.5px; line-height:1.5;
    padding:9px 11px; margin:0 0 9px; border-radius:5px;
  }
  #gateHint.show { display:block; }
  #gateHint b { color:var(--gate, #e8b84a); }

  /* ==================== TOUCH CONTROLS ==================== */
  #dpad {
    position:absolute; left:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    width:112px; height:112px; z-index:45; touch-action:none;
    transition:opacity .2s;
  }
  #dpad.dim { opacity:.22; pointer-events:none; }
  #gameContainer.choosing #dpad, #gameContainer.choosing #actionBtn { opacity:0; pointer-events:none; }
  #dpadBase {
    position:absolute; inset:0;
    background:radial-gradient(circle, rgba(80,20,40,.35) 0%, rgba(0,0,0,.15) 70%);
    border:2px solid rgba(140,40,70,.5); border-radius:50%;
  }
  #dpadStick {
    position:absolute; width:46px; height:46px; left:33px; top:33px;
    background:radial-gradient(circle, #c0304d 0%, #5a0820 80%);
    border:2px solid #e0a0b0; border-radius:50%;
    box-shadow:0 0 10px rgba(200,50,80,.6);
  }
  #actionBtn {
    position:absolute; right:20px; bottom:calc(30px + env(safe-area-inset-bottom));
    width:78px; height:78px;
    background:radial-gradient(circle, #c0304d 0%, #5a0820 80%);
    border:3px solid #e0a0b0; border-radius:50%;
    color:#fff; font-size:16px; font-weight:bold; z-index:45;
    box-shadow:0 0 15px rgba(200,50,80,.5);
    transition:opacity .2s;
  }
  #actionBtn.dim { opacity:.22; pointer-events:none; }
  #actionBtn:active { transform:scale(.94); background:#8a1030; }

  .topBtn {
    position:absolute; top:calc(8px + env(safe-area-inset-top));
    width:34px; height:34px;
    background:rgba(30,10,20,.75); border:1px solid #7a1030;
    color:#e0a0b0; z-index:26; border-radius:4px; font-size:16px; line-height:1;
  }
  #menuBtnGame { right:8px; }
  #statusBtnGame { right:48px; }

  #inventoryPanel {
    position:absolute; top:calc(8px + env(safe-area-inset-top)); left:8px;
    background:rgba(20,8,15,.85); border:1px solid #7a1030; border-radius:4px;
    padding:4px 8px; z-index:26; color:#e0a0b0; font-size:11px;
    max-width:52%; display:none;
  }
  #inventoryPanel.show { display:block; }

  /* ==================== OVERLAYS ==================== */
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:40; transition:opacity .5s; }
  #fade.show { opacity:1; }

  #flashOverlay { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:62; }
  #glitchOverlay {
    position:absolute; inset:0; pointer-events:none; z-index:41; opacity:0;
    background:repeating-linear-gradient(0deg, rgba(255,0,60,.10) 0 2px, transparent 2px 4px);
    mix-blend-mode:screen;
  }
  #vignette {
    position:absolute; inset:0; pointer-events:none; z-index:24; opacity:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(120,0,20,.55) 100%);
    transition:opacity .6s;
  }

  #titleFlash {
    position:absolute; inset:0; background:#000; z-index:80; display:none;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    color:#c0304d; font-size:clamp(20px,6vw,28px); letter-spacing:6px;
    text-shadow:0 0 20px #6a0020;
  }
  #titleFlash.show { display:flex; }

  #pauseMenu { background:rgba(5,3,10,.93); z-index:70; }

  #toast {
    position:absolute; top:calc(58px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%);
    background:rgba(20,8,15,.92); border:1px solid #7a1030; color:#e0a0b0;
    padding:8px 15px; border-radius:4px; z-index:35; font-size:12.5px;
    opacity:0; transition:opacity .3s; pointer-events:none;
    max-width:88%; text-align:center;
  }
  #toast.show { opacity:1; }

  /* Ending card */
  #endingScreen {
    position:absolute; inset:0; z-index:100; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:#000; padding:26px 22px; overflow-y:auto;
  }
  #endingScreen.show { display:flex; }
  #endingRoman { color:#7a5060; font-size:13px; letter-spacing:6px; margin-bottom:8px; }
  #endingName {
    color:#c0304d; font-size:clamp(24px,7.5vw,34px); letter-spacing:7px;
    text-shadow:0 0 22px #6a0020; margin-bottom:14px; text-align:center;
  }
  #endingSub {
    color:#9a7a86; font-size:12.5px; line-height:1.6; max-width:380px;
    text-align:center; margin-bottom:22px; font-style:italic;
  }
  #endingStats { width:100%; max-width:320px; margin-bottom:20px; }
  #endingBody { color:#c8b0b8; font-size:13px; line-height:1.6; max-width:380px; text-align:center; margin-bottom:22px; white-space:pre-wrap; }

  @media (prefers-reduced-motion: reduce) {
    #dialogueHint { animation:none; }
    #dialogueBox.shakeText #dialogueText { animation:none; }
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="vignette"></div>
  <div id="inventoryPanel"></div>
  <button class="topBtn" id="statusBtnGame" title="Состояние">✦</button>
  <button class="topBtn" id="menuBtnGame" title="Меню">☰</button>

  <div id="tapCatcher"></div>

  <div id="dialogueBox">
    <div id="portrait"></div>
    <div id="speakerName"></div>
    <div id="dialogueText"></div>
    <div id="dialogueHint">▼</div>
  </div>

  <div id="choiceBox">
    <div id="choicePrompt"></div>
    <div id="gateHint"></div>
    <div id="choiceOptions"></div>
  </div>

  <div id="dpad">
    <div id="dpadBase"></div>
    <div id="dpadStick"></div>
  </div>
  <button id="actionBtn">A</button>

  <div id="fade"></div>
  <div id="glitchOverlay"></div>
  <div id="flashOverlay"></div>
  <div id="toast"></div>
  <div id="titleFlash"></div>

  <!-- ===== Main menu ===== -->
  <div class="screen show" id="mainMenu">
    <h1>МЕСТЬ ВЕДЬМЫ</h1>
    <div class="sub">— история о том, кем становишься —</div>
    <button class="menuBtn" id="btnNew">НАЧАТЬ ИГРУ</button>
    <button class="menuBtn" id="btnContinue">ПРОДОЛЖИТЬ</button>
    <button class="menuBtn" id="btnMemories">ВОСПОМИНАНИЯ</button>
    <button class="menuBtn" id="btnEndings">КОНЦОВКИ</button>
    <button class="menuBtn" id="btnSettings">НАСТРОЙКИ</button>
    <div id="menuEndCount">КОНЦОВКИ: 0 / 4</div>
  </div>

  <!-- ===== Settings ===== -->
  <div class="screen" id="settingsPanel">
    <h2>НАСТРОЙКИ</h2>
    <label>Громкость: <span id="volVal">50</span>%</label>
    <input type="range" id="volSlider" min="0" max="100" value="50">
    <label>Музыка: <span id="musVal">40</span>%</label>
    <input type="range" id="musSlider" min="0" max="100" value="40">
    <label>Скорость текста: <span id="spdVal">30</span></label>
    <input type="range" id="spdSlider" min="5" max="90" value="30">
    <label>Эффекты экрана: <span id="fxVal">вкл</span></label>
    <input type="range" id="fxSlider" min="0" max="1" value="1">
    <div style="height:14px"></div>
    <button class="menuBtn" id="btnReset">СБРОСИТЬ СОХРАНЕНИЕ</button>
    <button class="menuBtn" id="btnResetAll">СБРОСИТЬ ВСЁ (и галерею)</button>
    <button class="menuBtn" id="btnBackSettings">НАЗАД</button>
  </div>

  <!-- ===== Memories ===== -->
  <div class="screen" id="memoriesScreen">
    <h2>ВОСПОМИНАНИЯ</h2>
    <div class="listWrap" id="memoriesList"></div>
    <button class="menuBtn small" id="btnBackMemories">НАЗАД</button>
  </div>
  <div id="memoryView">
    <h3 id="memoryTitle"></h3>
    <canvas id="memoryCanvas" width="200" height="120"></canvas>
    <div id="memoryText"></div>
    <button class="menuBtn small" id="btnCloseMemory">ЗАКРЫТЬ</button>
  </div>

  <!-- ===== Endings gallery ===== -->
  <div class="screen" id="endingsScreen">
    <h2>КОНЦОВКИ</h2>
    <div class="listWrap" id="endingsList"></div>
    <button class="menuBtn small" id="btnBackEndings">НАЗАД</button>
  </div>

  <!-- ===== Status ===== -->
  <div class="screen" id="statusScreen">
    <h2>НАЯ</h2>
    <div class="listWrap" id="statusRows"></div>
    <button class="menuBtn small" id="btnBackStatus">НАЗАД</button>
  </div>

  <!-- ===== Pause ===== -->
  <div class="screen" id="pauseMenu">
    <h2>ПАУЗА</h2>
    <button class="menuBtn" id="btnResume">ПРОДОЛЖИТЬ</button>
    <button class="menuBtn" id="btnSaveGame">СОХРАНИТЬ</button>
    <button class="menuBtn" id="btnPauseMemories">ВОСПОМИНАНИЯ</button>
    <button class="menuBtn" id="btnPauseSettings">НАСТРОЙКИ</button>
    <button class="menuBtn" id="btnToMenu">В ГЛАВНОЕ МЕНЮ</button>
  </div>

  <!-- ===== Ending card ===== -->
  <div id="endingScreen">
    <div id="endingRoman"></div>
    <div id="endingName"></div>
    <div id="endingSub"></div>
    <div id="endingBody"></div>
    <div id="endingStats"></div>
    <button class="menuBtn small" id="btnRewind">ВЕРНУТЬСЯ К ПОСЛЕДНЕМУ ВЫБОРУ</button>
    <button class="menuBtn small" id="btnEndNew">НОВАЯ ИГРА</button>
    <button class="menuBtn small" id="btnEndMenu">В ГЛАВНОЕ МЕНЮ</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   CONFIG
===================================================================== */
const CONFIG = {
  TILE: 16,
  VIEW_W: 240,
  VIEW_H: 340,
  PLAYER_SPEED: 1.25,
  SAVE_KEY: 'revenge_of_witch_save_v2',
  CHECKPOINT_KEY: 'revenge_of_witch_checkpoint_v2',
  META_KEY: 'revenge_of_witch_meta_v2',
};

/* =====================================================================
   AUDIO — SFX (Web Audio) + simple procedural ambient music
===================================================================== */
const Audio = {
  ctx:null, volume:0.5, musicVolume:0.4,
  init() {
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq=440, dur=0.08, type='square', vol=0.15) {
    if (!this.ctx) return;
    const amp = vol * this.volume;
    if (amp <= 0.0002) return;                 // exponentialRamp from 0 is invalid
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = amp;
    o.connect(g); g.connect(this.ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
    o.stop(this.ctx.currentTime + dur + 0.02);
  },
  noise(dur=0.3, vol=0.2, filterHz=900) {
    if (!this.ctx) return;
    const amp = vol * this.volume;
    if (amp <= 0.0002) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = filterHz;
    const g = this.ctx.createGain(); g.gain.value = amp;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start();
  },
  click() { this.beep(600, 0.04, 'square', 0.10); },
  select(){ this.beep(760, 0.05, 'square', 0.12); setTimeout(()=>this.beep(1020,0.06,'square',.10),50); },
  door()  { this.beep(200, 0.15, 'sawtooth', 0.13); setTimeout(()=>this.beep(150,0.20,'sawtooth',.13),80); },
  item()  { this.beep(800, 0.08, 'sine', 0.18); setTimeout(()=>this.beep(1200,0.12,'sine',.18),80); },
  portal(){ for(let i=0;i<8;i++) setTimeout(()=>this.beep(200+i*80,0.15,'sawtooth',.11), i*60); },
  scare() { this.beep(80, 0.5, 'sawtooth', .22); this.noise(0.5, .16, 500); },
  heart() { this.beep(58, 0.18, 'sine', .3); setTimeout(()=>this.beep(48,0.22,'sine',.24),190); },
  glass() { this.noise(0.35,.18,4200); this.beep(1800,0.05,'square',.10); setTimeout(()=>this.beep(1200,0.08,'square',.08),60); },
  shatter(){ this.noise(0.8,.26,6000); for(let i=0;i<6;i++) setTimeout(()=>this.beep(1600-i*180,0.06,'square',.09), i*45); },
  chime() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.5,'sine',.11), i*130)); },
  low()   { this.beep(70, 0.9, 'sine', .18); },
  talk()  { this.beep(400 + Math.random()*180, 0.02, 'square', 0.05); },
  rune()  { this.beep(330,0.25,'triangle',.12); setTimeout(()=>this.beep(247,0.3,'triangle',.10),120); },
};

/* --- Ambient music: 3 detuned oscillators through a lowpass, chord per theme --- */
const Music = {
  nodes:null, gain:null, filter:null, lfo:null, current:null,
  /* Real loops can replace the synth pad without touching anything else:
     put the files next to index.html and call
        Music.useFiles();            // uses the default names below
        Music.useFiles({hell:'my/track.ogg'});
     Left empty by default so the single-file build makes no network requests. */
  DEFAULT_FILES: { home:'assets/audio/home.mp3', street:'assets/audio/town.mp3',
                   warm:'assets/audio/cafe.mp3', tense:'assets/audio/witch.mp3',
                   hell:'assets/audio/hell.mp3', sad:'assets/audio/sad.mp3' },
  FILES: {},
  useFiles(map) { this.FILES = Object.assign({}, this.DEFAULT_FILES, map || {}); this.els = {}; this.current = null; },
  els:{}, elCur:null,
  tryFile(theme) {
    const src = this.FILES[theme];
    if (!src) return false;
    let el = this.els[theme];
    if (el === undefined) {
      el = document.createElement('audio');
      el.src = src; el.loop = true; el.preload = 'auto'; el.volume = 0;
      el.addEventListener('error', () => { this.els[theme] = null; }, { once:true });
      this.els[theme] = el;
    }
    if (!el || !el.readyState) return false;
    if (this.elCur && this.elCur !== el) this.elCur.pause();
    this.elCur = el;
    el.volume = Math.min(1, Audio.musicVolume);
    el.play().catch(()=>{});
    return true;
  },
  THEMES: {
    home:   [110, 164.81, 196.00],
    street: [98,  146.83, 174.61],
    tense:  [103.83, 138.59, 155.56],
    hell:   [65.41, 92.50, 98.00],
    sad:    [87.31, 130.81, 155.56],
    warm:   [130.81, 164.81, 196.00],
    none:   null,
  },
  play(theme) {
    if (!Audio.ctx) return;
    if (this.current === theme) return;
    this.current = theme;
    const chord = this.THEMES[theme];
    if (!chord) { this.stop(); return; }
    if (this.tryFile(theme)) { if (this.gain && Audio.ctx) { try { this.gain.gain.setTargetAtTime(0, Audio.ctx.currentTime, .6); } catch(e){} } return; }
    if (this.elCur) { this.elCur.pause(); this.elCur = null; }
    if (!this.nodes) this._build();
    const t = Audio.ctx.currentTime;
    this.nodes.forEach((o,i)=>{ try { o.frequency.setTargetAtTime(chord[i], t, 0.8); } catch(e){} });
    const target = 0.055 * this.musicScale();
    try { this.gain.gain.setTargetAtTime(target, t, 1.2); } catch(e){}
  },
  musicScale() { return Audio.musicVolume; },
  _build() {
    const c = Audio.ctx;
    this.gain = c.createGain(); this.gain.gain.value = 0;
    this.filter = c.createBiquadFilter();
    this.filter.type = 'lowpass'; this.filter.frequency.value = 620; this.filter.Q.value = 3;
    this.filter.connect(this.gain); this.gain.connect(c.destination);
    this.nodes = [];
    [0, 0.4, -0.35].forEach((det, i) => {
      const o = c.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = 110; o.detune.value = det * 14;
      o.connect(this.filter); o.start();
      this.nodes.push(o);
    });
    // slow breathing LFO on the filter
    this.lfo = c.createOscillator(); this.lfo.frequency.value = 0.07;
    const lg = c.createGain(); lg.gain.value = 190;
    this.lfo.connect(lg); lg.connect(this.filter.frequency); this.lfo.start();
  },
  setVolume(v) {
    Audio.musicVolume = v;
    if (typeof Ambience !== 'undefined') Ambience.refresh();
    if (this.gain && Audio.ctx && this.current && this.THEMES[this.current]) {
      try { this.gain.gain.setTargetAtTime(0.055 * v, Audio.ctx.currentTime, 0.3); } catch(e){}
    }
  },
  stop() {
    this.current = 'none';
    if (this.gain && Audio.ctx) { try { this.gain.gain.setTargetAtTime(0, Audio.ctx.currentTime, 0.5); } catch(e){} }
  },
  duck(on) {
    if (!this.gain || !Audio.ctx) return;
    const base = (this.current && this.THEMES[this.current]) ? 0.055 * Audio.musicVolume : 0;
    try { this.gain.gain.setTargetAtTime(on ? 0 : base, Audio.ctx.currentTime, on ? 0.05 : 1.0); } catch(e){}
  }
};

/* =====================================================================
   AMBIENCE — filtered noise whose level follows the weather, plus a
   per-zone room tone. Synthesised, so the game still ships as one file.
===================================================================== */
const Ambience = {
  src:null, filter:null, gain:null, hiss:null, hissGain:null, cur:null, started:false,
  ZONES: {
    street:{cut:900,base:.16,hiss:.05}, town:{cut:800,base:.14,hiss:.04},
    indoor:{cut:340,base:.05,hiss:.02}, cafe:{cut:520,base:.07,hiss:.05},
    forest:{cut:1200,base:.20,hiss:.07}, hell:{cut:150,base:.22,hiss:.03},
    none:{cut:200,base:0,hiss:0},
  },
  start() {
    if (this.started || !Audio.ctx) return;
    const c = Audio.ctx, n = c.sampleRate * 2;
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i=0;i<n;i++) { const w = Math.random()*2-1; last = (last + .02*w)/1.02; d[i] = last*3.2; }
    this.src = c.createBufferSource(); this.src.buffer = buf; this.src.loop = true;
    this.filter = c.createBiquadFilter(); this.filter.type='lowpass'; this.filter.frequency.value=600;
    this.gain = c.createGain(); this.gain.gain.value = 0;
    this.src.connect(this.filter); this.filter.connect(this.gain); this.gain.connect(c.destination);
    this.src.start();
    const hb = c.createBuffer(1, n, c.sampleRate), hd = hb.getChannelData(0);
    for (let i=0;i<n;i++) hd[i] = (Math.random()*2-1)*.5;
    this.hiss = c.createBufferSource(); this.hiss.buffer = hb; this.hiss.loop = true;
    const hf = c.createBiquadFilter(); hf.type='bandpass'; hf.frequency.value=3400; hf.Q.value=.7;
    this.hissGain = c.createGain(); this.hissGain.gain.value = 0;
    this.hiss.connect(hf); hf.connect(this.hissGain); this.hissGain.connect(c.destination);
    this.hiss.start();
    this.started = true;
  },
  set(zone) {
    this.start();
    if (!Audio.ctx || !this.gain) return;
    const z = this.ZONES[zone] || this.ZONES.indoor;
    this.cur = zone;
    const t = Audio.ctx.currentTime;
    const rain = (typeof Weather !== 'undefined') ? Weather.cur.rain : 0;
    const vol = Audio.musicVolume;
    try {
      this.filter.frequency.setTargetAtTime(z.cut + rain*700, t, 1.2);
      this.gain.gain.setTargetAtTime((z.base + rain*.12) * vol, t, 1.4);
      this.hissGain.gain.setTargetAtTime((z.hiss + rain*.09) * vol, t, 1.4);
    } catch(e) {}
  },
  refresh() { if (this.cur) this.set(this.cur); },
  stop() {
    if (this.gain && Audio.ctx) { try {
      this.gain.gain.setTargetAtTime(0, Audio.ctx.currentTime, .5);
      this.hissGain.gain.setTargetAtTime(0, Audio.ctx.currentTime, .5);
    } catch(e){} }
    this.cur = null;
  }
};

/* --- stat helpers --- */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function addStats(delta) {
  if (!gameState || !delta) return;
  for (const k in delta) {
    if (gameState.stats[k] === undefined) continue;
    gameState.stats[k] = clamp(gameState.stats[k] + delta[k], 0, 100);
  }
  FX.refreshCorruption();
}
function S(k) { return gameState ? gameState.stats[k] : 0; }
function F(k) { return !!(gameState && gameState.flags[k]); }
function setFlag(k, v=true) {
  if (!gameState) return;
  const before = gameState.flags[k];
  gameState.flags[k] = v;
  if (before !== v && typeof World !== 'undefined') {
    World.invalidate();                       // the world repaints as the story turns
    if (typeof Weather !== 'undefined' && Rooms[gameState.currentRoom]) Weather.apply(Rooms[gameState.currentRoom]);
  }
}
function C(k) { return (gameState && gameState.counters[k]) || 0; }
function addC(k, v=1) { if (gameState) gameState.counters[k] = (gameState.counters[k]||0) + v; }
function hasItem(n) { return !!(gameState && gameState.inventory.includes(n)); }
function amuletCount() {
  if (!gameState) return 0;
  return gameState.inventory.filter(i => i.startsWith('Амулет')).length;
}

function withA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c((n>>16)&255)},${c((n>>8)&255)},${c(n&255)})`;
}

/* =====================================================================
   ART — a library of reusable props drawn once into offscreen canvases.
   Every prop declares its own footprint, so room collision is derived
   from what you can actually see instead of hand-written wall rectangles.

   def(key, {w,h,ax,ay,foot,solid,tall,light}, draw)
     w,h   size of the sprite
     ax,ay anchor inside the sprite — the point that sits on the floor
     foot  collision box relative to the anchor (null = walkable)
===================================================================== */
const Art = {
  defs:{}, cache:{},
  def(key, meta, draw) { this.defs[key] = Object.assign({ax:0, ay:0, foot:null}, meta, {draw}); },
  meta(key) { return this.defs[key]; },
  get(key) {
    if (this.cache[key]) return this.cache[key];
    const d = this.defs[key];
    if (!d) return null;
    const c = document.createElement('canvas');
    c.width = d.w; c.height = d.h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    try { d.draw(g, d); } catch(e) { console.error('art', key, e); }
    this.cache[key] = c;
    return c;
  },
  /* footprint of a placed object, in room coordinates */
  footOf(o) {
    const d = this.defs[o.t];
    if (!d || !d.foot) return null;
    return { x:o.x + d.foot.x, y:o.y + d.foot.y, w:d.foot.w, h:d.foot.h };
  },
  drawAt(ctx, o, camX, camY) {
    const img = this.get(o.t); if (!img) return;
    const d = this.defs[o.t];
    ctx.drawImage(img, Math.round(o.x - d.ax - camX), Math.round(o.y - d.ay - camY));
  }
};

/* --- little drawing helpers shared by the props --- */
function shadowEllipse(g, cx, cy, rx, ry, a) {
  g.fillStyle = `rgba(0,0,0,${a === undefined ? .28 : a})`;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); g.fill();
}
/* a 3/4-view box: visible top face plus a front face, the way furniture
   reads in a top-down RPG */
function box34(g, x, y, w, depth, height, topCol, frontCol, sideCol) {
  g.fillStyle = frontCol; g.fillRect(x, y + depth, w, height);
  g.fillStyle = sideCol || shade(frontCol, .8);
  g.fillRect(x, y + depth + height - 2, w, 2);
  g.fillStyle = topCol; g.fillRect(x, y, w, depth);
  g.fillStyle = shade(topCol, 1.12); g.fillRect(x, y, w, 1);
  g.fillStyle = shade(frontCol, .72); g.fillRect(x, y + depth, w, 1);
}
function legs(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.fillRect(x, y, 2, h); g.fillRect(x + w - 2, y, 2, h);
}
function woodGrain(g, x, y, w, h, col) {
  g.fillStyle = col;
  for (let i = 2; i < h; i += 3) g.fillRect(x + 1, y + i, w - 2, 1);
}

/* =====================================================================
   WORLD — the layer that turns rooms from "paint rectangles every frame"
   into a scene: a cached background, a sorted prop layer, weather and light.
===================================================================== */
const World = {
  bgCache:{},          // roomKey -> {key, canvas}
  /* Static background is painted once and blitted afterwards. Rooms declare
     bgKey() when their look depends on story flags, so it repaints only then. */
  background(roomKey) {
    const room = Rooms[roomKey];
    const key = room.bgKey ? room.bgKey() : 'static';
    const hit = this.bgCache[roomKey];
    if (hit && hit.key === key) return hit.canvas;
    const c = document.createElement('canvas');
    c.width = room.w; c.height = room.h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    room.bgPaint(g);
    if (room.wet) this.bakeReflections(g, room);
    this.bgCache[roomKey] = { key, canvas:c };
    return c;
  },
  invalidate(roomKey) { if (roomKey) delete this.bgCache[roomKey]; else this.bgCache = {}; },

  /* Wet asphalt: smear a soft vertical streak under every light source and
     under lit windows. Not physically correct — it just has to read as rain. */
  bakeReflections(g, room) {
    const lights = this.lightsOf(room);
    g.save();
    g.globalCompositeOperation = 'lighter';
    lights.forEach(L => {
      if (L.y > (room.wetFrom || 0) + 260) return;
      const top = L.y + 6, len = 60 + L.r * 0.7;
      const grad = g.createLinearGradient(0, top, 0, top + len);
      grad.addColorStop(0, withA(L.c, 0.28 * (L.i || 1)));
      grad.addColorStop(0.35, withA(L.c, 0.10 * (L.i || 1)));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(L.x - 5, top, 10, len);
      g.fillStyle = withA(L.c, 0.05);
      g.fillRect(L.x - 12, top, 24, len * 0.55);
    });
    g.restore();
  },

  /* Light sources = the room's own list plus any prop that declares one. */
  lightsOf(room) {
    const out = (room.lights || []).map(L => Object.assign({ r:50, c:'#ffcf7a', i:.8 }, L));
    (room.objects || []).forEach(o => {
      if (o.when && !o.when()) return;
      const d = Art.meta(o.t);
      if (d && d.light) out.push({ x:o.x, y:o.y + (d.light.dy||0), r:d.light.r, c:d.light.c, i:d.light.i, flicker:d.light.flicker });
    });
    return out;
  },

  objectsOf(room) { return (room.objects || []).filter(o => !o.when || o.when()); },

  /* Props block movement through their own declared footprint, so level
     collision follows the art instead of a parallel list of rectangles. */
  blockedByProps(room, box) {
    for (const o of this.objectsOf(room)) {
      const f = Art.footOf(o);
      if (f && rectHit(box, f)) return true;
    }
    return false;
  },
};

/* =====================================================================
   WEATHER — rain, fog, wind-blown leaves. Per-room base values, nudged
   by how far the story has gone.
===================================================================== */
const Weather = {
  rainDrops:[], leaves:[], fogPhase:0,
  cur:{ rain:0, fog:0, wind:.2, leaves:0, indoor:false },

  /* Story pressure: the town gets colder and wetter as Naya goes further. */
  storyMod() {
    if (!gameState) return { rain:0, fog:0 };
    let r = 0, f = 0;
    if (F('firstWitchDead'))  { r += .10; f += .10; }
    if (F('secondAmulet'))    { r += .08; f += .18; }
    if (F('sueDead'))         { r += .30; f += .15; }
    if (F('sueRevived'))      { r -= .10; f += .05; }
    if (F('chosenEarthPath')) { r -= .45; f -= .40; }
    if (F('sueRefused'))      { f += .16; }
    return { rain:r, fog:f };
  },
  apply(room) {
    const base = room.weather || {};
    const m = this.storyMod();
    // indoors the story shows up as a haze in the air, not as weather
    const k = base.indoor ? .3 : 1;
    this.cur = {
      rain:   clamp((base.rain||0)   + (base.indoor ? 0 : m.rain), 0, 1),
      fog:    clamp((base.fog||0)    + m.fog * k, 0, base.indoor ? .34 : 1),
      wind:   base.wind === undefined ? .25 : base.wind,
      leaves: base.leaves || 0,
      indoor: !!base.indoor,
    };
  },
  update(dt, room) {
    if (!FX.on()) { this.rainDrops.length = 0; this.leaves.length = 0; return; }
    const f = dt / 16.6;
    const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
    const want = Math.round(this.cur.rain * (this.cur.indoor ? 0 : 70));
    while (this.rainDrops.length < want)
      this.rainDrops.push({ x:Math.random()*(W+40)-20, y:Math.random()*H, l:5+Math.random()*7, s:3.4+Math.random()*2.4 });
    if (this.rainDrops.length > want) this.rainDrops.length = want;
    const drift = this.cur.wind * 1.6;
    for (const d of this.rainDrops) {
      d.y += d.s * f; d.x += drift * f;
      if (d.y > H) { d.y = -8; d.x = Math.random()*(W+40)-20; }
    }
    const wantL = Math.round(this.cur.leaves * 16);
    while (this.leaves.length < wantL)
      this.leaves.push({ x:Math.random()*W, y:Math.random()*H, vy:.18+Math.random()*.3,
                         ph:Math.random()*6.28, c:['#a8412c','#c2702c','#c9992f','#8a4326'][(Math.random()*4)|0], r:Math.random()*6 });
    if (this.leaves.length > wantL) this.leaves.length = wantL;
    for (const L of this.leaves) {
      L.ph += 0.04 * f; L.y += L.vy * f; L.x += (Math.sin(L.ph) * .5 + this.cur.wind) * f; L.r += .04 * f;
      if (L.y > H + 6) { L.y = -6; L.x = Math.random()*W; }
      if (L.x > W + 6) L.x = -6;
    }
    this.fogPhase += dt * 0.006;
  },
  drawFog(ctx) {
    const a = this.cur.fog;
    if (a < 0.02 || !FX.on()) return;
    const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const speed = 8 + i * 5, band = H * (0.28 + i * 0.12);
      const y = ((this.fogPhase * speed + i * 90) % (H + band)) - band * 0.5;
      const grad = ctx.createLinearGradient(0, y, 0, y + band);
      grad.addColorStop(0, 'rgba(178,186,196,0)');
      grad.addColorStop(0.5, `rgba(178,186,196,${(0.16 * a).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(178,186,196,0)');
      ctx.fillStyle = grad; ctx.fillRect(0, y, W, band);
    }
    ctx.fillStyle = `rgba(186,192,200,${(0.10 * a).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  },
  drawRain(ctx) {
    if (!this.rainDrops.length) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(186,204,224,.42)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of this.rainDrops) {
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - this.cur.wind * 3, d.y + d.l);
    }
    ctx.stroke();
    ctx.restore();
  },
  drawLeaves(ctx) {
    for (const L of this.leaves) {
      ctx.save();
      ctx.translate(L.x, L.y); ctx.rotate(L.r);
      ctx.fillStyle = L.c; ctx.fillRect(-2, -1, 4, 2); ctx.fillRect(-1, -2, 2, 4);
      ctx.restore();
    }
  },
};

/* =====================================================================
   LIGHTING — a darkness sheet with holes punched out by light sources.
   Cheap, and it does most of the atmospheric work.
===================================================================== */
const Lighting = {
  buf:null, bctx:null,
  ensure() {
    if (this.buf) return;
    this.buf = document.createElement('canvas');
    this.buf.width = CONFIG.VIEW_W; this.buf.height = CONFIG.VIEW_H;
    this.bctx = this.buf.getContext('2d');
  },
  /* A wedge of daylight through a window, with dust turning in it and a pool
     where it lands. Rooms opt in with sun:{x,y,w,len,tilt,a}. */
  drawSun(ctx, room, camX, camY) {
    const p = room.sun;
    if (!p || !FX.on()) return;
    let a = p.a === undefined ? .1 : p.a;
    if (gameState) {
      if (F('chosenEarthPath')) a *= 1.9;
      else if (F('sueDead') && !F('sueRevived')) a *= .25;
      else if (F('firstWitchDead')) a *= .6;
      a *= (1 - FX.corruption * .7);
    }
    if (a < .012) return;
    const t = Date.now() / 2600;
    const tilt = p.tilt || .2;
    const x = p.x - camX + Math.sin(t) * 5, y = p.y - camY;
    const half = p.w / 2, spread = Math.max(2, half + p.len * Math.abs(tilt));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createLinearGradient(x, y, x + p.len * tilt * .5, y + p.len);
    grad.addColorStop(0, `rgba(255,238,196,${(a*1.25).toFixed(3)})`);
    grad.addColorStop(.55, `rgba(255,226,170,${(a*.5).toFixed(3)})`);
    grad.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - half, y); ctx.lineTo(x + half, y);
    ctx.lineTo(x + spread, y + p.len); ctx.lineTo(x - spread + p.len*tilt, y + p.len);
    ctx.closePath(); ctx.fill();
    const px = x + p.len * tilt * .5, py = y + p.len;
    const pool = ctx.createRadialGradient(px, py, 0, px, py, spread);
    pool.addColorStop(0, `rgba(255,232,180,${(a*.7).toFixed(3)})`);
    pool.addColorStop(1, 'rgba(255,232,180,0)');
    ctx.fillStyle = pool;
    ctx.beginPath(); ctx.ellipse(px, py, spread, spread*.28, 0, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 9; i++) {
      const ph = t * 2 + i * 1.7;
      const dy = (ph * 14) % p.len;
      const dx = Math.sin(ph) * (half * .8);
      ctx.fillStyle = `rgba(255,244,214,${(a * 2.2 * (1 - dy/p.len)).toFixed(3)})`;
      ctx.fillRect(Math.round(x + dx), Math.round(y + dy), 1, 1);
    }
    ctx.restore();
  },

  /* Ambient darkness colour + strength for the current room and story beat. */
  ambientFor(room) {
    const p = room.light || {};
    let tint = p.tint || '#101828';
    let a = p.dark === undefined ? .28 : p.dark;
    if (gameState) {
      if (F('sueDead') && !F('sueRevived')) a += .12;
      if (F('chosenWitchPath')) { tint = '#2a0410'; a += .10; }
      if (F('chosenEarthPath')) a = Math.max(0, a - .18);
      a += FX.corruption * .10;
    }
    return { tint, a: clamp(a, 0, .82) };
  },
  draw(ctx, room, camX, camY) {
    if (!FX.on()) return;
    const amb = this.ambientFor(room);
    if (amb.a < 0.02) return;
    this.ensure();
    const g = this.bctx, W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = withA(amb.tint, amb.a);
    g.clearRect(0, 0, W, H); g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'destination-out';
    const t = Date.now();
    for (const L of World.lightsOf(room)) {
      const x = L.x - camX, y = L.y - camY;
      if (x < -L.r || x > W + L.r || y < -L.r || y > H + L.r) continue;
      const fl = L.flicker ? (0.86 + 0.14 * Math.sin(t / 90 + x)) : 1;
      const r = L.r * fl;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(0,0,0,${Math.min(1, (L.i||.8) * fl)})`);
      grad.addColorStop(0.55, `rgba(0,0,0,${(L.i||.8) * fl * 0.42})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.buf, 0, 0);
    // warm bloom on top of the lamps themselves
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const L of World.lightsOf(room)) {
      const x = L.x - camX, y = L.y - camY;
      if (x < -L.r || x > W + L.r || y < -L.r || y > H + L.r) continue;
      const fl = L.flicker ? (0.86 + 0.14 * Math.sin(t / 90 + x)) : 1;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, L.r * 0.6 * fl);
      grad.addColorStop(0, withA(L.c, 0.18 * (L.i || .8)));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, L.r * 0.6 * fl, 0, Math.PI*2); ctx.fill();
      if ((L.i || .8) > .45) {              // faint anamorphic glint on strong lamps
        const gl = ctx.createLinearGradient(x - L.r*.9, y, x + L.r*.9, y);
        gl.addColorStop(0, 'rgba(0,0,0,0)');
        gl.addColorStop(.5, withA(L.c, 0.10 * fl));
        gl.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gl; ctx.fillRect(x - L.r*.9, y - 1.5, L.r*1.8, 3);
      }
    }
    ctx.restore();
  }
};

/* =====================================================================
   FX — particles, shake, glitch, flashes, magic circle, corruption
===================================================================== */
const FX = {
  particles:[], shake:0, shakeDecay:0.9,
  corruption:0,          // 0..1 — how far Naya has slipped
  tint:null, tintA:0,
  magic:null,            // {x,y,r,t,color}
  fogA:0,
  enabled:true,

  clearAll() {
    this.particles.length = 0; this.shake = 0; this.tint = null; this.tintA = 0;
    this.magic = null; this.fogA = 0;
    document.getElementById('glitchOverlay').style.opacity = 0;
    document.getElementById('flashOverlay').style.opacity = 0;
    document.getElementById('vignette').style.opacity = 0;
    document.getElementById('dialogueBox').classList.remove('shakeText');
  },
  on() { return this.enabled && (!gameState || gameState.settings.effects); },

  refreshCorruption() {
    if (!gameState) { this.corruption = 0; return; }
    let c = 0;
    if (F('firstWitchDead')) c += .22;
    if (F('secondAmulet'))   c += .16;
    if (F('sueDead'))        c += .26;
    if (F('sueLeftDead'))    c += .30;
    if (F('chosenWitchPath'))c += .20;
    if (F('chosenEarthPath'))c -= .55;
    if (F('sueRevived'))     c -= .10;
    c += Math.max(0, (S('witchAmbition') - 35) / 130);
    c -= Math.max(0, (S('humanity') - 60) / 220);
    const prev = Math.round(this.corruption * 4);
    this.corruption = clamp(c, 0, 1);
    if (Math.round(this.corruption * 4) !== prev && typeof World !== 'undefined') World.invalidate();
    const v = document.getElementById('vignette');
    v.style.opacity = this.on() ? (this.corruption * 0.85).toFixed(3) : 0;
  },

  spawn(x, y, n, opts={}) {
    if (!this.on()) return;
    for (let i=0;i<n;i++) {
      this.particles.push({
        x: x + (Math.random()-.5)*(opts.spread||10),
        y: y + (Math.random()-.5)*(opts.spread||10),
        vx: (Math.random()-.5)*(opts.speed||0.6),
        vy: (opts.rise !== undefined ? opts.rise : -0.35) + (Math.random()-.5)*0.3,
        life: opts.life || (40 + Math.random()*50),
        age: 0,
        size: opts.size || 1,
        color: opts.color || '#c060ff',
        grav: opts.grav || 0,
      });
    }
    if (this.particles.length > 320) this.particles.splice(0, this.particles.length - 320);
  },
  ambient(room) {
    if (!this.on()) return;
    if (room.ambient) room.ambient();
  },
  addShake(v) { if (this.on()) this.shake = Math.min(9, this.shake + v); },
  setTint(color, a) { this.tint = color; this.tintA = a; },
  fadeTint() { this.tintA *= 0.94; if (this.tintA < 0.01) { this.tintA = 0; this.tint = null; } },

  flash(color='#fff', dur=180, peak=0.9) {
    const el = document.getElementById('flashOverlay');
    if (!this.on()) return Promise.resolve();
    el.style.background = color;
    el.style.transition = 'none';
    el.style.opacity = peak;
    return new Promise(res => {
      requestAnimationFrame(()=>{
        el.style.transition = `opacity ${dur}ms`;
        el.style.opacity = 0;
        setTimeout(res, dur);
      });
    });
  },
  glitch(dur=400, strength=0.55) {
    const el = document.getElementById('glitchOverlay');
    if (!this.on()) return Promise.resolve();
    el.style.transition = 'none';
    el.style.opacity = strength;
    this.glitchSlices = 12;
    return new Promise(res => {
      setTimeout(()=>{
        el.style.transition = 'opacity 240ms';
        el.style.opacity = 0;
        this.glitchSlices = 0;
        res();
      }, dur);
    });
  },
  glitchSlices:0,

  magicCircle(x, y, color='#c060ff', dur=2200) {
    if (!this.on()) return Promise.resolve();
    this.magic = { x, y, r:4, t:0, dur, color };
    return new Promise(res => setTimeout(()=>{ this.magic = null; res(); }, dur));
  },

  update(dt) {
    const f = dt / 16.6;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * f; p.y += p.vy * f; p.vy += p.grav * f;
      p.age += f;
      if (p.age >= p.life) this.particles.splice(i, 1);
    }
    if (this.shake > 0) { this.shake *= Math.pow(this.shakeDecay, f); if (this.shake < 0.05) this.shake = 0; }
    if (this.magic) this.magic.t += dt;
    this.fadeTint();
    // corruption ambience: occasional red pulse + text jitter
    if (this.on() && this.corruption > 0.35 && Math.random() < 0.0016 * this.corruption) {
      this.setTint('#ff0028', 0.12 * this.corruption);
      Audio.beep(52, 0.12, 'sine', 0.05);
    }
    const db = document.getElementById('dialogueBox');
    db.classList.toggle('shakeText', this.on() && this.corruption > 0.62 && Dialogue.active && Math.random() < 0.35);
  },

  drawParticles(ctx, camX, camY) {
    for (const p of this.particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  },
  drawMagic(ctx, camX, camY) {
    if (!this.magic) return;
    const m = this.magic;
    const prog = Math.min(1, m.t / m.dur);
    const r = 6 + prog * 26;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.4 * Math.sin(m.t / 90);
    ctx.strokeStyle = m.color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(m.x - camX, m.y - camY, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x - camX, m.y - camY, r * 0.62, 0, Math.PI*2); ctx.stroke();
    // pentagram
    ctx.beginPath();
    for (let i=0;i<5;i++) {
      const a = -Math.PI/2 + (i * 4 * Math.PI) / 5 + m.t/1400;
      const px = m.x - camX + Math.cos(a) * r * 0.62;
      const py = m.y - camY + Math.sin(a) * r * 0.62;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
    if (Math.random() < 0.5) this.spawn(m.x, m.y, 1, { color:m.color, spread:r*2, life:36, rise:-0.5 });
  },
  drawOverlay(ctx) {
    if (this.tintA > 0.005 && this.tint) {
      ctx.globalAlpha = this.tintA; ctx.fillStyle = this.tint;
      ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H); ctx.globalAlpha = 1;
    }
    if (this.fogA > 0.01) {
      ctx.globalAlpha = this.fogA; ctx.fillStyle = '#3a0810';
      for (let i=0;i<7;i++) {
        const y = ((Date.now()/(60+i*22) + i*70) % (CONFIG.VIEW_H + 80)) - 40;
        ctx.fillRect(0, y, CONFIG.VIEW_W, 16 + i*3);
      }
      ctx.globalAlpha = 1;
    }
    if (this.glitchSlices > 0 && this.on()) {
      const c = Game.canvas;
      for (let i=0;i<this.glitchSlices;i++) {
        const y = Math.floor(Math.random() * CONFIG.VIEW_H);
        const h = 3 + Math.floor(Math.random()*10);
        const dx = Math.floor((Math.random()-.5) * 22);
        try { ctx.drawImage(c, 0, y, CONFIG.VIEW_W, h, dx, y, CONFIG.VIEW_W, h); } catch(e) {}
      }
    }
  }
};

/* Interior shell: back wall, skirting, floorboards — so every room starts
   from something that reads as a room instead of a coloured rectangle. */
function paintInterior(ctx, w, h, o) {
  o = o || {};
  const wallH = o.wallH || 56;
  ctx.fillStyle = o.wall || PAL.wallIn; ctx.fillRect(0, 0, w, wallH);
  ctx.fillStyle = o.wall2 || PAL.wallIn2;
  if (o.stripes !== false) for (let x = 0; x < w; x += 12) ctx.fillRect(x, 0, 2, wallH);
  ctx.fillStyle = shade(o.wall || PAL.wallIn, .7); ctx.fillRect(0, wallH - 5, w, 3);
  ctx.fillStyle = shade(o.wall || PAL.wallIn, 1.15); ctx.fillRect(0, wallH - 2, w, 2);
  const f1 = o.floor || PAL.floorWood, f2 = o.floor2 || PAL.floorWood2;
  ctx.fillStyle = f1; ctx.fillRect(0, wallH, w, h - wallH);
  ctx.fillStyle = f2;
  if (o.tiles) {
    for (let y = wallH; y < h; y += 16) for (let x = 0; x < w; x += 16)
      if (((x / 16 + y / 16) | 0) % 2) ctx.fillRect(x, y, 16, 16);
  } else {
    for (let y = wallH + 6; y < h; y += 13) ctx.fillRect(0, y, w, 1);
    for (let y = wallH; y < h; y += 13) {
      const off = ((y / 13) | 0) % 2 ? 24 : 0;
      for (let x = off; x < w; x += 56) ctx.fillRect(x, y, 1, 13);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(0, wallH, w, 6);
}

/* Small shared painters */
function paintDoor(ctx, x, y, w=30, h=15) {
  ctx.fillStyle = '#2a1810'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#8a6040'; ctx.fillRect(x+2, y+2, w-4, h-2);
  ctx.fillStyle = '#c0a060'; ctx.fillRect(x+w-7, y+h-6, 3, 3);
}
function paintRunes(ctx, pts, color='#40a0ff', t=0) {
  ctx.save();
  ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t/300);
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  pts.forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-r*.7, y); ctx.lineTo(x+r*.7, y);
    ctx.moveTo(x, y-r*.7); ctx.lineTo(x, y+r*.7); ctx.stroke();
  });
  ctx.restore();
}

    ctx.fillStyle = sky; ctx.fillRect(0,0,W,104);
    ctx.fillStyle = '#5a1018';
    for (let i=0;i<50;i++) ctx.fillRect((i*67)%W, (i*29)%96, 1, 1);
    /* дальний хребет */
    ctx.fillStyle = '#160610';
    for (let x=0;x<W;x+=22) { const h = 26+((x*7)%22); ctx.fillRect(x, 104-h, 22, h); }
    /* мостовая из базальтовых плит */
    ctx.fillStyle = '#1b1017'; ctx.fillRect(0,100,W,H-100);
    ctx.fillStyle = '#231520';
    for (let y=104;y<H;y+=14) for (let x=((y/14)%2)*13;x<W;x+=26) ctx.fillRect(x,y,24,12);
    ctx.fillStyle = '#120a10';
    for (let y=104;y<H;y+=14) ctx.fillRect(0,y+12,W,2);

  bgPaint(ctx) {
    const W = 360, H = 380;
    ctx.fillStyle = '#070308'; ctx.fillRect(0,0,W,H);
    /* дальняя стена зала с гигантской аркой за троном */
    ctx.fillStyle = '#100710'; ctx.fillRect(0,0,W,120);
    ctx.fillStyle = '#180a12';
    for (let y=0;y<120;y+=8) for (let x=((y/8)%2)*15;x<W;x+=30) ctx.fillRect(x,y,28,7);
    const arch = ctx.createLinearGradient(0,10,0,120);
    arch.addColorStop(0,'#5a0c16'); arch.addColorStop(1,'#12030a');
    ctx.fillStyle = arch;
    ctx.beginPath(); ctx.moveTo(126,120); ctx.lineTo(126,58);
    ctx.quadraticCurveTo(180,4,234,58); ctx.lineTo(234,120); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a0a12'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(126,120); ctx.lineTo(126,58);
    ctx.quadraticCurveTo(180,4,234,58); ctx.lineTo(234,120); ctx.stroke(); ctx.lineWidth = 1;
    /* глубина: пол сходится к трону */
    ctx.fillStyle = '#140b12'; ctx.fillRect(0,116,W,H-116);
    ctx.fillStyle = '#1d1119';
    for (let y=120;y<H;y+=16) for (let x=((y/16)%2)*17;x<W;x+=34) ctx.fillRect(x,y,32,14);
    ctx.strokeStyle = 'rgba(120,30,40,.25)'; ctx.lineWidth = 1;
    for (let i=-4;i<=4;i++) {
      ctx.beginPath(); ctx.moveTo(180+i*10, 118); ctx.lineTo(180+i*44, H); ctx.stroke();
    }
    /* ковёр от входа к трону — сужается, даёт перспективу */
    ctx.fillStyle = '#5a1020';
    ctx.beginPath(); ctx.moveTo(150,120); ctx.lineTo(210,120); ctx.lineTo(238,H); ctx.lineTo(122,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6e1626';
    ctx.beginPath(); ctx.moveTo(154,122); ctx.lineTo(206,122); ctx.lineTo(230,H); ctx.lineTo(130,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a2030';
    for (let i=0;i<9;i++) { const t=i/9, y=124+t*(H-124), w=26+t*46; ctx.fillRect(180-w/2, y, w, 1); }
    /* возвышение под троном */
    ctx.fillStyle = '#1a0e14'; ctx.fillRect(132,96,96,26);

trialRoom: {

  bgPaint(ctx) {
    const W = 260, H = 260;
    /* круглая ритуальная комната: каменная кладка и плитняк */
    ctx.fillStyle = '#241d2a'; ctx.fillRect(0,0,W,64);
    ctx.fillStyle = '#2c2433';
    for (let y=0;y<64;y+=8) for (let x=((y/8)%2)*13;x<W;x+=26) ctx.fillRect(x,y,24,7);
    ctx.fillStyle = '#181220'; ctx.fillRect(0,60,W,4);
    ctx.fillStyle = '#3a3340'; ctx.fillRect(0,58,W,2);
    ctx.fillStyle = '#39323f'; ctx.fillRect(0,64,W,H-64);
    ctx.fillStyle = '#433b49';
    for (let y=64;y<H;y+=15) for (let x=((y/15)%2)*16;x<W;x+=32) ctx.fillRect(x,y,30,13);
    ctx.fillStyle = '#2d2733'; for (let y=64;y<H;y+=15) ctx.fillRect(0,y+13,W,2);
    /* круг на полу */
    ctx.strokeStyle = '#7a4ab0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(130,168,86,44,0,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = '#5a3a80';
    ctx.beginPath(); ctx.ellipse(130,168,70,35,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for (let i=0;i<5;i++) {
      const a = -Math.PI/2 + i*Math.PI*4/5;
      const x = 130+Math.cos(a)*68, y = 168+Math.sin(a)*33;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#8a5ab0';
    for (let i=0;i<16;i++) { const a=i*Math.PI/8; ctx.fillRect(130+Math.cos(a)*80-1, 168+Math.sin(a)*40-1, 3, 3); }
    /* знаки на стене */
    ctx.fillStyle = '#6a4a90';
    for (let i=0;i<7;i++) ctx.fillRect(24+i*32, 22, 12, 2);
    for (let i=0;i<7;i++) ctx.fillRect(28+i*32, 28, 5, 2);
    paintDoor(ctx, 115, 245);
  },
  overPaint(ctx) {
    const t = Date.now();
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.12*Math.sin(t/420);
    ctx.strokeStyle = '#c060ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(130,168,86,44,0,0,Math.PI*2); ctx.stroke();

/* Rune disarm helper for witch3House */
function disarmRune(idx, flavour) {
  const done = C('runesDisarmed') || 0;
  if (idx < done) return Dialogue.start([{who:'naya',expr:'normal',text:'Эта уже погасла.'}]);
  if (idx > done) return Dialogue.start([{who:'naya',expr:'talk',text:'Не в этом порядке. Сначала та, что ближе к двери — они связаны.'}]);
  gameState.counters.runesDisarmed = done + 1;
  Audio.rune(); FX.addShake(1.5);
  FX.spawn(Player.x, Player.y - 10, 14, {color:'#40a0ff', spread:16, rise:-0.5, life:50});
  const n = gameState.counters.runesDisarmed;
  const lines = [{who:'naya',expr:'normal',text:flavour}];
  if (n === 1) lines.push({who:'naya',expr:'talk',text:'Одна погасла. Две осталось.'});
  if (n === 2) lines.push({who:'sue',expr:'worried',text:'Ная, тут стало тише. Мне это не нравится, когда становится тише.'});
  if (n === 3) {
    lines.push({who:'naya',expr:'talk',text:'Всё. Защита снята.'});
    lines.push({who:'sue',expr:'worried',text:'И почему мне кажется, что дом просто перестал сопротивляться?'});
  }
  Dialogue.start(lines);
}

   PLAYER + COLLISION
===================================================================== */
const Player = {
  x:120, y:210, w:10, h:8,
  sprite:'naya', dir:'down', moving:false, animFrame:0, animTimer:0,
  currentSprite() {
    // in the prologue the player is little Sue, not Naya
    // площадка существует только в прологе: кто бы там ни стоял, это Сью пяти лет
    if (gameState && gameState.currentRoom === 'playground') return 'sueChild';
    if (F('prologPlayground') && !F('prologueComplete')) return 'sueChild';
    // ветка «Ная выбрала силу» идёт тремя стадиями, а не одной сменой спрайта
    if (F('evilRecognised')) return 'nayaHell';
    if (F('chosenWitchPath')) return 'nayaDark';
    if (F('sueLeftDead')) return F('evilTrialDone') ? 'nayaDark' : 'naya';
    if (FX.corruption > 0.72) return 'nayaDark';
    return 'naya';
  },
  draw(ctx, camX, camY) {
    const img = Assets.images[this.currentSprite()];
    if (!img) return;
    const px = Math.round(this.x - 8 - camX);
    const py = Math.round(this.y - 20 - camY);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(px+8, py+20, 6, 2, 0, 0, Math.PI*2); ctx.fill();
    const bob = this.moving ? (this.animFrame % 2) : 0;
    ctx.drawImage(img, px, py - bob);
  }
};

function playerBox(x, y) { return { x:x - Player.w/2, y:y - Player.h, w:Player.w, h:Player.h }; }
function rectHit(a, b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function isBlocked(x, y) {
  const room = Rooms[gameState.currentRoom];
  const box = playerBox(x, y);
  for (const w of room.walls) if (rectHit(box, w)) return true;
  if (World.blockedByProps(room, box)) return true;
  for (const n of roomNPCs(room)) {
    if (rectHit(box, { x:n.x-6, y:n.y-6, w:12, h:8 })) return true;
  }
  return false;
}

function tryMove(dx, dy) {
  const room = Rooms[gameState.currentRoom];
  const nx = Player.x + dx, ny = Player.y + dy;
  if (!isBlocked(nx, Player.y)) Player.x = clamp(nx, 4, room.w - 4);
  if (!isBlocked(Player.x, ny)) Player.y = clamp(ny, Player.h, room.h - 2);
}

function unstickPlayer() {
  const room = Rooms[gameState.currentRoom];
  if (!isBlocked(Player.x, Player.y)) return;
  for (let r = 2; r < 110; r += 2) {
    for (let ang = 0; ang < 360; ang += 15) {
      const rad = ang * Math.PI / 180;
      const tx = Player.x + Math.cos(rad)*r, ty = Player.y + Math.sin(rad)*r;
      if (tx < 4 || tx > room.w-4 || ty < Player.h || ty > room.h-2) continue;
      if (!isBlocked(tx, ty)) { Player.x = tx; Player.y = ty; return; }
    }
  }
}

/* =====================================================================
   ROOM MANAGEMENT
===================================================================== */
async function changeRoom(roomKey, x, y) {
  const wasCutscene = (Game.mode === 'cutscene');
  Game.mode = 'transition';
  Audio.door();
  await fadeOut(300);
  gameState.currentRoom = roomKey;
  Player.x = x; Player.y = y;
  unstickPlayer();
  gameState.playerX = Player.x; gameState.playerY = Player.y;
  FX.particles.length = 0; FX.fogA = 0; FX.magic = null;
  const room = Rooms[roomKey];
  Music.play(room.music || 'home');
  Weather.apply(room);
  Ambience.set(room.zone || (room.weather && room.weather.indoor ? 'indoor' : 'street'));
  Game.mode = wasCutscene ? 'cutscene' : 'explore';
  await fadeIn(300);
  UI.toast(room.name, 1200);
  if (room.onEnter) room.onEnter();
  saveGame();
}

/* =====================================================================
   DIALOGUE + CHOICES
===================================================================== */
const Dialogue = {
  active:false, queue:[], index:0, currentLine:null,
  typedChars:0, typeTimer:0, fullDone:false, onComplete:null,
  awaitingChoice:false,

  start(lines, onComplete) {
    if (!Array.isArray(lines)) lines = [lines];
    this.queue = lines.slice();
    this.index = 0;
    this.active = true;
    this.awaitingChoice = false;
    this.onComplete = onComplete || null;
    if (Game.mode !== 'cutscene') Game.mode = 'dialogue';
    document.getElementById('dialogueBox').classList.add('active');
    document.getElementById('tapCatcher').classList.add('show');
    UI.dimControls(true);
    this._loadLine();
  },

  _loadLine() {
    while (this.index < this.queue.length) {
      const line = this.queue[this.index];

      if (line.action) {
        try { line.action(); } catch(e) { console.error(e); }
        this.index++; continue;
      }
      if (line.if) {
        let branch = [];
        try { branch = line.if() ? (line.then||[]) : (line.else||[]); } catch(e) { console.error(e); }
        this.queue.splice(this.index, 1, ...branch);
        continue;
      }
      if (line.choice) { this._showChoice(line.choice); return; }

      this.currentLine = line;
      this.typedChars = 0; this.typeTimer = 0; this.fullDone = false;

      const p = document.getElementById('portrait');
      const key = `${line.who}_${line.expr||'normal'}`;
      const url = Assets.portraitURL[key] || Assets.portraitURL[`${line.who}_normal`];
      if (url) { p.style.display = 'block'; p.style.backgroundImage = `url(${url})`; }
      else p.style.display = 'none';

      const nameMap = {
        naya:'Ная', nayaDark:'Ная', nayaHell:'Ная', sue:'Сью', sueGhost:'Сью',
        chris:'Крис', charlotte:'Шарлотта', lilith:'Лиллит', genevieve:'Женевьева',
        witch1:'Мадлен', witch2:'Роза', witch3:'Старшая', acolyte:'Ученица',
        neighbor:'Соседка', imp:'Житель ада', customer:'Посетитель',
        mother:'Медея', dorothy:'Дороти', narrator:''
      };
      document.getElementById('speakerName').textContent =
        (line.name !== undefined) ? line.name : (nameMap[line.who] || '');
      document.getElementById('dialogueText').textContent = '';
      document.getElementById('dialogueHint').style.display = '';
      return;
    }
    this.end();
  },

  _showChoice(choice) {
    this.awaitingChoice = true;
    this.currentLine = null;
    const box = document.getElementById('choiceBox');
    const opts = document.getElementById('choiceOptions');
    document.getElementById('choicePrompt').textContent = choice.prompt || '';
    document.getElementById('dialogueHint').style.display = 'none';
    opts.innerHTML = '';
    const list = (choice.options || []).filter(o => (!o.when || o.when()) && gateOpen(o));
    let firstGate = null;
    list.forEach(o => {
      const b = document.createElement('button');
      b.className = 'choiceOpt';
      const m = o.gate ? STAT_META[o.gate.stat] : null;
      let tag = o.tag ? `<span class="tag">${o.tag}</span>` : '';
      if (m) {
        b.classList.add('gated');
        b.style.setProperty('--gate', m.color);
        b.style.setProperty('--gateSolid', `rgba(${m.rgb},.55)`);
        b.style.borderColor = m.color;
        b.style.background = `linear-gradient(180deg, rgba(${m.rgb},.17), rgba(16,6,12,.98))`;
        b.style.boxShadow = `0 0 12px rgba(${m.rgb},.34), 0 2px 0 rgba(0,0,0,.5)`;
        tag = `<span class="tag">✦ ${m.label}</span>`;
        if (!firstGate) firstGate = m;
      }
      b.innerHTML = tag + o.text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); this._pick(o); });
      opts.appendChild(b);
    });
    this._showGateHint(firstGate);
    box.classList.add('show');
    box.classList.remove('locked');
    box.scrollTop = 0;
    document.getElementById('gameContainer').classList.add('choosing');
    // lift the dialogue box clear of the options so the line being answered stays readable
    const dbox = document.getElementById('dialogueBox');
    dbox.classList.add('compact');
    requestAnimationFrame(() => {
      const h = box.getBoundingClientRect().height;
      dbox.style.bottom = 'calc(' + Math.round(h + 22) + 'px + env(safe-area-inset-bottom))';
    });
  },
  /* Explain the mechanic once, the very first time a stat-gated option shows up. */
  _showGateHint(m) {
    const hint = document.getElementById('gateHint');
    hint.classList.remove('show');
    if (!m) return;
    hint.style.setProperty('--gate', m.color);
    hint.style.setProperty('--gateDim', `rgba(${m.rgb},.10)`);
    if (META.hints && META.hints.gatedChoice) {
      // seen before — the colour and the tag are enough on their own
      return;
    }
    hint.innerHTML = '✦ <b>Подсвеченный вариант доступен не всегда.</b><br>' +
                     'Он открылся, ' + m.why + '. Такие ответы появляются сами — ' +
                     'из-за того, как вы вели себя раньше, а не потому, что вы их выбрали.';
    hint.classList.add('show');
    META.hints = META.hints || {};
    META.hints.gatedChoice = true;
    saveMeta();
    Audio.chime();
  },
  _restoreDialogueBox() {
    const dbox = document.getElementById('dialogueBox');
    dbox.classList.remove('compact');
    dbox.style.bottom = '';
  },

  _pick(o) {
    const box = document.getElementById('choiceBox');
    if (box.classList.contains('locked')) return;
    box.classList.add('locked');                 // prevents double-tap
    Audio.select();
    if (o.stats) addStats(o.stats);
    if (o.set) for (const k in o.set) setFlag(k, o.set[k]);
    if (o.counter) for (const k in o.counter) addC(k, o.counter[k]);
    if (o.do) { try { o.do(); } catch(e) { console.error(e); } }
    setTimeout(() => {
      box.classList.remove('show');
      box.classList.remove('locked');
      document.getElementById('gameContainer').classList.remove('choosing');
      document.getElementById('gateHint').classList.remove('show');
      this._restoreDialogueBox();
      this.awaitingChoice = false;
      const follow = o.then || [];
      this.queue.splice(this.index, 1, ...follow);
      this._loadLine();
      saveGame();
    }, 120);
  },

  update(dt) {
    if (!this.active || this.awaitingChoice || !this.currentLine || this.fullDone) return;
    this.typeTimer += dt;
    const spd = 1000 / (gameState.settings.textSpeed || 30);
    while (this.typeTimer > spd && this.typedChars < this.currentLine.text.length) {
      this.typedChars++; this.typeTimer -= spd;
      if (this.typedChars % 3 === 0) Audio.talk();
    }
    document.getElementById('dialogueText').textContent =
      this.currentLine.text.substring(0, this.typedChars);
    if (this.typedChars >= this.currentLine.text.length) this.fullDone = true;
  },

  advance() {
    if (!this.active || this.awaitingChoice) return;
    if (!this.fullDone && this.currentLine) {
      this.typedChars = this.currentLine.text.length;
      document.getElementById('dialogueText').textContent = this.currentLine.text;
      this.fullDone = true;
      return;
    }
    this.index++;
    this._loadLine();
  },

  end() {
    this.active = false; this.currentLine = null; this.awaitingChoice = false;
    document.getElementById('dialogueBox').classList.remove('active');
    document.getElementById('dialogueBox').classList.remove('shakeText');
    document.getElementById('tapCatcher').classList.remove('show');
    document.getElementById('choiceBox').classList.remove('show');
    document.getElementById('gameContainer').classList.remove('choosing');
    document.getElementById('gateHint').classList.remove('show');
    this._restoreDialogueBox();
    if (Game.mode === 'dialogue') Game.mode = 'explore';
    if (Game.mode !== 'cutscene') UI.dimControls(false);
    const cb = this.onComplete; this.onComplete = null;
    if (cb) cb();
    saveGame();
  }
};

/* =====================================================================
   INTERACTION
===================================================================== */
function findNearestInteractable() {
  const room = Rooms[gameState.currentRoom];
  let best = null, bestD = 30*30;
  const px = Player.x, py = Player.y - 8;
  for (const it of roomObjs(room)) {
    const cx = it.x + it.w/2, cy = it.y + it.h/2;
    const d = (cx-px)*(cx-px) + (cy-py)*(cy-py);
    if (d < bestD) { bestD = d; best = { type:'obj', ref:it }; }
  }
  for (const n of roomNPCs(room)) {
    const d = (n.x-px)*(n.x-px) + (n.y-py)*(n.y-py);
    if (d < bestD) { bestD = d; best = { type:'npc', ref:n }; }
  }
  return best;
}

function doInteract() {
  if (Dialogue.active) { Dialogue.advance(); return; }
  if (Game.mode === 'cutscene') return;
  if (Game.mode !== 'explore') return;
  const near = findNearestInteractable();
  if (!near) return;
  Audio.click();
  if (near.type === 'obj') near.ref.action();
  else if (near.ref.dialogue) near.ref.dialogue();
}

/* =====================================================================
   SCENE ENGINE
===================================================================== */
const Scene = {
  active:false,
  play(name) {
    if (this.active) { this.pending = name; return; }
    const scr = Scripts[name];
    if (!scr) { console.warn('No script:', name); return; }
    this.active = true;
    Game.mode = 'cutscene';
    UI.dimControls(true);
    this._runList(scr).then(() => {
      this.active = false;
      if (Game.mode === 'cutscene') Game.mode = 'explore';
      if (!Dialogue.active) UI.dimControls(false);
      const f = document.getElementById('fade');
      if (f.classList.contains('show') && !Game.endingShown) {
        f.style.transition = 'opacity 400ms'; f.classList.remove('show');
      }
      saveGame();
      if (this.pending) { const p = this.pending; this.pending = null; this.play(p); }
    }).catch(e => {
      console.error('Scene error', e);
      this.active = false;
      if (Game.mode === 'cutscene') Game.mode = 'explore';
      UI.dimControls(false);
      const f = document.getElementById('fade');
      f.style.transition = 'opacity 400ms'; f.classList.remove('show');
    });
  },
  pending:null,

  async _runList(list) {
    let cur = list, i = 0, guard = 0;
    while (i < cur.length) {
      if (++guard > 4000) { console.warn('Scene guard tripped'); break; }
      const r = await this._exec(cur[i]);
      if (r && r.goto) {
        const nxt = Scripts[r.goto];
        if (!nxt) { console.warn('No script:', r.goto); break; }
        cur = nxt; i = 0; continue;
      }
      i++;
    }
  },

  async _exec(cmd) {
    if (typeof cmd === 'function') { const r = await cmd(); return r; }
    if (cmd.dlg)  { await new Promise(res => Dialogue.start(cmd.dlg, res)); return; }
    if (cmd.fadeOut !== undefined) { await fadeOut(cmd.fadeOut); return; }
    if (cmd.fadeIn  !== undefined) { await fadeIn(cmd.fadeIn);  return; }
    if (cmd.wait)   { await wait(cmd.wait); return; }
    if (cmd.title)  { await flashTitle(cmd.title, cmd.dur || 1500); return; }
    if (cmd.room)   { await changeRoom(cmd.room, cmd.x||120, cmd.y||210); return; }
    if (cmd.flag)   { setFlag(cmd.flag, cmd.value === undefined ? true : cmd.value); FX.refreshCorruption(); return; }
    if (cmd.act !== undefined) { gameState.act = cmd.act; return; }
    if (cmd.stats)  { addStats(cmd.stats); return; }
    if (cmd.sfx)    { if (Audio[cmd.sfx]) Audio[cmd.sfx](); return; }
    if (cmd.music !== undefined) { Music.play(cmd.music); return; }
    if (cmd.duck !== undefined)  { Music.duck(cmd.duck); return; }
    if (cmd.item)   {
      if (!hasItem(cmd.item)) gameState.inventory.push(cmd.item);
      UI.updateInventory(); Audio.item(); UI.toast('Получено: ' + cmd.item); return;
    }
    if (cmd.removeItem) { gameState.inventory = gameState.inventory.filter(i => i !== cmd.removeItem); UI.updateInventory(); return; }
    if (cmd.memory) { Memories.unlock(cmd.memory); return; }
    if (cmd.shake)  { FX.addShake(cmd.shake); return; }
    if (cmd.flash)  { await FX.flash(cmd.flash, cmd.dur||200, cmd.peak===undefined?0.85:cmd.peak); return; }
    if (cmd.glitch) { await FX.glitch(cmd.glitch, cmd.strength||0.55); return; }
    if (cmd.magic)  { await FX.magicCircle(Player.x, Player.y - 4, cmd.magic, cmd.dur||2000); return; }
    if (cmd.fx)     { await FXScenes[cmd.fx](); return; }
    if (cmd.star !== undefined) { Prologue.addStar(cmd.star); return; }
    if (cmd.crackStar !== undefined) { Prologue.crackStar(cmd.crackStar); return; }
    if (cmd.medea !== undefined)  { Prologue.showMedea = cmd.medea; return; }
    if (cmd.lilithFig !== undefined) { Prologue.showLilith = cmd.lilithFig; return; }
    if (cmd.crystalGlow !== undefined) { Prologue.crystalGlow = cmd.crystalGlow; return; }
    if (cmd.stones) { Prologue.liftStones(cmd.stones[0], cmd.stones[1], cmd.stones[2] || 5); return; }
    if (cmd.butterfly) { await Prologue.flyButterfly(cmd.butterfly.from, cmd.butterfly.to, cmd.butterfly.ms || 1400); return; }
    if (cmd.resetProlog) { Prologue.reset(); return; }
    if (cmd.checkpoint) { saveCheckpoint(cmd.checkpoint); return; }
    if (cmd.montage){ await Montage.run(cmd.montage); return; }
    if (cmd.goto)   { return { goto: cmd.goto }; }
    if (cmd.jump)   { const n = cmd.jump(); return n ? { goto:n } : undefined; }
    if (cmd.ending) { await Endings.show(cmd.ending); return; }
    return;
  }
};

/* =====================================================================
   PROLOGUE STAGING — the four black stars, Naya's first magic, and the
   butterfly. Drawn straight onto the room canvas so the prologue uses the
   same renderer as the rest of the game.
===================================================================== */
const Prologue = {
  stars: [], starWords: ['ВИДЬ СКВОЗЬ', 'ПОДЧИНЯЙ', 'РАЗРУШАЙ', 'ТВОРИ'],
  showMedea:false, showLilith:false, crystalGlow:0,
  stones: [], stonesT:0,
  butterfly:null, glow:0, floatSue:0,

  reset() {
    this.stars = []; this.showMedea = false; this.showLilith = false;
    this.crystalGlow = 0; this.stones = []; this.stonesT = 0;
    this.butterfly = null; this.glow = 0; this.floatSue = 0;
  },
  addStar(i) { this.stars.push({ i, t:0 }); Audio.beep(140 + i*40, .5, 'sine', .1); },
  crackStar(i) { const st = this.stars.find(s => s.i === i); if (st) st.cracked = true; },

  /* four black stars hanging over the hall, each with its command */
  drawStars(ctx) {
    const t = Date.now();
    this.stars.forEach(st => {
      const x = 44 + st.i * 52, y = 62 + (st.i % 2) * 16;
      const r = 15 + Math.sin(t/700 + st.i) * 1.5;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = st.cracked ? '#2a0810' : '#08060c';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI/2 + k * Math.PI/5, rr = k % 2 ? r * .42 : r;
        k ? ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = st.cracked ? '#ff4030' : '#5a2040';
      ctx.lineWidth = 1; ctx.stroke();
      if (st.cracked) {
        ctx.strokeStyle = '#ff6040';
        ctx.beginPath(); ctx.moveTo(-r*.5, -r*.3); ctx.lineTo(r*.2, r*.5); ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = st.cracked ? '#ff8060' : '#8a6a80';
      ctx.font = '6px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(this.starWords[st.i], x, y + r + 9);
      ctx.textAlign = 'left';
      if (Math.random() < .25) FX.spawn(x, y, 1, {color:'#5a2040', spread:r*2, rise:-.2, life:40});
    });
  },
  drawFigures(ctx) {
    const t = Date.now();
    if (this.showLilith) {                       // a throne-high silhouette
      ctx.fillStyle = 'rgba(10,0,6,.9)';
      ctx.beginPath();
      ctx.moveTo(120, 118); ctx.lineTo(96, 250); ctx.lineTo(144, 250); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1a0208';
      ctx.beginPath(); ctx.arc(120, 112, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2a0410';
      ctx.beginPath(); ctx.moveTo(108,104); ctx.lineTo(100,84); ctx.lineTo(114,100); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(132,104); ctx.lineTo(140,84); ctx.lineTo(126,100); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff2a30';
      ctx.fillRect(113, 110, 3, 2); ctx.fillRect(124, 110, 3, 2);
    }
    if (this.showMedea) {
      const a = .55 + .2 * Math.sin(t/600);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#3a2a3e';
      ctx.beginPath(); ctx.moveTo(70, 176); ctx.lineTo(54, 250); ctx.lineTo(86, 250); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(70, 170, 9, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      if (this.crystalGlow > 0) {
        const cg = this.crystalGlow * (.7 + .3 * Math.sin(t/220));
        const gr = ctx.createRadialGradient(70, 190, 0, 70, 190, 34 * cg);
        gr.addColorStop(0, `rgba(200,120,255,${(.7*cg).toFixed(2)})`);
        gr.addColorStop(1, 'rgba(200,120,255,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(70, 190, 34*cg, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e8c0ff'; ctx.fillRect(68, 188, 4, 5);
        if (Math.random() < .5) FX.spawn(70, 190, 1, {color:'#c060ff', spread:12, rise:-.4, life:50});
      }
    }
  },

  /* pebbles lifting off the ground around little Naya */
  liftStones(x, y, n) {
    for (let i = 0; i < n; i++)
      this.stones.push({ bx:x, by:y, a:(i/n)*6.28, r:10 + i*3, h:0, sp:.6 + i*.12 });
  },
  drawStones(ctx) {
    if (!this.stones.length) return;
    this.stonesT += .03;
    this.stones.forEach(st => {
      st.h = Math.min(18, st.h + .25);
      const x = st.bx + Math.cos(st.a + this.stonesT * st.sp) * st.r;
      const y = st.by - st.h + Math.sin(st.a + this.stonesT * st.sp) * 3;
      ctx.fillStyle = '#6a625a'; ctx.fillRect(Math.round(x), Math.round(y), 3, 2);
      ctx.fillStyle = '#8a827a'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      if (Math.random() < .06) FX.spawn(x, y, 1, {color:'#c060ff', spread:4, rise:-.3, life:30});
    });
  },

  /* the butterfly: a short flight path, then it settles on Sue's hand */
  flyButterfly(from, to, ms) {
    this.butterfly = { x:from[0], y:from[1], fx:from[0], fy:from[1], tx:to[0], ty:to[1], t:0, dur:ms, landed:false };
    return new Promise(r => setTimeout(() => { if (this.butterfly) this.butterfly.landed = true; r(); }, ms));
  },
  drawButterfly(ctx) {
    const b = this.butterfly; if (!b) return;
    if (!b.landed) {
      b.t = Math.min(1, b.t + 16 / b.dur);
      const e = b.t * b.t * (3 - 2 * b.t);
      b.x = b.fx + (b.tx - b.fx) * e;
      b.y = b.fy + (b.ty - b.fy) * e - Math.sin(e * Math.PI) * 22;
    }
    const t = Date.now();
    const flap = Math.abs(Math.sin(t / (b.landed ? 420 : 110)));
    const gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 12);
    gr.addColorStop(0, 'rgba(210,150,255,.55)'); gr.addColorStop(1, 'rgba(210,150,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c8ff';
    const w = 1 + flap * 3;
    ctx.fillRect(b.x - 1 - w, b.y - 2, w, 4);
    ctx.fillRect(b.x + 1,     b.y - 2, w, 4);
    ctx.fillStyle = '#fff0ff'; ctx.fillRect(b.x - 0.5, b.y - 2, 1, 5);
    if (Math.random() < .3) FX.spawn(b.x, b.y, 1, {color:'#c060ff', spread:5, rise:-.2, life:34});
  },
};
