  bgPaint(ctx) {
    const W = 260, H = 260;
    /* круглая ритуальная комната: каменная кладка и плитняк */
    ctx.fillStyle = '#241d2a'; ctx.fillRect(0,0,W,64);
    ctx.fillStyle = '#2c2433';
    for (let y=0;y<64;y+=8) for (let x=((y/8)%2)*13;x<W;x+=26) ctx.fillRect(x,y,24,7);
    ctx.fillStyle = '#181220'; ctx.fillRect(0,60,W,4);
    ctx.fillStyle = '#3a3340'; ctx.fillRect(0,58,W,2);
    ctx.fillStyle = '#39323f'; ctx.fillRect(0,64,W,H-64);
    ctx.fillStyle = '#433b49';
    for (let y=64;y<H;y+=15) for (let x=((y/15)%2)*16;x<W;x+=32) ctx.fillRect(x,y,30,13);
    ctx.fillStyle = '#2d2733'; for (let y=64;y<H;y+=15) ctx.fillRect(0,y+13,W,2);
    /* круг на полу */
    ctx.strokeStyle = '#7a4ab0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(130,168,86,44,0,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = '#5a3a80';
    ctx.beginPath(); ctx.ellipse(130,168,70,35,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for (let i=0;i<5;i++) {
      const a = -Math.PI/2 + i*Math.PI*4/5;
      const x = 130+Math.cos(a)*68, y = 168+Math.sin(a)*33;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#8a5ab0';
    for (let i=0;i<16;i++) { const a=i*Math.PI/8; ctx.fillRect(130+Math.cos(a)*80-1, 168+Math.sin(a)*40-1, 3, 3); }
    /* знаки на стене */
    ctx.fillStyle = '#6a4a90';
    for (let i=0;i<7;i++) ctx.fillRect(24+i*32, 22, 12, 2);
    for (let i=0;i<7;i++) ctx.fillRect(28+i*32, 28, 5, 2);
    paintDoor(ctx, 115, 245);
  },
  overPaint(ctx) {
    const t = Date.now();
    ctx.save();

    sky.addColorStop(0,'#4e5570'); sky.addColorStop(1,'#7d7f8c');

    ctx.fillStyle = '#5f5a52'; ctx.fillRect(0,96,W,10);
    ctx.fillStyle = '#6e6960'; ctx.fillRect(0,96,W,2);
    // газон
    ctx.fillStyle = PAL.grassDry; ctx.fillRect(0,104,W,H-104);

    ctx.fillStyle = '#6a6058'; ctx.fillRect(0,206,W,2); ctx.fillRect(0,240,W,2);
    // боковая дорожка к пруду
    ctx.fillStyle = '#7d7266';
    ctx.beginPath(); ctx.moveTo(190,208); ctx.lineTo(214,208); ctx.lineTo(238,150); ctx.lineTo(220,150); ctx.closePath(); ctx.fill();
    // пруд
    ctx.fillStyle = '#3a4a52'; ctx.beginPath(); ctx.ellipse(250,142,58,26,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a5f6a'; ctx.beginPath(); ctx.ellipse(250,140,53,22,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(200,220,235,.18)';
    ctx.beginPath(); ctx.ellipse(238,134,26,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6a6058'; ctx.beginPath(); ctx.ellipse(250,142,58,26,0,0,Math.PI*2);
    ctx.strokeStyle = '#6a6058'; ctx.stroke();
    // опавшие листья
    const cols = [PAL.leafRed, PAL.leafOrange, PAL.leafGold, '#8a4326'];
    for (let i=0;i<300;i++) {
      const lx = (i*79)%W, ly = 108+((i*43)%188);

      if (dx*dx + dy*dy < 1) continue;                  // на воде листьев не рисуем
      ctx.fillStyle = cols[i%4]; ctx.fillRect(lx, ly, 3, 2);

   Отсюда уезжают надолго, и это должно быть видно: часы под фронтоном,

    ctx.fillStyle = '#523831';
    for (let y = 22; y < 146; y += 11) for (let x = ((y / 11) % 2) * 13; x < W; x += 26) ctx.fillRect(x, y, 24, 10);
    ctx.fillStyle = '#6b4c40'; ctx.fillRect(0, 22, W, 4);
    ctx.fillStyle = '#4a332c';
    ctx.beginPath(); ctx.moveTo(126, 22); ctx.lineTo(170, 2); ctx.lineTo(214, 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8dcc0'; ctx.beginPath(); ctx.arc(170, 32, 11, 0, 6.3); ctx.fill();

    ctx.fillStyle = '#e8dcc0'; ctx.fillRect(169, 25, 2, 8); ctx.fillRect(170, 31, 6, 2);
    [30, 96, 246].forEach(wx => {
      ctx.fillStyle = '#3a2a22'; ctx.fillRect(wx - 3, 52, 44, 62);
      const gl = ctx.createLinearGradient(0, 56, 0, 110);
      gl.addColorStop(0, '#ffe6ae'); gl.addColorStop(1, '#c9985a');
      ctx.fillStyle = gl; ctx.fillRect(wx, 56, 38, 54);
      ctx.beginPath(); ctx.arc(wx + 19, 56, 19, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(58,42,34,.85)';
      ctx.fillRect(wx + 18, 44, 3, 66); ctx.fillRect(wx, 80, 38, 3);
    });
    ctx.fillStyle = '#3a2a22'; ctx.fillRect(150, 58, 44, 60);        // двери в зал ожидания
    ctx.fillStyle = '#5f4530'; ctx.fillRect(153, 62, 38, 56);
    ctx.fillStyle = '#a8c0d8'; ctx.fillRect(157, 68, 13, 26); ctx.fillRect(174, 68, 13, 26);
    ctx.fillStyle = '#c9a05a'; ctx.fillRect(170, 96, 3, 5);
    ctx.fillStyle = '#2e2820'; ctx.fillRect(118, 122, 104, 16);      // вывеска
    ctx.fillStyle = '#e8dcc0'; ctx.font = '8px Courier New'; ctx.fillText('В О К З А Л', 134, 134);
    ctx.fillStyle = '#3a2c24'; ctx.fillRect(0, 140, W, 8);           // козырёк перрона
    ctx.fillStyle = '#4e3a30'; ctx.fillRect(0, 140, W, 2);
    // перрон
    ctx.fillStyle = '#6a6660'; ctx.fillRect(0, 148, W, 96);
    ctx.fillStyle = '#5e5a55';
    for (let y = 158; y < 244; y += 14) ctx.fillRect(0, y, W, 1);
    for (let x = 0; x < W; x += 28) ctx.fillRect(x, 148, 1, 96);
    ctx.fillStyle = '#c9a83c'; ctx.fillRect(0, 232, W, 5);           // жёлтая линия
    ctx.fillStyle = '#8a7328'; ctx.fillRect(0, 237, W, 2);
    // пути и вагон у платформы
    ctx.fillStyle = '#2f2c28'; ctx.fillRect(0, 244, W, H - 244);
    ctx.fillStyle = '#413c36'; for (let x = 4; x < W; x += 18) ctx.fillRect(x, 248, 12, 6);
    ctx.fillStyle = '#6e6a62'; ctx.fillRect(0, 250, W, 3);
    ctx.fillStyle = '#3d4a58'; ctx.fillRect(0, 258, W, 42);
    ctx.fillStyle = '#4a5a6a'; ctx.fillRect(0, 258, W, 5);
    ctx.fillStyle = '#2a323c'; ctx.fillRect(0, 296, W, 4);
    for (let x = 12; x < W; x += 46) {
      ctx.fillStyle = '#20262e'; ctx.fillRect(x, 266, 30, 20);
      const wl = ctx.createLinearGradient(0, 266, 0, 286);
      wl.addColorStop(0, '#f0d79a'); wl.addColorStop(1, '#b98f52');
      ctx.fillStyle = wl; ctx.fillRect(x + 2, 268, 26, 16);

    ctx.fillStyle = '#2a2620'; ctx.fillRect(240, 154, 82, 26);
    ctx.fillStyle = '#e8b84a'; ctx.font = '5px Courier New';
    ctx.fillText('18:40   ГОРОД', 246, 164);
    ctx.fillText('единственный', 246, 174);

/* ================================================================
   УНИВЕРСИТЕТ — построен заново по архитектурному плану.

   Здание замкнуто в четырёхугольник вокруг внутреннего двора:

                     СТАРОЕ КРЫЛО (2 этаж)
                            │ служебная лестница ↕
       ЗАПАДНОЕ ──── ВНУТРЕННИЙ ДВОР ──── ВОСТОЧНОЕ
       (театр)                            (аудитории)
                     ГЛАВНЫЙ ХОЛЛ
                      главный вход ↓

   Первый этаж:  холл с парадной лестницей, западное театральное крыло
                 (репетиционный зал, гримёрная, костюмерная, преподава-
                 тельская, театральный зал), восточное аудиторное крыло
                 (библиотека, архив, кабинет Морель, ауд. 14, музыкаль-
                 ная и художественная аудитории), внутренний двор.
   Второй этаж:  центральный коридор с окнами во двор, западное и
                 восточное крылья, старое крыло на севере.
   Ниже и выше:  служебная лестница связывает крышу, старое крыло,
                 подвал и цокольный архив.
   Снаружи:      задний двор с забором и низким окном служебной
                 лестницы — единственный путь внутрь мимо охраны.

   Большая часть дверей заперта: за ними есть помещения, просто они не
   нужны сюжету. Здание должно казаться больше доступной части.
================================================================ */

/* ГЛАВНЫЙ ХОЛЛ. Юг здания: главный вход снизу, проход во внутренний

    // окна главного фасада по краям северной стены
    paintYardWindow(ctx, 34, 18, 62, 66);
    paintYardWindow(ctx, 344, 18, 62, 66);
    [34, 344].forEach(wx => {
      const g = ctx.createLinearGradient(0, wallH, 0, H);
      g.addColorStop(0, 'rgba(255,238,200,.18)'); g.addColorStop(1, 'rgba(255,232,190,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(wx - 6, wallH); ctx.lineTo(wx + 68, wallH);
      ctx.lineTo(wx + 96, H); ctx.lineTo(wx - 34, H); ctx.closePath(); ctx.fill();
    });
    // проход во внутренний двор — сквозной проём в северной стене
    ctx.fillStyle = '#2a3020'; ctx.fillRect(196, 24, 60, 76);
    ctx.fillStyle = 'rgba(150,190,120,.20)'; ctx.fillRect(200, 28, 52, 70);
    ctx.fillStyle = '#3a2c1e'; ctx.fillRect(192, 20, 68, 6); ctx.fillRect(192, 20, 6, 80);

    // проходы в крылья: настоящие арки в боковых стенах
    const arch = (x, label, lx) => {
      ctx.fillStyle = '#3a2c1e'; ctx.fillRect(x, 176, 26, 68);

      ctx.fillStyle = '#c8b8a0'; ctx.font = '6px Courier New'; ctx.fillText(label, lx, 172);
    };
    arch(0, '← ЗАПАДНОЕ', 4); arch(414, 'ВОСТОЧНОЕ →', 372);
    // парадный вход снизу
    ctx.fillStyle = '#3a2c1e'; ctx.fillRect(178, 322, 84, 38);

    ctx.fillStyle = '#a8c0d8'; ctx.fillRect(188, 330, 30, 22); ctx.fillRect(224, 330, 30, 22);
    ctx.fillStyle = '#c8dcec'; ctx.fillRect(188, 330, 30, 5); ctx.fillRect(224, 330, 30, 5);
    ctx.fillStyle = '#c8b8a0'; ctx.font = '7px Courier New'; ctx.fillText('ГЛАВНЫЙ ВХОД', 182, 318);
    // мраморная розетка и парадная лестница
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.beginPath(); ctx.ellipse(222, 250, 82, 36, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(201,160,90,.30)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(222, 250, 78, 34, 0, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(222, 250, 50, 22, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#c8b8a0'; ctx.font = '6px Courier New'; ctx.fillText('НА ВТОРОЙ ЭТАЖ ↑', 306, 116);
  },

    const W = 220, H = 420;

    for (let y = 0; y < H; y += 12) for (let x = ((y / 12) % 2) * 14; x < W; x += 28) ctx.fillRect(x, y, 26, 11);
    ctx.fillStyle = '#3c3c46'; ctx.fillRect(34, 0, 152, H);            // пролёт

    // иначе в темноте шахты лестница читается как ровный пол
    for (let i = 0; i < 7; i++) {
      const w = 128 - i * 8, x = 46 + i * 4;
      ctx.fillStyle = '#575764'; ctx.fillRect(x, 26 + i * 9, w, 8);

    for (let i = 6; i >= 0; i--) {
      const w = 128 - i * 8, x = 46 + i * 4;
      ctx.fillStyle = '#4c4c58'; ctx.fillRect(x, 300 + (6 - i) * 9, w, 8);
      ctx.fillStyle = '#61616e'; ctx.fillRect(x, 300 + (6 - i) * 9, w, 2);
      ctx.fillStyle = '#292932'; ctx.fillRect(x, 306 + (6 - i) * 9, w, 2);

    // низкое окно на задний двор — в левой стене
    ctx.fillStyle = '#20202a'; ctx.fillRect(0, 196, 34, 56);
    const gl = ctx.createLinearGradient(0, 196, 0, 252);
    gl.addColorStop(0, '#5a6470'); gl.addColorStop(1, '#3a4048');
    ctx.fillStyle = gl; ctx.fillRect(4, 200, 26, 48);
    ctx.fillStyle = '#2a2e34'; ctx.fillRect(4, 222, 26, 3); ctx.fillRect(16, 200, 3, 48);
    ctx.fillStyle = '#7d6a4e'; ctx.fillRect(6, 236, 9, 5);             // книга в щели
    // дверь в старое крыло — в правой стене
    ctx.fillStyle = '#241a12'; ctx.fillRect(186, 70, 34, 54);
    ctx.fillStyle = '#0f0b08'; ctx.fillRect(190, 74, 30, 46);

    ctx.fillText('СТАРОЕ КРЫЛО →', 128, 66);
    ctx.fillText('ОКНО', 4, 194);

/* Rune disarm helper for witch3House */
function disarmRune(idx, flavour) {
  const done = C('runesDisarmed') || 0;
  if (idx < done) return Dialogue.start([{who:'naya',expr:'normal',text:'Эта уже погасла.'}]);
  if (idx > done) return Dialogue.start([{who:'naya',expr:'talk',text:'Не в этом порядке. Сначала та, что ближе к двери — они связаны.'}]);
  gameState.counters.runesDisarmed = done + 1;
  Audio.rune(); FX.addShake(1.5);
  FX.spawn(Player.x, Player.y - 10, 14, {color:'#40a0ff', spread:16, rise:-0.5, life:50});
  const n = gameState.counters.runesDisarmed;
  const lines = [{who:'naya',expr:'normal',text:flavour}];
  if (n === 1) lines.push({who:'naya',expr:'talk',text:'Одна погасла. Две осталось.'});
  if (n === 2) lines.push({who:'sue',expr:'worried',text:'Ная, тут стало тише. Мне это не нравится, когда становится тише.'});
  if (n === 3) {
    lines.push({who:'naya',expr:'talk',text:'Всё. Защита снята.'});
    lines.push({who:'sue',expr:'worried',text:'И почему мне кажется, что дом просто перестал сопротивляться?'});
  }
  Dialogue.start(lines);
}

const Player = {
  x:120, y:210, w:10, h:8,
  sprite:'naya', dir:'down', moving:false, animFrame:0, animTimer:0,
  currentSprite() {
    // in the prologue the player is little Sue, not Naya
    // площадка существует только в прологе: кто бы там ни стоял, это Сью пяти лет
    if (gameState && gameState.currentRoom === 'playground') return 'sueChild';
    if (F('prologPlayground') && !F('prologueComplete')) return 'sueChild';
    // дом отца — Нае семнадцать, до основной истории ещё три года
    if (gameState && !F('backstoryDone') &&
        (gameState.currentRoom === 'oldHouse' || gameState.currentRoom === 'oldHouseAttic')) return 'nayaTeen';
    if (F('prologBackstoryStarted') && !F('backstoryDone')) return 'nayaTeen';
    // ветка «Ная выбрала силу» идёт тремя стадиями, а не одной сменой спрайта
    if (F('evilRecognised')) return 'nayaHell';
    if (F('chosenWitchPath')) return 'nayaDark';
    if (F('sueLeftDead')) return F('evilTrialDone') ? 'nayaDark' : 'naya';
    if (FX.corruption > 0.72) return 'nayaDark';
    return 'naya';
  },
  /* lift — подъём над полом только для рисунка: тень остаётся на земле и
     сжимается, столкновения не меняются. Нужен качелям и зависанию в прологе. */
  lift:0,
  draw(ctx, camX, camY) {
    const img = Assets.images[this.currentSprite()];
    if (!img) return;
    const lift = this.lift || 0;
    const px = Math.round(this.x - 8 - camX);
    const py = Math.round(this.y - 20 - camY);
    const k = Math.max(.35, 1 - lift / 46);
    ctx.fillStyle = `rgba(0,0,0,${(.3 * k).toFixed(2)})`;
    ctx.beginPath(); ctx.ellipse(px+8, py+20, 6 * k, 2 * k, 0, 0, Math.PI*2); ctx.fill();
    const bob = this.moving ? (this.animFrame % 2) : 0;
    ctx.drawImage(img, px, py - bob - Math.round(lift));
  }
};

function playerBox(x, y) { return { x:x - Player.w/2, y:y - Player.h, w:Player.w, h:Player.h }; }
function rectHit(a, b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function isBlocked(x, y) {
  const room = Rooms[gameState.currentRoom];
  const box = playerBox(x, y);
  for (const w of room.walls) if (rectHit(box, w)) return true;
  if (World.blockedByProps(room, box)) return true;
  for (const n of roomNPCs(room)) {
    if (n.path) continue;                  // ходячие фоновые NPC не блокируют проход
    if (rectHit(box, { x:n.x-6, y:n.y-6, w:12, h:8 })) return true;
  }
  for (const n of roomCast()) {
    if (rectHit(box, { x:n.x-6, y:n.y-6, w:12, h:8 })) return true;
  }
  return false;
}

function tryMove(dx, dy) {
  const room = Rooms[gameState.currentRoom];
  const nx = Player.x + dx, ny = Player.y + dy;
  if (!isBlocked(nx, Player.y)) Player.x = clamp(nx, 4, room.w - 4);
  if (!isBlocked(Player.x, ny)) Player.y = clamp(ny, Player.h, room.h - 2);
}

function unstickPlayer() {
  const room = Rooms[gameState.currentRoom];
  if (!isBlocked(Player.x, Player.y)) return;
  for (let r = 2; r < 110; r += 2) {
    for (let ang = 0; ang < 360; ang += 15) {
      const rad = ang * Math.PI / 180;
      const tx = Player.x + Math.cos(rad)*r, ty = Player.y + Math.sin(rad)*r;
      if (tx < 4 || tx > room.w-4 || ty < Player.h || ty > room.h-2) continue;
      if (!isBlocked(tx, ty)) { Player.x = tx; Player.y = ty; return; }
    }
  }
}

/* Комнату можно назвать точкой входа, а не координатами: changeRoom('stairwell',
   'fromStairs'). Точки объявлены в самой комнате в поле spawn, поэтому при
   перестановке мебели правится одно место, а не каждый вызов перехода.
   Универсальная точка на все двери сразу — как раз то, из-за чего игрок
   вылезал из тумбочки. */
async function changeRoom(roomKey, x, y) {
  const wasCutscene = (Game.mode === 'cutscene');
  const dest = Rooms[roomKey];
  if (typeof x === 'string') {
    const pt = (dest && dest.spawn && (dest.spawn[x] || dest.spawn.default)) || null;
    if (!pt) console.warn('нет точки входа', roomKey, x);
    x = pt ? pt[0] : (dest ? dest.w / 2 : 0);
    y = pt ? pt[1] : (dest ? dest.h - 40 : 0);
  }
  Game.mode = 'transition';
  Audio.door();
  await fadeOut(300);
  gameState.currentRoom = roomKey;
  Player.x = x; Player.y = y;
  unstickPlayer();
  gameState.playerX = Player.x; gameState.playerY = Player.y;
  FX.particles.length = 0; FX.fogA = 0; FX.magic = null;
  Game.zoom = 1; Game.zoomTo = 1;
  Game.cast = [];
  const room = Rooms[roomKey];
  Patrol.reset(room);
  Music.play(room.music || 'home');
  Weather.apply(room);
  Ambience.set(room.zone || (room.weather && room.weather.indoor ? 'indoor' : 'street'));
  Game.mode = wasCutscene ? 'cutscene' : 'explore';
  await fadeIn(300);
  UI.toast(room.name, 1200);
  if (room.onEnter) room.onEnter();
  saveGame();
}

===================================================================== */
const Dialogue = {
  active:false, queue:[], index:0, currentLine:null,
  typedChars:0, typeTimer:0, fullDone:false, onComplete:null,
  awaitingChoice:false,

  start(lines, onComplete) {
    if (!Array.isArray(lines)) lines = [lines];
    this.queue = lines.slice();
    this.index = 0;
    this.active = true;
    this.awaitingChoice = false;
    this.onComplete = onComplete || null;
    if (Game.mode !== 'cutscene') Game.mode = 'dialogue';
    document.getElementById('dialogueBox').classList.add('active');
    document.getElementById('tapCatcher').classList.add('show');
    UI.dimControls(true);
    this._loadLine();
  },

  _loadLine() {
    while (this.index < this.queue.length) {
      const line = this.queue[this.index];

      if (line.action) {
        try { line.action(); } catch(e) { console.error(e); }
        this.index++; continue;
      }
      if (line.if) {
        let branch = [];
        try { branch = line.if() ? (line.then||[]) : (line.else||[]); } catch(e) { console.error(e); }
        this.queue.splice(this.index, 1, ...branch);
        continue;
      }
      if (line.choice) { this._showChoice(line.choice); return; }

      this.currentLine = line;
      this.typedChars = 0; this.typeTimer = 0; this.fullDone = false;

      const p = document.getElementById('portrait');
      const key = `${line.who}_${line.expr||'normal'}`;
      const url = Assets.portraitURL[key] || Assets.portraitURL[`${line.who}_normal`];
      if (url) { p.style.display = 'block'; p.style.backgroundImage = `url(${url})`; }
      else p.style.display = 'none';

      const nameMap = {
        naya:'Ная', nayaDark:'Ная', nayaHell:'Ная', nayaTeen:'Ная',
        drizella:'Дризелла', stacy:'Стейси', frank:'Фрэнк',
        sue:'Сью', sueGhost:'Сью',
        chris:'Крис', charlotte:'Шарлотта', lilith:'Лиллит', genevieve:'Женевьева',
        witch1:'Мадлен', witch2:'Роза', witch3:'Старшая', acolyte:'Ученица',
        witch4:'Хэтти', witch5:'Лидия', witch6:'Вивиан',
        neighbor:'Соседка', imp:'Житель ада', customer:'Посетитель',
        mother:'Мидея', motherWitch:'Мидея', friend:'Подруга', dorothy:'Дороти', narrator:''
      };
      document.getElementById('speakerName').textContent =
        (line.name !== undefined) ? line.name : (nameMap[line.who] || '');
      document.getElementById('dialogueText').textContent = '';
      document.getElementById('dialogueHint').style.display = '';
      return;
    }
    this.end();
  },

  _showChoice(choice) {
    this.awaitingChoice = true;
    this.currentLine = null;
    const box = document.getElementById('choiceBox');
    const opts = document.getElementById('choiceOptions');
    document.getElementById('choicePrompt').textContent = choice.prompt || '';
    document.getElementById('dialogueHint').style.display = 'none';
    opts.innerHTML = '';
    const list = (choice.options || []).filter(o => (!o.when || o.when()) && gateOpen(o));
    let firstGate = null;
    list.forEach(o => {
      const b = document.createElement('button');
      b.className = 'choiceOpt';
      const m = o.gate ? STAT_META[o.gate.stat] : null;
      let tag = o.tag ? `<span class="tag">${o.tag}</span>` : '';
      if (m) {
        b.classList.add('gated');
        b.style.setProperty('--gate', m.color);
        b.style.setProperty('--gateSolid', `rgba(${m.rgb},.55)`);
        b.style.borderColor = m.color;
        b.style.background = `linear-gradient(180deg, rgba(${m.rgb},.17), rgba(16,6,12,.98))`;
        b.style.boxShadow = `0 0 12px rgba(${m.rgb},.34), 0 2px 0 rgba(0,0,0,.5)`;
        tag = `<span class="tag">✦ ${m.label}</span>`;
        if (!firstGate) firstGate = m;
      }
      b.innerHTML = tag + o.text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); this._pick(o); });
      opts.appendChild(b);
    });
    this._showGateHint(firstGate);
    box.classList.add('show');
    box.classList.remove('locked');
    box.scrollTop = 0;
    document.getElementById('gameContainer').classList.add('choosing');
    // lift the dialogue box clear of the options so the line being answered stays readable
    const dbox = document.getElementById('dialogueBox');
    dbox.classList.add('compact');
    requestAnimationFrame(() => {
      const h = box.getBoundingClientRect().height;
      dbox.style.bottom = 'calc(' + Math.round(h + 22) + 'px + env(safe-area-inset-bottom))';
    });
  },
  /* Explain the mechanic once, the very first time a stat-gated option shows up. */
  _showGateHint(m) {
    const hint = document.getElementById('gateHint');
    hint.classList.remove('show');
    if (!m) return;
    hint.style.setProperty('--gate', m.color);
    hint.style.setProperty('--gateDim', `rgba(${m.rgb},.10)`);
    if (META.hints && META.hints.gatedChoice) {
      // seen before — the colour and the tag are enough on their own
      return;
    }
    hint.innerHTML = '✦ <b>Подсвеченный вариант доступен не всегда.</b><br>' +
                     'Он открылся, ' + m.why + '. Такие ответы появляются сами — ' +
                     'из-за того, как вы вели себя раньше, а не потому, что вы их выбрали.';
    hint.classList.add('show');
    META.hints = META.hints || {};
    META.hints.gatedChoice = true;
    saveMeta();
    Audio.chime();
  },
  _restoreDialogueBox() {
    const dbox = document.getElementById('dialogueBox');
    dbox.classList.remove('compact');
    dbox.style.bottom = '';
  },

  _pick(o) {
    const box = document.getElementById('choiceBox');
    if (box.classList.contains('locked')) return;
    box.classList.add('locked');                 // prevents double-tap
    Audio.select();
    if (o.stats) addStats(o.stats);
    if (o.set) for (const k in o.set) setFlag(k, o.set[k]);
    if (o.counter) for (const k in o.counter) addC(k, o.counter[k]);
    if (o.do) { try { o.do(); } catch(e) { console.error(e); } }
    setTimeout(() => {
      box.classList.remove('show');
      box.classList.remove('locked');
      document.getElementById('gameContainer').classList.remove('choosing');
      document.getElementById('gateHint').classList.remove('show');
      this._restoreDialogueBox();
      this.awaitingChoice = false;
      const follow = o.then || [];
      this.queue.splice(this.index, 1, ...follow);
      this._loadLine();
      saveGame();
    }, 120);
  },

  update(dt) {
    if (!this.active || this.awaitingChoice || !this.currentLine || this.fullDone) return;
    this.typeTimer += dt;
    const spd = 1000 / (gameState.settings.textSpeed || 30);
    while (this.typeTimer > spd && this.typedChars < this.currentLine.text.length) {
      this.typedChars++; this.typeTimer -= spd;
      if (this.typedChars % 3 === 0) Audio.talk();
    }
    document.getElementById('dialogueText').textContent =
      this.currentLine.text.substring(0, this.typedChars);
    if (this.typedChars >= this.currentLine.text.length) this.fullDone = true;
  },

  advance() {
    if (!this.active || this.awaitingChoice) return;
    if (!this.fullDone && this.currentLine) {
      this.typedChars = this.currentLine.text.length;
      document.getElementById('dialogueText').textContent = this.currentLine.text;
      this.fullDone = true;
      return;
    }
    this.index++;
    this._loadLine();
  },

  end() {
    this.active = false; this.currentLine = null; this.awaitingChoice = false;
    document.getElementById('dialogueBox').classList.remove('active');
    document.getElementById('dialogueBox').classList.remove('shakeText');
    document.getElementById('tapCatcher').classList.remove('show');
    document.getElementById('choiceBox').classList.remove('show');
    document.getElementById('gameContainer').classList.remove('choosing');
    document.getElementById('gateHint').classList.remove('show');
    this._restoreDialogueBox();
    if (Game.mode === 'dialogue') Game.mode = 'explore';
    if (Game.mode !== 'cutscene') UI.dimControls(false);
    const cb = this.onComplete; this.onComplete = null;
    if (cb) cb();
    saveGame();
  }
};

/* =====================================================================
   INTERACTION
===================================================================== */
function findNearestInteractable() {
  const room = Rooms[gameState.currentRoom];
  let best = null, bestD = 30*30;
  const px = Player.x, py = Player.y - 8;
  for (const it of roomObjs(room)) {
    const cx = it.x + it.w/2, cy = it.y + it.h/2;
    const d = (cx-px)*(cx-px) + (cy-py)*(cy-py);
    if (d < bestD) { bestD = d; best = { type:'obj', ref:it }; }
  }
  for (const n of roomNPCs(room)) {
    const d = (n.x-px)*(n.x-px) + (n.y-py)*(n.y-py);
    if (d < bestD) { bestD = d; best = { type:'npc', ref:n }; }
  }
  return best;
}

function doInteract() {
  if (Dialogue.active) { Dialogue.advance(); return; }
  if (Game.mode === 'cutscene') return;
  if (Game.mode !== 'explore') return;
  const near = findNearestInteractable();
  if (!near) return;
  Audio.click();
  if (near.type === 'obj') near.ref.action();
  else if (near.ref.dialogue) near.ref.dialogue();
}

const Scene = {
  active:false,
  /* Диспетчеры: их первая команда сама выбирает ветку по дню, счётчику
     или флагу, поэтому их нужно пускать каждый раз. Всё остальное —
     одноразовое: повторное нажатие на того же человека или предмет не
     переигрывает сцену, а отвечает коротким пересказом. Внутренние
     переходы goto не блокируются никогда. */
  DISPATCHERS: new Set([
    'pastCheck','rehearsalWatch','sueRehearsalTalk','sueDayWait','libraryFolk',
    'librarianTalk','archiveFolder15','archiveFolder5','chrisShiftDay',
    'persuadeSue','persuadeResolve','sueHint','distractWitch2','dorothy',
    'dorothyHall','postRevival','lonerDoor','lonerCaughtScene',
  ]),
  seen(name) { return !!(gameState && gameState.scenesSeen && gameState.scenesSeen.includes(name)); },
  mark(name) {
    if (!gameState) return;
    if (!gameState.scenesSeen) gameState.scenesSeen = [];
    if (!gameState.scenesSeen.includes(name)) gameState.scenesSeen.push(name);
  },
  play(name) {
    if (this.active) { this.pending = name; return; }
    const scr = Scripts[name];
    if (!scr) { console.warn('No script:', name); return; }
    if (this.seen(name) && !this.DISPATCHERS.has(name)) { Recap.show(name); return; }
    this._cur = name;
    this.active = true;
    Game.mode = 'cutscene';
    UI.dimControls(true);
    this._runList(scr).then(() => {
      this.mark(name);
      this.active = false;
      Game.cast = [];
      if (Game.mode === 'cutscene') Game.mode = 'explore';
      if (!Dialogue.active) UI.dimControls(false);
      const f = document.getElementById('fade');
      if (f.classList.contains('show') && !Game.endingShown) {
        f.style.transition = 'opacity 400ms'; f.classList.remove('show');
      }
      saveGame();
      if (this.pending) { const p = this.pending; this.pending = null; this.play(p); }
    }).catch(e => {
      console.error('Scene error', e);
      this.active = false;
      const cardUp = document.getElementById('endingScreen').classList.contains('show');
      if (!cardUp) {
        if (Game.mode === 'cutscene' || Game.mode === 'menu') Game.mode = 'explore';
        UI.dimControls(false);
        const f = document.getElementById('fade');
        f.style.transition = 'opacity 400ms'; f.classList.remove('show');
        // концовка уже началась, но карточка не появилась — показываем её силой,
        // иначе игрок остаётся один на один с чёрным экраном
        if (Game.endingShown) Endings.forceCard();
      }
    });
  },
  pending:null,

  async _runList(list) {
    let cur = list, i = 0, guard = 0;
    while (i < cur.length) {
      if (++guard > 4000) { console.warn('Scene guard tripped'); break; }
      const r = await this._exec(cur[i]);
      if (r && r.goto) {
        const nxt = Scripts[r.goto];
        if (!nxt) { console.warn('No script:', r.goto); break; }
        cur = nxt; i = 0; continue;
      }
      i++;
    }
  },

  async _exec(cmd) {
    if (typeof cmd === 'function') { const r = await cmd(); return r; }
    if (cmd.dlg)  { await new Promise(res => Dialogue.start(cmd.dlg, res)); return; }
    if (cmd.fadeOut !== undefined) { await fadeOut(cmd.fadeOut); return; }
    if (cmd.fadeIn  !== undefined) { await fadeIn(cmd.fadeIn);  return; }
    if (cmd.wait)   { await wait(cmd.wait); return; }
    if (cmd.title)  { await flashTitle(cmd.title, cmd.dur || 1500, !!cmd.hold); return; }
    if (cmd.room)   { await changeRoom(cmd.room, cmd.x||120, cmd.y||210); return; }
    if (cmd.flag)   { setFlag(cmd.flag, cmd.value === undefined ? true : cmd.value); FX.refreshCorruption(); return; }
    if (cmd.act !== undefined) { gameState.act = cmd.act; return; }
    if (cmd.stats)  { addStats(cmd.stats); return; }
    if (cmd.sfx)    { if (Audio[cmd.sfx]) Audio[cmd.sfx](); return; }
    if (cmd.music !== undefined) { Music.play(cmd.music); return; }
    if (cmd.duck !== undefined)  { Music.duck(cmd.duck); return; }
    if (cmd.item)   {
      if (!hasItem(cmd.item)) gameState.inventory.push(cmd.item);
      UI.updateInventory(); Audio.item(); UI.toast('Получено: ' + cmd.item); return;
    }
    if (cmd.removeItem) { gameState.inventory = gameState.inventory.filter(i => i !== cmd.removeItem); UI.updateInventory(); return; }
    if (cmd.memory) { Memories.unlock(cmd.memory); return; }
    if (cmd.shake)  { FX.addShake(cmd.shake); return; }
    if (cmd.flash)  { await FX.flash(cmd.flash, cmd.dur||200, cmd.peak===undefined?0.85:cmd.peak); return; }
    if (cmd.glitch) { await FX.glitch(cmd.glitch, cmd.strength||0.55); return; }
    if (cmd.magic)  { await FX.magicCircle(Player.x, Player.y - 4, cmd.magic, cmd.dur||2000); return; }
    if (cmd.fx)     { await FXScenes[cmd.fx](); return; }
    if (cmd.chapter) { await Chapters.show(cmd.chapter, cmd.dur); return; }
    if (cmd.cast)   { Game.cast = cmd.cast.slice(); return; }
    if (cmd.uncast) { Game.cast = []; return; }
    if (cmd.star !== undefined) { Prologue.addStar(cmd.star); return; }
    if (cmd.crackStar !== undefined) { Prologue.crackStar(cmd.crackStar); return; }
    if (cmd.medea !== undefined)  { Prologue.showMedea = cmd.medea; return; }
    if (cmd.lilithFig !== undefined) { Prologue.showLilith = cmd.lilithFig; return; }
    if (cmd.crystalGlow !== undefined) { Prologue.crystalGlow = cmd.crystalGlow; return; }
    if (cmd.stones) { Prologue.liftStones(cmd.stones[0], cmd.stones[1], cmd.stones[2] || 5); return; }
    if (cmd.butterfly) { await Prologue.flyButterfly(cmd.butterfly.from, cmd.butterfly.to, cmd.butterfly.ms || 1400); return; }
    if (cmd.resetProlog) { Prologue.reset(); return; }
    if (cmd.checkpoint) { saveCheckpoint(cmd.checkpoint); return; }
    if (cmd.shift)  { await Shift.run(); return; }
    if (cmd.swing)  { await Prologue.startSwing(cmd.swing, cmd.ms || 900); return; }
    if (cmd.zoom !== undefined) { Game.zoomTo = cmd.zoom; if (cmd.ms) await wait(cmd.ms); return; }
    if (cmd.castWalk) { await Prologue.castWalk(cmd.castWalk.name, cmd.castWalk.to, cmd.castWalk.ms || 1200); return; }
    if (cmd.spark)  { const k = cmd.spark; FX.spawn(k.x, k.y, k.n || 8, k); return; }
    if (cmd.creature) {
      if (cmd.creature === 'gone') { Prologue.creature = null; return; }
      await Prologue.startCreature(cmd.creature, cmd.ms || 1600); return;
    }
    if (cmd.medeaFall) { await Prologue.startFall(cmd.medeaFall); return; }
    if (cmd.swingOff) { Prologue.stopSwing(); return; }
    if (cmd.montage){ await Montage.run(cmd.montage); return; }
    if (cmd.goto)   { return { goto: cmd.goto }; }
    if (cmd.jump)   { const n = cmd.jump(); return n ? { goto:n } : undefined; }
    if (cmd.ending) { await Endings.show(cmd.ending); return; }
    return;
  }
};

/* =====================================================================
   PROLOGUE STAGING — the four black stars, Naya's first magic, and the
   butterfly. Drawn straight onto the room canvas so the prologue uses the
   same renderer as the rest of the game.
===================================================================== */
const Prologue = {
  stars: [], starWords: ['ВИДЬ СКВОЗЬ', 'ПОДЧИНЯЙ', 'РАЗРУШАЙ', 'ТВОРИ'],
  showMedea:false, showLilith:false, crystalGlow:0,
  stones: [], stonesT:0,
  butterfly:null, glow:0, floatSue:0,

  reset() {
    this.stars = []; this.showMedea = false; this.showLilith = false;
    this.crystalGlow = 0; this.stones = []; this.stonesT = 0;
    this.butterfly = null; this.glow = 0; this.floatSue = 0;
    this.swing = null; Player.lift = 0;
    this.creature = null; this.fall = 0; this.fallResolve = null;
  },
  addStar(i) { this.stars.push({ i, t:0 }); Audio.beep(140 + i*40, .5, 'sine', .1); },

  /* СОЗДАНИЕ И ГИБЕЛЬ МИДЕИ.

     Сказ нельзя только читать. Игрок должен увидеть, как из искалеченных
     душ собирается существо — и как оно оказывается безвредным; а потом
     увидеть, как за это её казнят.

     creature: 'gather' — души слетаются к её ладоням;
               'form'   — из них складывается маленькое светлое существо;
               'free'   — существо уходит вверх, живое и целое.
     fall: 0..1 — Мидея оседает и растворяется.                            */
  creature: null, fall: 0,

  startCreature(phase, ms) {
    const c = this.creature || (this.creature = { phase:'gather', t:0, dur:1, souls:[], x:70, y:246 });
    c.phase = phase; c.t = 0; c.dur = ms;
    if (phase === 'gather') {
      c.souls = [];
      for (let i = 0; i < 9; i++)
        c.souls.push({ a: (i / 9) * 6.28, r: 46 + (i % 3) * 14, sp: .4 + (i % 4) * .12, y: 208 + (i % 5) * 12 });
    }
    return new Promise(res => { c.resolve = res; });
  },
  startFall(ms) {
    this.fallDur = ms; this.fallT = 0;
    return new Promise(res => { this.fallResolve = res; });
  },

  updateLegend(dt) {
    const c = this.creature;
    if (c && c.resolve) {
      c.t += dt;
      const k = Math.min(1, c.t / c.dur);
      if (c.phase === 'gather') c.souls.forEach(s => { s.a += s.sp * dt / 900; s.r += (10 - s.r) * (dt / 2600); });
      if (c.phase === 'free')   c.y = 246 - k * 120;
      if (k >= 1) { const r = c.resolve; c.resolve = null; r(); }
    }
    if (this.fallResolve) {
      this.fallT += dt;
      this.fall = Math.min(1, this.fallT / this.fallDur);
      if (this.fall >= 1) { const r = this.fallResolve; this.fallResolve = null; r(); }
    }
  },

  drawCreature(ctx, t) {
    const c = this.creature;
    if (!c) return;
    ctx.save();
    if (c.phase === 'gather' || c.phase === 'form') {
      c.souls.forEach(s => {                       // искалеченные души: рваные бледные огоньки
        const x = c.x + Math.cos(s.a) * s.r, y = s.y + Math.sin(s.a) * s.r * .4;
        ctx.globalAlpha = .55 + .35 * Math.sin(t / 300 + s.a);
        ctx.fillStyle = '#b8a0d8'; ctx.fillRect(Math.round(x), Math.round(y), 2, 3);
        ctx.fillStyle = '#e0d0ff'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      });
    }
    if (c.phase === 'form' || c.phase === 'free') {
      const k = c.phase === 'form' ? Math.min(1, c.t / c.dur) : 1;
      const cy = c.y - 26;
      ctx.globalAlpha = .9;
      const gl = ctx.createRadialGradient(c.x, cy, 0, c.x, cy, 22 * k);
      gl.addColorStop(0, 'rgba(230,214,255,.85)'); gl.addColorStop(1, 'rgba(180,140,255,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(c.x, cy, 22 * k, 0, 6.3); ctx.fill();
      // само существо: круглое, мягкое, без единой острой линии — оно безвредно
      ctx.fillStyle = '#e8dcff';
      ctx.beginPath(); ctx.ellipse(c.x, cy, 8 * k, 7 * k, 0, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x - 6 * k, cy + 3 * k, 3 * k, 3 * k, 0, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x + 6 * k, cy + 3 * k, 3 * k, 3 * k, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#6a4a8a';
      ctx.fillRect(Math.round(c.x - 3 * k), Math.round(cy - 1), Math.max(1, 2 * k), Math.max(1, 2 * k));
      ctx.fillRect(Math.round(c.x + 2 * k), Math.round(cy - 1), Math.max(1, 2 * k), Math.max(1, 2 * k));
      if (Math.random() < .3) FX.spawn(c.x, cy, 1, { color:'#d8c0ff', spread:8, rise:-.3, life:44 });
    }
    ctx.restore();
  },

  /* Мидея в легенде — её собственная модель, увеличенная втрое и уведённая
     в тень: на таком масштабе открытое лицо читается светлым пятном,
     а силуэт в шляпе узнаётся сразу. Строится один раз. */
  medeaFigure() {
    if (this._medea !== undefined) return this._medea;
    const src = Assets.images.motherWitch;
    if (!src) return (this._medea = null);
    const k = 3.4, c = document.createElement('canvas');
    c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(src, 0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(34,22,44,.58)'; g.fillRect(0, 0, c.width, c.height);
    return (this._medea = c);
  },
  crackStar(i) { const st = this.stars.find(s => s.i === i); if (st) st.cracked = true; },

  /* four black stars hanging over the hall, each with its command */
  drawStars(ctx) {
    const t = Date.now();
    this.stars.forEach(st => {
      const x = 44 + st.i * 52, y = 62 + (st.i % 2) * 16;
      const r = 15 + Math.sin(t/700 + st.i) * 1.5;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = st.cracked ? '#2a0810' : '#08060c';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI/2 + k * Math.PI/5, rr = k % 2 ? r * .42 : r;
        k ? ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = st.cracked ? '#ff4030' : '#5a2040';
      ctx.lineWidth = 1; ctx.stroke();
      if (st.cracked) {
        ctx.strokeStyle = '#ff6040';
        ctx.beginPath(); ctx.moveTo(-r*.5, -r*.3); ctx.lineTo(r*.2, r*.5); ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = st.cracked ? '#ff8060' : '#8a6a80';
      ctx.font = '6px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(this.starWords[st.i], x, y + r + 9);
      ctx.textAlign = 'left';
      if (Math.random() < .25) FX.spawn(x, y, 1, {color:'#5a2040', spread:r*2, rise:-.2, life:40});
    });
  },
  drawFigures(ctx) {
    const t = Date.now();
    if (this.showLilith) this.drawLilith(ctx, t);
    if (this.showMedea) {
      const a = .92 + .06 * Math.sin(t/600);
      ctx.save();
      ctx.globalAlpha = a * .45;                     // тёмный ореол под фигурой
      ctx.fillStyle = '#241a2a';
      ctx.beginPath(); ctx.ellipse(70, 212, 25, 46, 0, 0, Math.PI*2); ctx.fill();
      const f = this.fall || 0;
      ctx.globalAlpha = a * (1 - f * .85);
      const fig = this.medeaFigure();
      if (fig) {
        ctx.imageSmoothingEnabled = false;
        ctx.translate(70, 250);
        ctx.rotate(f * .22);                       // казнь: фигура кренится и растворяется
        ctx.translate(0, f * 14);
        ctx.drawImage(fig, -fig.width/2, -fig.height);
      }
      ctx.restore();
      if (f > 0 && f < 1 && Math.random() < .5)
        FX.spawn(70 + (Math.random()-.5)*26, 210 + Math.random()*40, 1,
                 { color:'#c060ff', spread:8, rise:-.4, life:60 });
      if (this.crystalGlow > 0) {
        const cg = this.crystalGlow * (.7 + .3 * Math.sin(t/220));
        const gr = ctx.createRadialGradient(70, 228, 0, 70, 228, 34 * cg);
        gr.addColorStop(0, `rgba(200,120,255,${(.7*cg).toFixed(2)})`);
        gr.addColorStop(1, 'rgba(200,120,255,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(70, 228, 34*cg, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e8c0ff'; ctx.fillRect(68, 226, 4, 5);
        if (Math.random() < .5) FX.spawn(70, 228, 1, {color:'#c060ff', spread:12, rise:-.4, life:50});
      }
    }
  },

  /* Актёр сцены доходит до места сам. Нужен там, где персонаж обязан
     появиться в кадре, а не возникнуть из воздуха. */
  castWalk(name, to, ms) {
    const n = (Game.cast || []).find(c => c.name === name);
    if (!n) return Promise.resolve();
    const x0 = n.x, y0 = n.y, t0 = performance.now();
    n.moving = true;
    return new Promise(res => {
      const step = () => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        const e = k * k * (3 - 2 * k);
        n.x = x0 + (to[0] - x0) * e;
        n.y = y0 + (to[1] - y0) * e;
        if (k < 1) requestAnimationFrame(step);
        else { n.moving = false; res(); }
      };
      requestAnimationFrame(step);
    });
  },

  /* ЛИЛИТ В ПРОЛОГЕ — по присланному силуэту.

     Читаемые формы референса: рогатая корона из нескольких тонких рогов,
     длинные волнистые волосы ниже пояса, поднятая вуаль за головой,
     разведённые в стороны руки с когтистыми кистями, широкие рукава с
     рваными языками по низу, узкий лиф, юбка колоколом и разлетающиеся
     полы плаща, оканчивающиеся такими же языками.

     Всё чёрное; читаемость даёт контровой свет по краю.                   */
  drawLilith(ctx, t) {
    const CX = 120, FOOT = 258, HEAD = 78;
    const br = 1 + Math.sin(t / 900) * .06;
    const sway = Math.sin(t / 1300) * 3;
    const ink = '#120610';   // не абсолютно чёрный: иначе силуэт тонет в тёмном зале

    ctx.save();
    const back = ctx.createRadialGradient(CX, 150, 10, CX, 150, 104);
    back.addColorStop(0, `rgba(210,40,54,${(.44 * br).toFixed(2)})`);
    back.addColorStop(1, 'rgba(120,10,26,0)');
    ctx.fillStyle = back; ctx.beginPath(); ctx.arc(CX, 150, 104, 0, 6.3); ctx.fill();

    /* язык ткани: повторяющийся мотив рваного края из референса */
    const flame = (x, y, dir, len, w) => {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + dir * w, y + len * .5, x + dir * (w * .3), y + len);
      ctx.quadraticCurveTo(x + dir * w * .9, y + len * .55, x - dir * w * .2, y);
      ctx.closePath(); ctx.fill();
    };

    ctx.fillStyle = ink;
    /* --- юбка колоколом и разлетающиеся полы --- */
    ctx.beginPath();
    ctx.moveTo(CX - 12, 148); ctx.lineTo(CX + 12, 148);
    ctx.bezierCurveTo(CX + 30, 200, CX + 44, 236, CX + 52, FOOT);
    ctx.lineTo(CX - 52, FOOT);
    ctx.bezierCurveTo(CX - 44, 236, CX - 30, 200, CX - 12, 148);
    ctx.closePath(); ctx.fill();
    [-1, 1].forEach(d => {                       // отлетающая пола плаща
      ctx.beginPath();
      ctx.moveTo(CX + d * 14, 168);
      ctx.quadraticCurveTo(CX + d * 58, 206, CX + d * 70, FOOT - 8);
      ctx.quadraticCurveTo(CX + d * 46, 240, CX + d * 30, FOOT);
      ctx.lineTo(CX + d * 16, FOOT);
      ctx.closePath(); ctx.fill();
      flame(CX + d * 68, FOOT - 10, d, 14, 7);    // язык на конце полы
      flame(CX + d * 44, FOOT - 2, d, 11, 5);
    });
    /* --- лиф и плечи --- */
    ctx.beginPath();
    ctx.moveTo(CX - 9, 108); ctx.lineTo(CX + 9, 108);
    ctx.lineTo(CX + 13, 150); ctx.lineTo(CX - 13, 150);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(CX, 108, 19, 7, 0, 0, 6.3); ctx.fill();
    /* --- руки в стороны и широкие рукава с языками --- */
    [-1, 1].forEach(d => {
      ctx.beginPath();
      ctx.moveTo(CX + d * 14, 106);
      ctx.quadraticCurveTo(CX + d * 44, 108, CX + d * 62, 96);
      ctx.lineTo(CX + d * 62, 102);
      ctx.quadraticCurveTo(CX + d * 44, 118, CX + d * 14, 118);
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 3; i++) {               // когтистые пальцы
        ctx.beginPath();
        ctx.moveTo(CX + d * (62 + i * 2), 97 + i * 2);
        ctx.lineTo(CX + d * (72 + i * 2), 94 + i * 3);
        ctx.lineTo(CX + d * (62 + i * 2), 100 + i * 2);
        ctx.closePath(); ctx.fill();
      }
      ctx.beginPath();                            // рукав-колокол
      ctx.moveTo(CX + d * 26, 112); ctx.lineTo(CX + d * 50, 104);
      ctx.quadraticCurveTo(CX + d * 52, 132, CX + d * 44, 150);
      ctx.lineTo(CX + d * 24, 142);
      ctx.closePath(); ctx.fill();
      flame(CX + d * 44, 148, d, 16, 6);
      flame(CX + d * 30, 142, d, 12, 5);
    });
    /* --- шея, волосы, вуаль, голова --- */
    ctx.fillRect(CX - 4, 98, 8, 12);
    ctx.fillStyle = '#080308';                    // вуаль за головой
    ctx.beginPath();
    ctx.moveTo(CX - 16, HEAD + 6);
    ctx.quadraticCurveTo(CX - 26, HEAD + 30, CX - 18, HEAD + 46);
    ctx.lineTo(CX + 18, HEAD + 46);
    ctx.quadraticCurveTo(CX + 26, HEAD + 30, CX + 16, HEAD + 6);
    ctx.closePath(); ctx.fill();
    [-1, 1].forEach(d => {                        // длинные волнистые волосы
      ctx.beginPath();
      ctx.moveTo(CX + d * 3, HEAD - 4);
      ctx.quadraticCurveTo(CX + d * 22, HEAD + 10, CX + d * 17, 128);
      ctx.quadraticCurveTo(CX + d * (24 + sway * d), 152, CX + d * 11, 176);
      ctx.lineTo(CX + d * 3, 168);
      ctx.quadraticCurveTo(CX + d * 12, 142, CX + d * 6, HEAD + 12);
      ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.ellipse(CX, HEAD + 12, 11, 14, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#080308';
    ctx.beginPath(); ctx.ellipse(CX, HEAD + 4, 12, 8, 0, 0, 6.3); ctx.fill();
    /* --- корона из нескольких тонких рогов --- */
    ctx.fillStyle = ink;
    [[-1, 20, 30], [-1, 12, 40], [1, 12, 40], [1, 20, 30], [-1, 4, 34], [1, 4, 34]].forEach(([d, off, up]) => {
      ctx.beginPath();
      ctx.moveTo(CX + d * off, HEAD + 4);
      ctx.quadraticCurveTo(CX + d * (off + 10), HEAD - up * .5, CX + d * (off + 3), HEAD - up);
      ctx.quadraticCurveTo(CX + d * (off + 4), HEAD - up * .45, CX + d * (off - 3), HEAD + 4);
      ctx.closePath(); ctx.fill();
    });

    /* --- контровой свет по краю: в темноте читается именно фигура --- */
    ctx.strokeStyle = `rgba(240,110,105,${(.62 * br).toFixed(2)})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(CX - 52, FOOT);
    ctx.bezierCurveTo(CX - 44, 236, CX - 30, 200, CX - 12, 148);
    ctx.lineTo(CX - 13, 150); ctx.lineTo(CX - 9, 108); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(CX, HEAD + 12, 11, 14, 0, 0, 6.3); ctx.stroke();
    [-1, 1].forEach(d => {
      ctx.beginPath();
      ctx.moveTo(CX + d * 14, 106);
      ctx.quadraticCurveTo(CX + d * 44, 108, CX + d * 62, 96); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(CX + d * 3, HEAD - 4);
      ctx.quadraticCurveTo(CX + d * 22, HEAD + 10, CX + d * 17, 128);
      ctx.quadraticCurveTo(CX + d * (24 + sway * d), 152, CX + d * 11, 176); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(CX + d * 20, HEAD + 4);
      ctx.quadraticCurveTo(CX + d * 30, HEAD - 15, CX + d * 23, HEAD - 30); ctx.stroke();
    });

    ctx.fillStyle = `rgba(255,42,48,${(.85 * br).toFixed(2)})`;
    ctx.fillRect(CX - 6, HEAD + 10, 3, 2); ctx.fillRect(CX + 3, HEAD + 10, 3, 2);
    ctx.restore();
  },

  /* КАЧЕЛИ.

     Сцена спасения Сью не должна быть набором статичных состояний: игрок
     видит, как качели раскачиваются с растущей амплитудой, как Сью
     отрывается, летит по дуге, как её ловит магия и как она висит в
     воздухе. Никаких телепортаций — координата всё время одна и та же,
     меняется только фаза.

     Сью — это сам игрок, поэтому фазы двигают Player. Подъём над землёй
     идёт через Player.lift, чтобы столкновения не поехали.                 */
  swing: null,
  SEAT: { x:162, y:143, len:25 },          // ось и длина подвеса правого сиденья рамы

  startSwing(phase, ms) {
    const st = this.swing || (this.swing = { a:0, amp:0, seatA:0, t:0, phase:'sit', dur:1, done:true });
    st.phase = phase; st.t = 0; st.dur = ms; st.done = false;
    if (phase === 'sit') { st.amp = 0; st.a = 0; Player.lift = 0; }
    if (phase === 'launch') { st.vx = 0; st.vy = 0; }
    return new Promise(res => { st.resolve = res; });
  },
  stopSwing() { this.swing = null; Player.lift = 0; },

  updateSwing(dt) {
    const st = this.swing;
    if (!st) return;
    // пустое сиденье качается само с того момента, как Сью с него сорвалась
    if (!['sit','push'].includes(st.phase)) this.decaySeat(dt);
    if (st.done) { if (st.phase === 'float') this.floatIdle(dt); return; }
    st.t += dt;
    const k = Math.min(1, st.t / st.dur);
    const S = this.SEAT;
    const ease = x => x * x * (3 - 2 * x);

    if (st.phase === 'sit') {
      st.amp = 0; st.a = 0;
      Player.x = S.x; Player.y = S.y + S.len;
    } else if (st.phase === 'push') {
      st.amp = 0.14 + ease(k) * 0.62;                  // амплитуда растёт постепенно
      st.a = Math.sin(st.t / 340) * st.amp;
      Player.x = S.x + Math.sin(st.a) * S.len * .35;
      Player.y = S.y + Math.cos(st.a) * S.len + Math.sin(st.a) * 26;
      if (Math.abs(st.a) > st.amp * .96 && !st.creak) {
        st.creak = true; Audio.beep(180 + Math.random() * 40, .12, 'triangle', .03);
      } else if (Math.abs(st.a) < st.amp * .5) st.creak = false;
    } else if (st.phase === 'launch') {
      st.vx = 0.5; st.vy = 3.2;                        // отрыв: вперёд и вниз по экрану
      Player.y += st.vy * (dt / 16.6) * ease(k);
      Player.x += st.vx * (dt / 16.6);
    } else if (st.phase === 'fly') {
      const slow = 1 - ease(k);                        // теряет скорость, а не резко замирает
      Player.x += 0.55 * slow * (dt / 16.6);
      Player.y += (2.6 * slow - 0.5) * (dt / 16.6);
      Player.lift = 6 + ease(k) * 14;
      if (Math.random() < .18) FX.spawn(Player.x, Player.y - Player.lift - 8, 1,
        { color:'#e8d0a0', spread:5, rise:-.1, life:26 });
    } else if (st.phase === 'hold') {
      Player.lift = 20 + ease(k) * 8;
      if (Math.random() < .5) FX.spawn(Player.x + (Math.random() - .5) * 22,
        Player.y - Player.lift - 6 + (Math.random() - .5) * 18, 1,
        { color:'#c060ff', spread:6, rise:-.22, life:52 });
    } else if (st.phase === 'float') {
      this.floatIdle(dt);                              // держится, пока сцена не снимет
    } else if (st.phase === 'land') {
      Player.lift = 28 * (1 - ease(k));
      if (k >= 1) { Player.lift = 0; st.floatT = 0; }
    }
    if (k >= 1) { st.done = true; const r = st.resolve; st.resolve = null; if (r) r(); }
  },

  /* Зависание: едва заметное покачивание и редкие искры вокруг. */
  floatIdle(dt) {
    const st = this.swing;
    st.floatT = (st.floatT || 0) + dt;
    Player.lift = 28 + Math.sin(st.floatT / 420) * 2.5;
    if (Math.random() < .35) FX.spawn(Player.x + (Math.random() - .5) * 26,
      Player.y - Player.lift - 4 + (Math.random() - .5) * 22, 1,
      { color:'#c060ff', spread:5, rise:-.18, life:60 });
  },

  /* Пустое сиденье после отрыва качается само и постепенно затихает. */
  decaySeat(dt) {
    const st = this.swing;
    if (!st) return;
    st.seatT = (st.seatT || 0) + dt;
    st.seatAmp = Math.max(0, (st.seatAmp === undefined ? st.amp : st.seatAmp) - dt * 0.00035);
    st.seatA = Math.sin(st.seatT / 300) * st.seatAmp;
  },

  drawSwing(ctx) {
    const st = this.swing;
    if (!st) return;
    const S = this.SEAT;
    const rider = ['sit','push'].includes(st.phase) && !st.done;
    const a = rider ? st.a : (st.seatA !== undefined ? st.seatA : st.a);
    const sx = S.x + Math.sin(a) * S.len * .35;
    const sy = S.y + Math.cos(a) * S.len + Math.sin(a) * 26;
    ctx.strokeStyle = '#5a4a38'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(S.x - 7, S.y); ctx.lineTo(sx - 6, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S.x + 7, S.y); ctx.lineTo(sx + 6, sy); ctx.stroke();
    ctx.fillStyle = '#8a4a52'; ctx.fillRect(Math.round(sx) - 7, Math.round(sy), 14, 4);
    ctx.fillStyle = '#9c5a60'; ctx.fillRect(Math.round(sx) - 7, Math.round(sy), 14, 1);
  },

  /* pebbles lifting off the ground around little Naya */  /* pebbles lifting off the ground around little Naya */
  liftStones(x, y, n) {
    for (let i = 0; i < n; i++)
      this.stones.push({ bx:x, by:y, a:(i/n)*6.28, r:10 + i*3, h:0, sp:.6 + i*.12 });
  },
  drawStones(ctx) {
    if (!this.stones.length) return;
    this.stonesT += .03;
    this.stones.forEach(st => {
      st.h = Math.min(18, st.h + .25);
      const x = st.bx + Math.cos(st.a + this.stonesT * st.sp) * st.r;
      const y = st.by - st.h + Math.sin(st.a + this.stonesT * st.sp) * 3;
      ctx.fillStyle = '#6a625a'; ctx.fillRect(Math.round(x), Math.round(y), 3, 2);
      ctx.fillStyle = '#8a827a'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      if (Math.random() < .06) FX.spawn(x, y, 1, {color:'#c060ff', spread:4, rise:-.3, life:30});
    });
  },

  /* the butterfly: a short flight path, then it settles on Sue's hand */
  flyButterfly(from, to, ms) {
    this.butterfly = { x:from[0], y:from[1], fx:from[0], fy:from[1], tx:to[0], ty:to[1], t:0, dur:ms, landed:false };
    return new Promise(r => setTimeout(() => { if (this.butterfly) this.butterfly.landed = true; r(); }, ms));
  },
  drawButterfly(ctx) {
    const b = this.butterfly; if (!b) return;
    if (!b.landed) {
      b.t = Math.min(1, b.t + 16 / b.dur);
      const e = b.t * b.t * (3 - 2 * b.t);
      b.x = b.fx + (b.tx - b.fx) * e;
      b.y = b.fy + (b.ty - b.fy) * e - Math.sin(e * Math.PI) * 22;
    }
    const t = Date.now();
    const flap = Math.abs(Math.sin(t / (b.landed ? 420 : 110)));
    const gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 12);
    gr.addColorStop(0, 'rgba(210,150,255,.55)'); gr.addColorStop(1, 'rgba(210,150,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c8ff';
    const w = 1 + flap * 3;
    ctx.fillRect(b.x - 1 - w, b.y - 2, w, 4);
    ctx.fillRect(b.x + 1,     b.y - 2, w, 4);
    ctx.fillStyle = '#fff0ff'; ctx.fillRect(b.x - 0.5, b.y - 2, 1, 5);
    if (Math.random() < .3) FX.spawn(b.x, b.y, 1, {color:'#c060ff', spread:5, rise:-.2, life:34});
  },
};

    Scene.play('lonerCaughtScene');
  },

};

  unlock(key) {
    if (!this.DEFS.find(d => d.key === key)) return;
    if (gameState && !gameState.memories.includes(key)) {
      gameState.memories.push(key);
      UI.toast('Воспоминание: ' + this.DEFS.find(d=>d.key===key).title, 1800);
      Audio.chime();
    }
    META.memories[key] = true; saveMeta();
  },
  has(key) { return !!(META.memories[key] || (gameState && gameState.memories.includes(key))); },
  renderList() {
    const wrap = document.getElementById('memoriesList');
    wrap.innerHTML = '';
    this.DEFS.forEach((d, i) => {
      const unlocked = this.has(d.key);
      const b = document.createElement('button');
      b.className = 'listItem' + (unlocked ? '' : ' locked');
      b.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span>` +
                    `<span>${unlocked ? d.title : '???????'}</span>` +
                    (unlocked ? '<span class="tick">✦</span>' : '');
      if (unlocked) b.addEventListener('click', () => this.open(d));
      wrap.appendChild(b);
    });
  },
  open(d) {
    document.getElementById('memoryTitle').textContent = d.title;
    document.getElementById('memoryText').textContent = d.text;
    const c = document.getElementById('memoryCanvas');
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#000'; g.fillRect(0,0,200,120);
    try { d.draw(g); } catch(e) {}
    document.getElementById('memoryView').classList.add('show');
    Audio.click();
  }
};

    const d = this.DEFS[id] || { roman:'КОНЦОВКА', name:String(id), sub:'' };
    try {
      META.endings[id] = true;
      META.endingStats[id] = { trustSue:S('trustSue'), witchAmbition:S('witchAmbition'), humanity:S('humanity'), hellAffinity:S('hellAffinity') };

      localStorage.removeItem(CONFIG.SAVE_KEY);

    document.getElementById('endingRoman').textContent = d.roman;

    document.getElementById('endingSub').textContent = d.sub;
    document.getElementById('endingBody').textContent = this.bodyFor(id);
    const st = document.getElementById('endingStats');
    st.innerHTML = '';
    const rows = [
      ['Путь ведьмы', S('witchAmbition')],
      ['Доверие Сью', S('trustSue')],
      ['Человечность', S('humanity')],
      ['Связь с адом', S('hellAffinity')],

    const scr = document.getElementById('endingScreen');
    if (scr.classList.contains('show')) return;
    const id = ['I','II','III','IV'].find(k => META.endings[k]) || 'I';
    try { this._paint(this.DEFS[id], id); } catch(e) {}

    const wrap = document.getElementById('endingsList');

    ['I','II','III','IV'].forEach(id => {
      const d = this.DEFS[id], got = !!META.endings[id];
      const b = document.createElement('button');
      b.className = 'listItem' + (got ? '' : ' locked');
      b.innerHTML = `<span class="idx">${id}</span><span>${got ? d.name : '????????'}</span>` +

function Dialogue0Alert(msg) {

}
function updateEndingCount() {
  const n = ['I','II','III','IV'].filter(i => META.endings[i]).length;
  document.getElementById('menuEndCount').textContent = 'КОНЦОВКИ: ' + n + ' / 4';
}

/* =====================================================================
   SAVE / LOAD / CHECKPOINT
===================================================================== */
function serializeState() {
  return {
    currentRoom:gameState.currentRoom,
    playerX:Player.x, playerY:Player.y,
    act:gameState.act, chapter:gameState.chapter, eventStep:gameState.eventStep,
    flags:gameState.flags, stats:gameState.stats, counters:gameState.counters,
    journal:gameState.journal, scenesSeen:gameState.scenesSeen,
    inventory:gameState.inventory, memories:gameState.memories,
    settings:gameState.settings,
  };
}
function saveGame() {
  if (!gameState || Game.endingShown) return;
  gameState.playerX = Player.x; gameState.playerY = Player.y;
  try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(serializeState())); } catch(e) {}
}
function loadGame() {
  try { const raw = localStorage.getItem(CONFIG.SAVE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}
function hasSave() { try { return !!localStorage.getItem(CONFIG.SAVE_KEY); } catch(e) { return false; } }

function saveCheckpoint(label) {
  if (!gameState) return;
  try {
    localStorage.setItem(CONFIG.CHECKPOINT_KEY, JSON.stringify({ label, state:serializeState() }));
  } catch(e) {}
}
function hasCheckpoint() { try { return !!localStorage.getItem(CONFIG.CHECKPOINT_KEY); } catch(e) { return false; } }
function loadCheckpoint() {
  try { const raw = localStorage.getItem(CONFIG.CHECKPOINT_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}
function applyState(s) {
  gameState = freshState();
  gameState.currentRoom = s.currentRoom || 'nayaRoom';
  gameState.playerX = s.playerX; gameState.playerY = s.playerY;
  gameState.act = s.act || 0;
  gameState.chapter = s.chapter || 1;
  gameState.eventStep = s.eventStep || 0;
  gameState.flags    = Object.assign(freshState().flags, s.flags || {});
  gameState.stats    = Object.assign(freshState().stats, s.stats || {});
  gameState.counters = Object.assign(freshState().counters, s.counters || {});
  gameState.inventory = Array.isArray(s.inventory) ? s.inventory.slice() : [];
  gameState.memories  = Array.isArray(s.memories) ? s.memories.slice() : [];
  gameState.journal   = Array.isArray(s.journal) ? s.journal.slice() : [];
  gameState.scenesSeen = Array.isArray(s.scenesSeen) ? s.scenesSeen.slice() : [];
  gameState.settings = Object.assign(freshState().settings, s.settings || {});
  Player.x = gameState.playerX; Player.y = gameState.playerY;
  applySettings();
  FX.clearAll(); FX.refreshCorruption();
  UI.updateInventory();
}
function applySettings() {
  const s = gameState.settings;
  Audio.volume = s.volume;
  Music.setVolume(s.music);
  FX.enabled = true;
  document.getElementById('volSlider').value = Math.round(s.volume*100);
  document.getElementById('volVal').textContent = Math.round(s.volume*100);
  document.getElementById('musSlider').value = Math.round(s.music*100);
  document.getElementById('musVal').textContent = Math.round(s.music*100);
  document.getElementById('spdSlider').value = s.textSpeed;
  document.getElementById('spdVal').textContent = s.textSpeed;
  document.getElementById('fxSlider').value = s.effects ? 1 : 0;
  document.getElementById('fxVal').textContent = s.effects ? 'вкл' : 'выкл';
}

persuadeResolve: [
  { jump:()=> {
      const resolve = C('sueResolve'), respected = C('sueRespected'), trust = S('trustSue');
      // Three steps: each one adds either pressure (sueResolve) or an out (sueRespected).
      // She comes along because Naya pushed hard enough, or because Naya pushed
      // only a little and is trusted enough to be followed anyway.
      // If Naya gave her an out all three times, Sue takes it - that is the loner path.
      const gaveOutEveryTime = respected >= 3;
      const agreed = !gaveOutEveryTime && (resolve >= 3 || trust >= 78);
      return agreed ? 'sueAgrees' : 'sueRefuses';
    }},
],

   INPUT
===================================================================== */
const Input = {
  keys:{}, dpad:{x:0,y:0,active:false},
  init() {
    window.addEventListener('keydown', e => {
      if (Game.mode === 'menu' && !Dialogue.active) return;
      this.keys[e.code] = true;
      if (['Space','Enter'].includes(e.code)) { e.preventDefault(); Audio.resume(); doInteract(); }
      if (e.code === 'Escape') { e.preventDefault(); if (!Dialogue.active && Game.mode !== 'cutscene') togglePause(); }
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    // clearing keys on blur prevents "stuck running into a wall"
    window.addEventListener('blur', () => { this.keys = {}; this.dpad = {x:0,y:0,active:false}; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.keys = {}; });

    const dpad = document.getElementById('dpad');
    const stick = document.getElementById('dpadStick');
    const CX = 56, CY = 56, MAXR = 34, HOME = 33;
    const handleMove = (pt) => {
      const rect = dpad.getBoundingClientRect();
      let dx = (pt.clientX - rect.left) - CX, dy = (pt.clientY - rect.top) - CY;
      const d = Math.hypot(dx, dy);
      if (d > MAXR) { dx = dx/d*MAXR; dy = dy/d*MAXR; }
      stick.style.left = (HOME + dx) + 'px';
      stick.style.top  = (HOME + dy) + 'px';
      this.dpad.x = Math.abs(dx) > 8 ? Math.sign(dx) : 0;
      this.dpad.y = Math.abs(dy) > 8 ? Math.sign(dy) : 0;
      this.dpad.active = true;
    };
    const handleEnd = () => {
      stick.style.left = HOME + 'px'; stick.style.top = HOME + 'px';
      this.dpad.x = 0; this.dpad.y = 0; this.dpad.active = false;
    };
    dpad.addEventListener('touchstart', e => { e.preventDefault(); Audio.resume(); handleMove(e.touches[0]); }, {passive:false});
    dpad.addEventListener('touchmove',  e => { e.preventDefault(); handleMove(e.touches[0]); }, {passive:false});
    dpad.addEventListener('touchend',   e => { e.preventDefault(); handleEnd(); }, {passive:false});
    dpad.addEventListener('touchcancel',e => { e.preventDefault(); handleEnd(); }, {passive:false});
    let mouseDown = false;
    dpad.addEventListener('mousedown', e => { mouseDown = true; Audio.resume(); handleMove(e); });
    dpad.addEventListener('mousemove', e => { if (mouseDown) handleMove(e); });
    window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; handleEnd(); } });

    const act = document.getElementById('actionBtn');
    let actTouched = false;
    act.addEventListener('touchstart', e => { e.preventDefault(); actTouched = true; Audio.resume(); doInteract(); }, {passive:false});
    act.addEventListener('click', e => { e.preventDefault(); if (actTouched) { actTouched = false; return; } Audio.resume(); doInteract(); });

    // tap anywhere to advance dialogue (but not while a choice is open)
    const tap = document.getElementById('tapCatcher');
    const advance = (e) => {
      e.preventDefault(); e.stopPropagation();
      Audio.resume();
      if (Dialogue.active && !Dialogue.awaitingChoice) Dialogue.advance();
    };
    let tapTouched = false;
    tap.addEventListener('touchstart', e => { tapTouched = true; advance(e); }, {passive:false});
    tap.addEventListener('click', e => { if (tapTouched) { tapTouched = false; return; } advance(e); });

    document.getElementById('menuBtnGame').addEventListener('click', () => {
      Audio.click(); if (!Dialogue.active && Game.mode !== 'cutscene') togglePause(); else UI.toast('Не сейчас.');
    });
    document.getElementById('statusBtnGame').addEventListener('click', () => { Audio.click(); showStatus(); });
  },
  getMove() {
    let dx = 0, dy = 0;
    if (this.keys['ArrowLeft'] || this.keys['KeyA']) dx = -1;
    else if (this.keys['ArrowRight'] || this.keys['KeyD']) dx = 1;
    if (this.keys['ArrowUp'] || this.keys['KeyW']) dy = -1;
    else if (this.keys['ArrowDown'] || this.keys['KeyS']) dy = 1;
    if (this.dpad.active) { dx = this.dpad.x; dy = this.dpad.y; }
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    return { dx, dy };
  }
};

/* =====================================================================
   RENDER + LOOP
===================================================================== */
const Game = {
  mode:'menu', canvas:null, ctx:null, cam:{x:0,y:0}, scale:1,
  running:false, lastT:0, paused:false,
  chase:null, endingShown:false, montage:false, montageDraw:null, reviveGlow:null, motherShadow:null,
  cast:[],
};

function resizeCanvas() {
  const c = Game.canvas;
  const cont = document.getElementById('gameContainer');
  const cw = cont.clientWidth, ch = cont.clientHeight;
  c.width = CONFIG.VIEW_W; c.height = CONFIG.VIEW_H;
  const scale = Math.min(cw / CONFIG.VIEW_W, ch / CONFIG.VIEW_H);
  c.style.width  = (CONFIG.VIEW_W * scale) + 'px';
  c.style.height = (CONFIG.VIEW_H * scale) + 'px';
  c.style.position = 'absolute';
  c.style.left = ((cw - CONFIG.VIEW_W * scale) / 2) + 'px';
  c.style.top  = '0px';
  Game.scale = scale;
  if (Game.ctx) Game.ctx.imageSmoothingEnabled = false;
}

function drawRoom() {
  const ctx = Game.ctx;
  const room = Rooms[gameState.currentRoom];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);

  /* Зум камеры. Кадр остаётся тем же, меняется его охват: при zoom 1.6 в
     кадр влезает вдвое меньше комнаты, и всё, что рисуется через camX/camY,
     автоматически становится крупнее. Нужен катсценам, где важно разглядеть
     детали — например, магии на площадке. */
  const Z = Game.zoom || 1;
  const VW = CONFIG.VIEW_W / Z, VH = CONFIG.VIEW_H / Z;
  let camX = clamp(Player.x - VW/2, 0, Math.max(0, room.w - VW));
  let camY = clamp(Player.y - VH/2, 0, Math.max(0, room.h - VH));
  // Г-образные комнаты: пока игрок в одном рукаве, камере нечего показывать
  // в другом — иначе полкадра занимает глухая стена за поворотом
  if (room.camLimit) {
    const lim = room.camLimit(Player.x, Player.y);
    if (lim) camY = clamp(camY, lim.top || 0, Math.max(lim.top || 0, (lim.bottom || room.h) - VH));
  }
  if (room.w <= VW) camX = (room.w - VW) / 2;
  if (room.h <= VH) camY = (room.h - VH) / 2;
  if (FX.shake > 0) {
    camX += (Math.random()-.5) * FX.shake;
    camY += (Math.random()-.5) * FX.shake;
  }
  camX = Math.round(camX); camY = Math.round(camY);
  Game.cam.x = camX; Game.cam.y = camY;
  if (Z !== 1) { ctx.setTransform(Z, 0, 0, Z, 0, 0); }

  // 1. static background (painted once, then blitted)
  ctx.drawImage(World.background(gameState.currentRoom), -camX, -camY);

  // 2. anything the room wants to animate underneath the actors
  if (room.underPaint) { ctx.save(); ctx.translate(-camX, -camY); room.underPaint(ctx); ctx.restore(); }

  // 3. props, NPCs and the player, sorted by depth so you walk behind things.
  // Три слоя вместо одного, потому что у предметов разная связь с полом:
  //   flat  — половые декали (ковры, лужи, кучи листьев): их топчут;
  //   wall  — то, что висит на стене (картины, часы, окна, доски, афиши):
  //           у них нет точки контакта с полом, поэтому глубина для них
  //           не определена — они всегда позади всех, кто ходит;
  //   остальное сортируется по нижней кромке рисунка, а не по точке
  //   привязки: у части мебели спрайт спускается на несколько пикселей
  //   ниже якоря, и без поправки ноги персонажа уезжали под неё.
  const props = World.objectsOf(room);
  for (const o of props) { const m = Art.meta(o.t); if (m && m.flat) Art.drawAt(ctx, o, camX, camY); }
  for (const o of props) { const m = Art.meta(o.t); if (m && m.wall) Art.drawAt(ctx, o, camX, camY); }

  const draws = [];
  for (const o of props) {
    const m = Art.meta(o.t);
    if (m && (m.flat || m.wall)) continue;
    draws.push({ y:o.y + (m ? Math.max(0, m.h - m.ay) : 0), obj:o });
  }
  for (const n of roomNPCs(room)) draws.push({ y:n.y, npc:n });
  for (const n of roomCast()) draws.push({ y:n.y, npc:n });
  if (!room.cinematic) draws.push({ y:Player.y, player:true });
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) {
    if (d.obj) {
      const dm = Art.meta(d.obj.t);
      let faded = false;
      if (dm && dm.fade && d.obj.y > Player.y) {
        const sx = d.obj.x - dm.ax, sy = d.obj.y - dm.ay;
        if (Player.x > sx - 2 && Player.x < sx + dm.w + 2 &&
            Player.y > sy && Player.y - 20 < sy + dm.h) { ctx.globalAlpha = .42; faded = true; }
      }
      Art.drawAt(ctx, d.obj, camX, camY);
      if (faded) ctx.globalAlpha = 1;
      continue;
    }
    if (d.player) { Player.draw(ctx, camX, camY); continue; }
    const n = d.npc, img = Assets.images[n.sprite];
    if (!img) continue;
    // спрайты бывают разной ширины (Дороти шире человека), поэтому
    // ставим их по центру точки NPC и на общую линию пола, а не по углу
    const px = Math.round(n.x - img.width / 2 - camX), py = Math.round(n.y + 4 - img.height - camY);
    shadowEllipse(ctx, px + img.width / 2, Math.round(n.y + 4 - camY), Math.max(6, img.width * .38), 2, .3);
    ctx.drawImage(img, px, py);
  }

  // 4. room-specific animated overlay (runes, glows, story markers)
  if (room.overPaint) { ctx.save(); ctx.translate(-camX, -camY); room.overPaint(ctx); ctx.restore(); }
  if (room.prologue) {
    ctx.save(); ctx.translate(-camX, -camY);
    Prologue.drawStars(ctx); Prologue.drawFigures(ctx);
    Prologue.drawCreature(ctx, Date.now());
    Prologue.drawStones(ctx); Prologue.drawButterfly(ctx);
    ctx.restore();
  }
  // качели, камешки и бабочка живут и на обычной площадке, а не только
  // в кинематографичных комнатах пролога
  if (!room.prologue && (Prologue.swing || Prologue.stones.length || Prologue.butterfly)) {
    ctx.save(); ctx.translate(-camX, -camY);
    Prologue.drawSwing(ctx); Prologue.drawStones(ctx); Prologue.drawButterfly(ctx);
    ctx.restore();
  }

  FX.drawMagic(ctx, camX, camY);
  FX.drawParticles(ctx, camX, camY);

  if (Game.reviveGlow && Game.reviveGlow.on) {
    const g = ctx.createRadialGradient(CONFIG.VIEW_W/2, CONFIG.VIEW_H/2, 0,
                                       CONFIG.VIEW_W/2, CONFIG.VIEW_H/2, Math.max(1, Game.reviveGlow.r));
    g.addColorStop(0, '#ffe8f0'); g.addColorStop(0.6, 'rgba(255,180,210,.35)'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  }
  /* тень матери: на секунду за Наей вырастает чужой силуэт — длинные
     волосы и плащ. Появляется и гаснет, договаривать не нужно. */
  if (Game.motherShadow && Game.motherShadow.on) {
    const t = Game.motherShadow.t;
    const a = Math.sin(Math.PI * t) * 0.5;
    const px = Math.round(Player.x - camX), py = Math.round(Player.y - camY);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#0a0610';
    ctx.beginPath(); ctx.ellipse(px, py - 22, 15, 26, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(px - 15, py - 24, 30, 24);
    ctx.fillStyle = '#1a0f18';
    ctx.fillRect(px - 17, py - 40, 6, 34); ctx.fillRect(px + 11, py - 40, 6, 34);
    ctx.globalAlpha = a * .6;
    ctx.fillStyle = '#6a4050';
    ctx.fillRect(px - 5, py - 34, 3, 3); ctx.fillRect(px + 2, py - 34, 3, 3);
    ctx.restore();
  }

  // 5. shafts of daylight through the windows, then weather and light
  Lighting.drawSun(ctx, room, camX, camY);
  Weather.drawRain(ctx);
  Weather.drawLeaves(ctx);
  Lighting.draw(ctx, room, camX, camY);
  Weather.drawFog(ctx);
  if (Z !== 1) ctx.setTransform(1, 0, 0, 1, 0, 0);   // интерфейс рисуется без зума

  // 6a. таймер погони — поверх любой комнаты, а не только улицы
  if (Game.chase && Game.chase.active) {
    const left = Math.max(0, Math.ceil(Game.chase.t/1000));
    ctx.fillStyle = 'rgba(12,4,8,.78)'; ctx.fillRect(CONFIG.VIEW_W/2 - 56, 10, 112, 18);
    ctx.strokeStyle = '#c0304d'; ctx.lineWidth = 1;
    ctx.strokeRect(CONFIG.VIEW_W/2 - 55.5, 10.5, 111, 17);
    ctx.fillStyle = '#ff6070'; ctx.font = '10px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('БЕГИ ДОМОЙ  ' + left, CONFIG.VIEW_W/2, 23); ctx.textAlign = 'left';
  }

  // 6. interaction hint
  const near = (Game.mode === 'explore' && !Dialogue.active) ? findNearestInteractable() : null;
  if (near) {
    const ref = near.ref;
    const hx = (near.type === 'obj') ? (ref.x + ref.w/2 - camX) : (ref.x - camX);
    const hy = (near.type === 'obj') ? (ref.y - camY - 6) : (ref.y - 22 - camY);
    const label = (near.type === 'obj')
      ? ((typeof ref.prompt === 'function' ? ref.prompt() : ref.prompt) || 'A')
      : (ref.name || 'A');
    ctx.font = '9px Courier New';
    const w = ctx.measureText(label).width + 10;
    ctx.fillStyle = 'rgba(12,10,16,.85)';
    ctx.fillRect(hx - w/2, hy - 10, w, 12);
    ctx.strokeStyle = '#c0304d'; ctx.lineWidth = 1;
    ctx.strokeRect(hx - w/2 + .5, hy - 9.5, w, 12);
    ctx.fillStyle = '#e8c8d0'; ctx.textAlign = 'center';
    ctx.fillText(label, hx, hy);
    ctx.textAlign = 'left';
  }

  FX.drawOverlay(ctx);
}

/* Зум едет плавно: резкий скачок читается как баг, а не как приём. */
const Cam = {
  update(dt) {
    if (Game.zoom === undefined) Game.zoom = 1;
    if (Game.zoomTo === undefined) Game.zoomTo = 1;
    const k = 1 - Math.pow(0.004, dt / 1000);
    Game.zoom += (Game.zoomTo - Game.zoom) * k;
    if (Math.abs(Game.zoomTo - Game.zoom) < .004) Game.zoom = Game.zoomTo;
  },
};

function tick(t) {
  if (!Game.running) { return; }
  const dt = Math.min(50, (Game.lastT ? t - Game.lastT : 16));
  Game.lastT = t;

  if (Game.montage) {
    Montage.draw(Game.ctx);
    requestAnimationFrame(tick);
    return;
  }

  if (!Game.paused && gameState) {
    if (Game.mode === 'explore' && !Dialogue.active) {
      const { dx, dy } = Input.getMove();
      if (dx || dy) {
        tryMove(dx * CONFIG.PLAYER_SPEED, dy * CONFIG.PLAYER_SPEED);
        Player.moving = true;
        Player.animTimer += dt;
        if (Player.animTimer > 150) { Player.animFrame++; Player.animTimer = 0; }
        if (Math.abs(dx) > Math.abs(dy)) Player.dir = dx > 0 ? 'right' : 'left';
        else if (dy !== 0) Player.dir = dy > 0 ? 'down' : 'up';
      } else Player.moving = false;
    } else Player.moving = false;

    Chase.update(dt);
    Dialogue.update(dt);
    FX.update(dt);
    const room = Rooms[gameState.currentRoom];
    if (room) { FX.fogA *= 0.9; FX.ambient(room); Weather.update(dt, room); Patrol.update(dt, room); CrystalSense.update(dt, room); Quests.refresh(true); Cam.update(dt);
                 Prologue.updateSwing(dt); Prologue.updateLegend(dt); }
    drawRoom();
  }
  requestAnimationFrame(tick);
}
