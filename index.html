/* =====================================================================
   WORLD — the layer that turns rooms from "paint rectangles every frame"
   into a scene: a cached background, a sorted prop layer, weather and light.
===================================================================== */
const World = {
  bgCache:{},          // roomKey -> {key, canvas}
  /* Static background is painted once and blitted afterwards. Rooms declare
     bgKey() when their look depends on story flags, so it repaints only then. */
  background(roomKey) {
    const room = Rooms[roomKey];
    const key = room.bgKey ? room.bgKey() : 'static';
    const hit = this.bgCache[roomKey];
    if (hit && hit.key === key) return hit.canvas;
    const c = document.createElement('canvas');
    c.width = room.w; c.height = room.h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    room.bgPaint(g);
    if (room.wet) this.bakeReflections(g, room);
    this.bgCache[roomKey] = { key, canvas:c };
    return c;
  },
  invalidate(roomKey) { if (roomKey) delete this.bgCache[roomKey]; else this.bgCache = {}; },

  /* Wet asphalt: smear a soft vertical streak under every light source and
     under lit windows. Not physically correct — it just has to read as rain. */
  bakeReflections(g, room) {
    const lights = this.lightsOf(room);
    g.save();
    g.globalCompositeOperation = 'lighter';
    lights.forEach(L => {
      if (L.y > (room.wetFrom || 0) + 260) return;
      const top = L.y + 6, len = 60 + L.r * 0.7;
      const grad = g.createLinearGradient(0, top, 0, top + len);
      grad.addColorStop(0, withA(L.c, 0.28 * (L.i || 1)));
      grad.addColorStop(0.35, withA(L.c, 0.10 * (L.i || 1)));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(L.x - 5, top, 10, len);
      g.fillStyle = withA(L.c, 0.05);
      g.fillRect(L.x - 12, top, 24, len * 0.55);
    });
    g.restore();
  },

  /* Light sources = the room's own list plus any prop that declares one. */
  lightsOf(room) {
    const out = (room.lights || []).map(L => Object.assign({ r:50, c:'#ffcf7a', i:.8 }, L));
    (room.objects || []).forEach(o => {
      if (o.when && !o.when()) return;
      const d = Art.meta(o.t);
      if (d && d.light) out.push({ x:o.x, y:o.y + (d.light.dy||0), r:d.light.r, c:d.light.c, i:d.light.i, flicker:d.light.flicker });
    });
    return out;
  },

  objectsOf(room) { return (room.objects || []).filter(o => !o.when || o.when()); },

  /* Props block movement through their own declared footprint, so level
     collision follows the art instead of a parallel list of rectangles. */
  blockedByProps(room, box) {
    for (const o of this.objectsOf(room)) {
      const f = Art.footOf(o);
      if (f && rectHit(box, f)) return true;
    }
    return false;
  },
};

/* =====================================================================
   WEATHER — rain, fog, wind-blown leaves. Per-room base values, nudged
   by how far the story has gone.
===================================================================== */
const Weather = {
  rainDrops:[], leaves:[], fogPhase:0,
  cur:{ rain:0, fog:0, wind:.2, leaves:0, indoor:false },

  /* Story pressure: the town gets colder and wetter as Naya goes further. */
  storyMod() {
    if (!gameState) return { rain:0, fog:0 };
    let r = 0, f = 0;
    if (F('firstWitchDead'))  { r += .10; f += .10; }
    if (F('secondAmulet'))    { r += .08; f += .18; }
    if (F('sueDead'))         { r += .30; f += .15; }
    if (F('sueRevived'))      { r -= .10; f += .05; }
    if (F('chosenEarthPath')) { r -= .45; f -= .40; }
    if (F('sueRefused'))      { f += .16; }
    return { rain:r, fog:f };
  },
  apply(room) {
    const base = room.weather || {};
    const m = this.storyMod();
    // indoors the story shows up as a haze in the air, not as weather
    const k = base.indoor ? .3 : 1;
    this.cur = {
      rain:   clamp((base.rain||0)   + (base.indoor ? 0 : m.rain), 0, 1),
      fog:    clamp((base.fog||0)    + m.fog * k, 0, base.indoor ? .34 : 1),
      wind:   base.wind === undefined ? .25 : base.wind,
      leaves: base.leaves || 0,
      indoor: !!base.indoor,
    };
  },
  update(dt, room) {
    if (!FX.on()) { this.rainDrops.length = 0; this.leaves.length = 0; return; }
    const f = dt / 16.6;
    const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
    const want = Math.round(this.cur.rain * (this.cur.indoor ? 0 : 70));
    while (this.rainDrops.length < want)
      this.rainDrops.push({ x:Math.random()*(W+40)-20, y:Math.random()*H, l:5+Math.random()*7, s:3.4+Math.random()*2.4 });
    if (this.rainDrops.length > want) this.rainDrops.length = want;
    const drift = this.cur.wind * 1.6;
    for (const d of this.rainDrops) {
      d.y += d.s * f; d.x += drift * f;
      if (d.y > H) { d.y = -8; d.x = Math.random()*(W+40)-20; }
    }
    const wantL = Math.round(this.cur.leaves * 16);
    while (this.leaves.length < wantL)
      this.leaves.push({ x:Math.random()*W, y:Math.random()*H, vy:.18+Math.random()*.3,
                         ph:Math.random()*6.28, c:['#a8412c','#c2702c','#c9992f','#8a4326'][(Math.random()*4)|0], r:Math.random()*6 });
    if (this.leaves.length > wantL) this.leaves.length = wantL;
    for (const L of this.leaves) {
      L.ph += 0.04 * f; L.y += L.vy * f; L.x += (Math.sin(L.ph) * .5 + this.cur.wind) * f; L.r += .04 * f;
      if (L.y > H + 6) { L.y = -6; L.x = Math.random()*W; }
      if (L.x > W + 6) L.x = -6;
    }
    this.fogPhase += dt * 0.006;
  },
  drawFog(ctx) {
    const a = this.cur.fog;
    if (a < 0.02 || !FX.on()) return;
    const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const speed = 8 + i * 5, band = H * (0.28 + i * 0.12);
      const y = ((this.fogPhase * speed + i * 90) % (H + band)) - band * 0.5;
      const grad = ctx.createLinearGradient(0, y, 0, y + band);
      grad.addColorStop(0, 'rgba(178,186,196,0)');
      grad.addColorStop(0.5, `rgba(178,186,196,${(0.16 * a).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(178,186,196,0)');
      ctx.fillStyle = grad; ctx.fillRect(0, y, W, band);
    }
    ctx.fillStyle = `rgba(186,192,200,${(0.10 * a).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  },
  drawRain(ctx) {
    if (!this.rainDrops.length) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(186,204,224,.42)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of this.rainDrops) {
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - this.cur.wind * 3, d.y + d.l);
    }
    ctx.stroke();
    ctx.restore();
  },
  drawLeaves(ctx) {
    for (const L of this.leaves) {
      ctx.save();
      ctx.translate(L.x, L.y); ctx.rotate(L.r);
      ctx.fillStyle = L.c; ctx.fillRect(-2, -1, 4, 2); ctx.fillRect(-1, -2, 2, 4);
      ctx.restore();
    }
  },
};

/* =====================================================================
   LIGHTING — a darkness sheet with holes punched out by light sources.
   Cheap, and it does most of the atmospheric work.
===================================================================== */
const Lighting = {
  buf:null, bctx:null,
  ensure() {
    if (this.buf) return;
    this.buf = document.createElement('canvas');
    this.buf.width = CONFIG.VIEW_W; this.buf.height = CONFIG.VIEW_H;
    this.bctx = this.buf.getContext('2d');
  },
  /* A wedge of daylight through a window, with dust turning in it and a pool
     where it lands. Rooms opt in with sun:{x,y,w,len,tilt,a}. */
  drawSun(ctx, room, camX, camY) {
    const p = room.sun;
    if (!p || !FX.on()) return;
    let a = p.a === undefined ? .1 : p.a;
    if (gameState) {
      if (F('chosenEarthPath')) a *= 1.9;
      else if (F('sueDead') && !F('sueRevived')) a *= .25;
      else if (F('firstWitchDead')) a *= .6;
      a *= (1 - FX.corruption * .7);
    }
    if (a < .012) return;
    const t = Date.now() / 2600;
    const tilt = p.tilt || .2;
    const x = p.x - camX + Math.sin(t) * 5, y = p.y - camY;
    const half = p.w / 2, spread = Math.max(2, half + p.len * Math.abs(tilt));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createLinearGradient(x, y, x + p.len * tilt * .5, y + p.len);
    grad.addColorStop(0, `rgba(255,238,196,${(a*1.25).toFixed(3)})`);
    grad.addColorStop(.55, `rgba(255,226,170,${(a*.5).toFixed(3)})`);
    grad.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - half, y); ctx.lineTo(x + half, y);
    ctx.lineTo(x + spread, y + p.len); ctx.lineTo(x - spread + p.len*tilt, y + p.len);
    ctx.closePath(); ctx.fill();
    const px = x + p.len * tilt * .5, py = y + p.len;
    const pool = ctx.createRadialGradient(px, py, 0, px, py, spread);
    pool.addColorStop(0, `rgba(255,232,180,${(a*.7).toFixed(3)})`);
    pool.addColorStop(1, 'rgba(255,232,180,0)');
    ctx.fillStyle = pool;
    ctx.beginPath(); ctx.ellipse(px, py, spread, spread*.28, 0, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 9; i++) {
      const ph = t * 2 + i * 1.7;
      const dy = (ph * 14) % p.len;
      const dx = Math.sin(ph) * (half * .8);
      ctx.fillStyle = `rgba(255,244,214,${(a * 2.2 * (1 - dy/p.len)).toFixed(3)})`;
      ctx.fillRect(Math.round(x + dx), Math.round(y + dy), 1, 1);
    }
    ctx.restore();
  },

  /* Ambient darkness colour + strength for the current room and story beat. */
  ambientFor(room) {
    const p = room.light || {};
    let tint = p.tint || '#101828';
    let a = p.dark === undefined ? .28 : p.dark;
    if (gameState) {
      if (F('sueDead') && !F('sueRevived')) a += .12;
      if (F('chosenWitchPath')) { tint = '#2a0410'; a += .10; }
      if (F('chosenEarthPath')) a = Math.max(0, a - .18);
      a += FX.corruption * .10;
    }
    return { tint, a: clamp(a, 0, .82) };
  },
  draw(ctx, room, camX, camY) {
    if (!FX.on()) return;
    const amb = this.ambientFor(room);
    if (amb.a < 0.02) return;
    this.ensure();
    const g = this.bctx, W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = withA(amb.tint, amb.a);
    g.clearRect(0, 0, W, H); g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'destination-out';
    const t = Date.now();
    for (const L of World.lightsOf(room)) {
      const x = L.x - camX, y = L.y - camY;
      if (x < -L.r || x > W + L.r || y < -L.r || y > H + L.r) continue;
      const fl = L.flicker ? (0.86 + 0.14 * Math.sin(t / 90 + x)) : 1;
      const r = L.r * fl;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(0,0,0,${Math.min(1, (L.i||.8) * fl)})`);
      grad.addColorStop(0.55, `rgba(0,0,0,${(L.i||.8) * fl * 0.42})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.buf, 0, 0);
    // warm bloom on top of the lamps themselves
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const L of World.lightsOf(room)) {
      const x = L.x - camX, y = L.y - camY;
      if (x < -L.r || x > W + L.r || y < -L.r || y > H + L.r) continue;
      const fl = L.flicker ? (0.86 + 0.14 * Math.sin(t / 90 + x)) : 1;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, L.r * 0.6 * fl);
      grad.addColorStop(0, withA(L.c, 0.18 * (L.i || .8)));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, L.r * 0.6 * fl, 0, Math.PI*2); ctx.fill();
      if ((L.i || .8) > .45) {              // faint anamorphic glint on strong lamps
        const gl = ctx.createLinearGradient(x - L.r*.9, y, x + L.r*.9, y);
        gl.addColorStop(0, 'rgba(0,0,0,0)');
        gl.addColorStop(.5, withA(L.c, 0.10 * fl));
        gl.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gl; ctx.fillRect(x - L.r*.9, y - 1.5, L.r*1.8, 3);
      }
    }
    ctx.restore();
  }
};

/* =====================================================================
   UI HELPERS
===================================================================== */
const UI = {
  _toastT:null,
  toast(msg, dur=1500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(()=>t.classList.remove('show'), dur);
  },
  updateInventory() {
    const ip = document.getElementById('inventoryPanel');
    if (!gameState || !gameState.inventory.length) { ip.classList.remove('show'); return; }
    ip.classList.add('show');
    ip.textContent = '🎒 ' + gameState.inventory.join(', ');
  },
  dimControls(on) {
    document.getElementById('dpad').classList.toggle('dim', !!on);
    document.getElementById('actionBtn').classList.toggle('dim', !!on);
  },
  showScreen(id, on) { document.getElementById(id).classList.toggle('show', !!on); }
};

/* =====================================================================
   FX — particles, shake, glitch, flashes, magic circle, corruption
===================================================================== */
const FX = {
  particles:[], shake:0, shakeDecay:0.9,
  corruption:0,          // 0..1 — how far Naya has slipped
  tint:null, tintA:0,
  magic:null,            // {x,y,r,t,color}
  fogA:0,
  enabled:true,

  clearAll() {
    this.particles.length = 0; this.shake = 0; this.tint = null; this.tintA = 0;
    this.magic = null; this.fogA = 0;
    document.getElementById('glitchOverlay').style.opacity = 0;
    document.getElementById('flashOverlay').style.opacity = 0;
    document.getElementById('vignette').style.opacity = 0;
    document.getElementById('dialogueBox').classList.remove('shakeText');
  },
  on() { return this.enabled && (!gameState || gameState.settings.effects); },

  refreshCorruption() {
    if (!gameState) { this.corruption = 0; return; }
    let c = 0;
    if (F('firstWitchDead')) c += .22;
    if (F('secondAmulet'))   c += .16;
    if (F('sueDead'))        c += .26;
    if (F('sueLeftDead'))    c += .30;
    if (F('chosenWitchPath'))c += .20;
    if (F('chosenEarthPath'))c -= .55;
    if (F('sueRevived'))     c -= .10;
    c += Math.max(0, (S('witchAmbition') - 35) / 130);
    c -= Math.max(0, (S('humanity') - 60) / 220);
    const prev = Math.round(this.corruption * 4);
    this.corruption = clamp(c, 0, 1);
    if (Math.round(this.corruption * 4) !== prev && typeof World !== 'undefined') World.invalidate();
    const v = document.getElementById('vignette');
    v.style.opacity = this.on() ? (this.corruption * 0.85).toFixed(3) : 0;
  },

  spawn(x, y, n, opts={}) {
    if (!this.on()) return;
    for (let i=0;i<n;i++) {
      this.particles.push({
        x: x + (Math.random()-.5)*(opts.spread||10),
        y: y + (Math.random()-.5)*(opts.spread||10),
        vx: (Math.random()-.5)*(opts.speed||0.6),
        vy: (opts.rise !== undefined ? opts.rise : -0.35) + (Math.random()-.5)*0.3,
        life: opts.life || (40 + Math.random()*50),
        age: 0,
        size: opts.size || 1,
        color: opts.color || '#c060ff',
        grav: opts.grav || 0,
      });
    }
    if (this.particles.length > 320) this.particles.splice(0, this.particles.length - 320);
  },
  ambient(room) {
    if (!this.on()) return;
    if (room.ambient) room.ambient();
  },
  addShake(v) { if (this.on()) this.shake = Math.min(9, this.shake + v); },
  setTint(color, a) { this.tint = color; this.tintA = a; },
  fadeTint() { this.tintA *= 0.94; if (this.tintA < 0.01) { this.tintA = 0; this.tint = null; } },

  flash(color='#fff', dur=180, peak=0.9) {
    const el = document.getElementById('flashOverlay');
    if (!this.on()) return Promise.resolve();
    el.style.background = color;
    el.style.transition = 'none';
    el.style.opacity = peak;
    return new Promise(res => {
      requestAnimationFrame(()=>{
        el.style.transition = `opacity ${dur}ms`;
        el.style.opacity = 0;
        setTimeout(res, dur);
      });
    });
  },
  glitch(dur=400, strength=0.55) {
    const el = document.getElementById('glitchOverlay');
    if (!this.on()) return Promise.resolve();
    el.style.transition = 'none';
    el.style.opacity = strength;
    this.glitchSlices = 12;
    return new Promise(res => {
      setTimeout(()=>{
        el.style.transition = 'opacity 240ms';
        el.style.opacity = 0;
        this.glitchSlices = 0;
        res();
      }, dur);
    });
  },
  glitchSlices:0,

  magicCircle(x, y, color='#c060ff', dur=2200) {
    if (!this.on()) return Promise.resolve();
    this.magic = { x, y, r:4, t:0, dur, color };
    return new Promise(res => setTimeout(()=>{ this.magic = null; res(); }, dur));
  },

  update(dt) {
    const f = dt / 16.6;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * f; p.y += p.vy * f; p.vy += p.grav * f;
      p.age += f;
      if (p.age >= p.life) this.particles.splice(i, 1);
    }
    if (this.shake > 0) { this.shake *= Math.pow(this.shakeDecay, f); if (this.shake < 0.05) this.shake = 0; }
    if (this.magic) this.magic.t += dt;
    this.fadeTint();
    // corruption ambience: occasional red pulse + text jitter
    if (this.on() && this.corruption > 0.35 && Math.random() < 0.0016 * this.corruption) {
      this.setTint('#ff0028', 0.12 * this.corruption);
      Audio.beep(52, 0.12, 'sine', 0.05);
    }
    const db = document.getElementById('dialogueBox');
    db.classList.toggle('shakeText', this.on() && this.corruption > 0.62 && Dialogue.active && Math.random() < 0.35);
  },

  drawParticles(ctx, camX, camY) {
    for (const p of this.particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  },
  drawMagic(ctx, camX, camY) {
    if (!this.magic) return;
    const m = this.magic;
    const prog = Math.min(1, m.t / m.dur);
    const r = 6 + prog * 26;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.4 * Math.sin(m.t / 90);
    ctx.strokeStyle = m.color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(m.x - camX, m.y - camY, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x - camX, m.y - camY, r * 0.62, 0, Math.PI*2); ctx.stroke();
    // pentagram
    ctx.beginPath();
    for (let i=0;i<5;i++) {
      const a = -Math.PI/2 + (i * 4 * Math.PI) / 5 + m.t/1400;
      const px = m.x - camX + Math.cos(a) * r * 0.62;
      const py = m.y - camY + Math.sin(a) * r * 0.62;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
    if (Math.random() < 0.5) this.spawn(m.x, m.y, 1, { color:m.color, spread:r*2, life:36, rise:-0.5 });
  },
  drawOverlay(ctx) {
    if (this.tintA > 0.005 && this.tint) {
      ctx.globalAlpha = this.tintA; ctx.fillStyle = this.tint;
      ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H); ctx.globalAlpha = 1;
    }
    if (this.fogA > 0.01) {
      ctx.globalAlpha = this.fogA; ctx.fillStyle = '#3a0810';
      for (let i=0;i<7;i++) {
        const y = ((Date.now()/(60+i*22) + i*70) % (CONFIG.VIEW_H + 80)) - 40;
        ctx.fillRect(0, y, CONFIG.VIEW_W, 16 + i*3);
      }
      ctx.globalAlpha = 1;
    }
    if (this.glitchSlices > 0 && this.on()) {
      const c = Game.canvas;
      for (let i=0;i<this.glitchSlices;i++) {
        const y = Math.floor(Math.random() * CONFIG.VIEW_H);
        const h = 3 + Math.floor(Math.random()*10);
        const dx = Math.floor((Math.random()-.5) * 22);
        try { ctx.drawImage(c, 0, y, CONFIG.VIEW_W, h, dx, y, CONFIG.VIEW_W, h); } catch(e) {}
      }
    }
  }
};

/* =====================================================================
   FADE / TITLE
===================================================================== */
function fadeOut(dur=500) {
  return new Promise(res => {
    const f = document.getElementById('fade');
    f.style.transition = `opacity ${dur}ms`;
    f.classList.add('show');
    setTimeout(res, dur);
  });
}
function fadeIn(dur=500) {
  return new Promise(res => {
    const f = document.getElementById('fade');
    f.style.transition = `opacity ${dur}ms`;
    f.classList.remove('show');
    setTimeout(res, dur);
  });
}
/* Карточка на экране.

   hold:true — карточка не уходит сама: через несколько секунд под ней
   появляется «нажмите, чтобы продолжить», и дальше решает игрок. Так
   сделана цитата после сказа о Мидее: её надо успеть дочитать. */
async function flashTitle(text, dur=1500, hold=false) {
  const el = document.getElementById('titleFlash');
  const hint = document.getElementById('titleHint');
  el.textContent = text;
  el.classList.add('show');
  if (!hold) {
    await new Promise(r => setTimeout(r, dur));
    el.classList.remove('show');
    return;
  }
  await new Promise(r => setTimeout(r, dur));
  hint.classList.add('show');
  await new Promise(resolve => {
    const go = () => {
      window.removeEventListener('pointerdown', go);
      window.removeEventListener('keydown', go);
      hint.classList.remove('show');
      el.classList.remove('show');
      Audio.click();
      resolve();
    };
    window.addEventListener('pointerdown', go);
    window.addEventListener('keydown', go);
  });
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

/* Interior shell: back wall, skirting, floorboards — so every room starts
   from something that reads as a room instead of a coloured rectangle. */
function paintInterior(ctx, w, h, o) {
  o = o || {};
  const wallH = o.wallH || 56;
  ctx.fillStyle = o.wall || PAL.wallIn; ctx.fillRect(0, 0, w, wallH);
  ctx.fillStyle = o.wall2 || PAL.wallIn2;
  if (o.stripes !== false) for (let x = 0; x < w; x += 12) ctx.fillRect(x, 0, 2, wallH);
  ctx.fillStyle = shade(o.wall || PAL.wallIn, .7); ctx.fillRect(0, wallH - 5, w, 3);
  ctx.fillStyle = shade(o.wall || PAL.wallIn, 1.15); ctx.fillRect(0, wallH - 2, w, 2);
  const f1 = o.floor || PAL.floorWood, f2 = o.floor2 || PAL.floorWood2;
  ctx.fillStyle = f1; ctx.fillRect(0, wallH, w, h - wallH);
  ctx.fillStyle = f2;
  if (o.tiles) {
    for (let y = wallH; y < h; y += 16) for (let x = 0; x < w; x += 16)
      if (((x / 16 + y / 16) | 0) % 2) ctx.fillRect(x, y, 16, 16);
  } else {
    for (let y = wallH + 6; y < h; y += 13) ctx.fillRect(0, y, w, 1);
    for (let y = wallH; y < h; y += 13) {
      const off = ((y / 13) | 0) % 2 ? 24 : 0;
      for (let x = off; x < w; x += 56) ctx.fillRect(x, y, 1, 13);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(0, wallH, w, 6);
}

/* Длинный университетский коридор: стена с ритмом высоких окон, полосы
   света на полу под ними и ряд дверей с табличками. Рисуется один раз в
   кэш фона, поэтому окон может быть сколько угодно. */
/* Раскладка стены коридора.

   Элементы идут слева направо, простенки между ними одинаковые: дверь
   физически не может встать поверх окна, а окно — внутрь дверного проёма,
   потому что позиции считаются, а не проставляются руками. Возвращает и
   сами элементы, и середины простенков — туда вешаются картины и стенды.   */
function wallLayout(W, items, opts) {
  const o = opts || {};
  const pad = o.pad === undefined ? 14 : o.pad;
  const std = { win:34, door:40 };
  const list = items.map(it => Object.assign({}, it, { w: it.w || std[it.k] || 34 }));
  const used = list.reduce((s, it) => s + it.w, 0);
  const gaps = Math.max(1, list.length - 1);
  const pier = (W - pad * 2 - used) / gaps;
  if (pier < 12) console.warn('стена переполнена, простенок', pier.toFixed(1), 'px');
  const piers = [];
  let x = pad;
  list.forEach((it, i) => {
    it.x = Math.round(x);
    x += it.w;
    if (i < list.length - 1) { piers.push({ x:Math.round(x), w:Math.round(pier) }); x += pier; }
  });
  return {
    items: list, piers, gap: pier,
    by(id)  { return list.find(it => it.id === id); },
    at(id)  { const it = this.by(id); return it ? it.x : 0; },
    mid(id) { const it = this.by(id); return it ? it.x + it.w / 2 : 0; },
    pierMid(i) { const p = piers[i]; return p ? p.x + p.w / 2 : 0; },
  };
}

/* Общий художник длинных коридоров университета.

   Свет собран по референсу: высокие окна с частым переплётом, стекло выбито
   почти в белое золото, а на пол ложатся длинные косые полосы — все с одним
   наклоном, иначе коридор читается плоско. Низ стены — деревянные панели,
   по углам комнаты подмешана тень.

   Коридор умеет заворачивать: armH задаёт, где кончается горизонтальный
   рукав, а bend:{x0,x1} прорезает в стене под ним проход вниз. Всё
   остальное ниже armH становится стеной, и получается угол.                 */
function paintCorridor(ctx, W, H, o) {
  o = o || {};
  const wallH  = o.wallH || 74;
  const armH   = o.armH  || H;
  const bend   = o.bend  || null;
  const warm   = o.warm  || '#6f6152';
  const floor  = o.floor || '#8a7454';
  const floor2 = o.floor2|| '#77603f';
  const wainH  = o.wainH === undefined ? Math.round(wallH * .18) : o.wainH;   // панели низкие: окна должны быть высокими
  const tilt   = o.tilt  === undefined ? .5 : o.tilt;
  const lightA = o.lightA === undefined ? .30 : o.lightA;

  /* стена: штукатурка сверху, панели снизу, карниз и плинтус */
  const wallFace = (x0, w, top, h) => {
    const g = ctx.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, shade(warm, .74)); g.addColorStop(.7, warm); g.addColorStop(1, shade(warm, .88));
    ctx.fillStyle = g; ctx.fillRect(x0, top, w, h);
    const wy = top + h - wainH;
    ctx.fillStyle = shade(warm, .68); ctx.fillRect(x0, wy, w, wainH);
    ctx.fillStyle = shade(warm, .56);
    for (let x = x0 + 6; x < x0 + w - 8; x += 22) ctx.fillRect(x, wy + 4, 14, wainH - 9);
    ctx.fillStyle = shade(warm, .94); ctx.fillRect(x0, wy - 3, w, 3);
    ctx.fillStyle = shade(warm, 1.10); ctx.fillRect(x0, wy - 4, w, 1);
    ctx.fillStyle = shade(warm, .44); ctx.fillRect(x0, top + h - 3, w, 3);
  };

  const floorArea = (x0, y0, w, h, edge) => {
    ctx.fillStyle = floor; ctx.fillRect(x0, y0, w, h);
    ctx.fillStyle = floor2;
    for (let y = y0 + 7; y < y0 + h; y += 13) ctx.fillRect(x0, y, w, 1);
    for (let x = x0; x < x0 + w; x += 64) {
      const off = ((x / 64) | 0) % 2 ? 6 : 0;
      for (let y = y0 + off; y < y0 + h; y += 26) ctx.fillRect(x, y, 1, 13);
    }
    if (edge !== false) { ctx.fillStyle = 'rgba(0,0,0,.20)'; ctx.fillRect(x0, y0, w, 7); }
  };

  wallFace(0, W, 0, wallH);
  floorArea(0, wallH, W, armH - wallH);

  /* окна: узкие переплёты, стекло на просвет */
  const L = o.layout || null;
  const wins = L ? L.items.filter(it => it.k === 'win').map(it => it.x) : (o.windows || []);
  const winTop = Math.max(6, Math.round(wallH * .10));
  const winH   = wallH - wainH - winTop - 8;
  const winW   = 34;
  wins.forEach(wx => {
    ctx.fillStyle = shade(warm, .48); ctx.fillRect(wx - 4, winTop - 3, winW + 8, winH + 8);
    const gl = ctx.createLinearGradient(0, winTop, 0, winTop + winH);
    gl.addColorStop(0, '#fff7e2'); gl.addColorStop(.45, o.glass || '#ffe6ae'); gl.addColorStop(1, o.glassLow || '#eab873');
    ctx.fillStyle = gl; ctx.fillRect(wx, winTop, winW, winH);
    ctx.save();                                        // двор за стеклом, съеденный светом
    ctx.globalAlpha = .20; ctx.fillStyle = o.leaf1 || '#8a4a24';
    ctx.beginPath(); ctx.arc(wx + 10, winTop + winH * .40, 9, 0, 6.3); ctx.fill();
    ctx.fillStyle = o.leaf2 || '#a8702c';
    ctx.beginPath(); ctx.arc(wx + 25, winTop + winH * .32, 7, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#4a4028'; ctx.fillRect(wx, winTop + winH - 7, winW, 7);
    ctx.restore();
    ctx.fillStyle = shade(warm, .40);                  // частый переплёт
    for (let i = 1; i < 3; i++) ctx.fillRect(wx + Math.round(i * winW / 3) - 1, winTop, 2, winH);
    for (let i = 1; i < 5; i++) ctx.fillRect(wx, winTop + Math.round(i * winH / 5) - 1, winW, 2);
    ctx.fillStyle = shade(warm, 1.28); ctx.fillRect(wx - 4, winTop - 3, winW + 8, 3);
    ctx.fillStyle = shade(warm, .64);  ctx.fillRect(wx - 6, winTop + winH + 3, winW + 12, 5);
  });

  /* полосы света на полу: одна на окно, все с одинаковым наклоном */
  const len = armH - wallH;
  if (len > 0) wins.forEach(wx => {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, wallH, 0, armH);
    g.addColorStop(0, `rgba(255,242,208,${lightA.toFixed(3)})`);
    g.addColorStop(.5, `rgba(255,232,186,${(lightA * .5).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,226,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(wx - 2, wallH); ctx.lineTo(wx + winW + 2, wallH);
    ctx.lineTo(wx + winW + 2 + len * tilt, armH); ctx.lineTo(wx - 2 + len * tilt, armH);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .45;                             // след переплёта внутри пятна
    for (let i = 0; i < 3; i++) {
      const px = wx + 1 + Math.round(i * winW / 3);
      ctx.beginPath();
      ctx.moveTo(px, wallH); ctx.lineTo(px + 8, wallH);
      ctx.lineTo(px + 8 + len * tilt, armH); ctx.lineTo(px + len * tilt, armH);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  });

  /* двери с табличками — стоят в простенке, дверной проём до самого пола */
  const doorH = o.doorH || Math.min(78, wallH - 12);
  const DOOR_SKIN = {
    plain:  { frame:'#372a1c', leaf:'#5f4530', panel:'#4a3524' },
    heavy:  { frame:'#33261a', leaf:'#553f2a', panel:'#3f2c1c' },   // библиотека
    office: { frame:'#33261a', leaf:'#4f3a26', panel:'#3d2c1e' },   // кабинет
    glass:  { frame:'#372a1c', leaf:'#5f4530', panel:'#e8c489' },   // аудитория со стеклом
    stage:  { frame:'#3a2c1e', leaf:'#5a1024', panel:'#7a1830' },   // выход на сцену
  };
  const doors = L ? L.items.filter(it => it.k === 'door')
                  : (o.doors || []).map(([dx, label]) => ({ x:dx, w:32, label }));
  doors.forEach(d => {
    const dw = Math.max(24, (d.w || 40) - 8), dx = d.x + 4;
    const dh = d.h || doorH, dy = wallH - dh;
    const sk = DOOR_SKIN[d.style] || DOOR_SKIN.plain;
    ctx.fillStyle = sk.frame; ctx.fillRect(dx - 4, dy - 4, dw + 8, dh + 4);
    ctx.fillStyle = sk.leaf;  ctx.fillRect(dx, dy, dw, dh);
    ctx.fillStyle = sk.panel;
    ctx.fillRect(dx + 4, dy + 5, dw - 8, Math.round(dh * .38));
    ctx.fillRect(dx + 4, dy + Math.round(dh * .52), dw - 8, Math.round(dh * .36));
    ctx.fillStyle = shade(warm, 1.3); ctx.fillRect(dx - 4, dy - 4, dw + 8, 2);
    ctx.fillStyle = '#c9a05a'; ctx.fillRect(dx + dw - 7, dy + Math.round(dh * .55), 3, 4);
    if (d.label) {
      const lw = Math.max(16, d.label.length * 4 + 6);
      ctx.fillStyle = '#d8cfae'; ctx.fillRect(dx + dw / 2 - lw / 2, dy - 14, lw, 9);
      ctx.fillStyle = '#3a3026'; ctx.font = '5px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(d.label, dx + dw / 2, dy - 7); ctx.textAlign = 'left';
    }
  });

  /* поворот: проход вниз, всё остальное под рукавом — стена */
  if (bend) {
    const cap = 15;
    [[0, bend.x0], [bend.x1, W - bend.x1]].forEach(([sx, sw]) => {
      if (sw <= 0) return;
      ctx.fillStyle = shade(warm, .52); ctx.fillRect(sx, armH, sw, cap);
      ctx.fillStyle = shade(warm, 1.04); ctx.fillRect(sx, armH, sw, 2);
      ctx.fillStyle = shade(warm, .30); ctx.fillRect(sx, armH + cap, sw, H - armH - cap);
    });
    floorArea(bend.x0, armH, bend.x1 - bend.x0, H - armH, false);
    ctx.fillStyle = 'rgba(0,0,0,.30)';                 // тени от стен прохода
    ctx.fillRect(bend.x0, armH, 5, H - armH);
    ctx.fillRect(bend.x1 - 5, armH, 5, H - armH);
    const gd = ctx.createLinearGradient(0, armH, 0, H);
    gd.addColorStop(0, 'rgba(0,0,0,0)'); gd.addColorStop(1, 'rgba(0,0,0,.34)');
    ctx.fillStyle = gd; ctx.fillRect(bend.x0, armH, bend.x1 - bend.x0, H - armH);
  }

  /* виньетка — углы коридора должны уходить в темноту */
  const vg = ctx.createRadialGradient(W / 2, armH - 20, Math.min(W, H) * .22,
                                      W / 2, armH - 20, Math.max(W, H) * .70);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(12,7,10,${o.vignette === undefined ? .36 : o.vignette})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* Раскладка стены КРЫЛА — то же, что wallLayout, но вдоль оси Y.

   Крылья университета на плане идут с юга на север, поэтому игрок видит
   их сверху как вертикальный коридор: пол посередине, стены слева и
   справа, двери и окна врезаны в обе стены. Элементы раскладываются
   сверху вниз с одинаковыми простенками — дверь физически не может
   наехать на окно, а табличка не может разъехаться со своим проёмом.  */
function wingLayout(H, items, opts) {
  const o = opts || {};
  const pad = o.pad === undefined ? 24 : o.pad;
  const std = { win:42, door:40 };
  const list = items.map(it => Object.assign({}, it, { h: it.h || std[it.k] || 40 }));
  const used = list.reduce((a, it) => a + it.h, 0);
  const gaps = Math.max(1, list.length - 1);
  const pier = (H - pad * 2 - used) / gaps;
  if (pier < 10) console.warn('стена крыла переполнена, простенок', pier.toFixed(1), 'px');
  let y = pad;
  list.forEach(it => { it.y = Math.round(y); y += it.h + pier; });
  return {
    items: list, gap: pier,
    by(id)  { return list.find(it => it.id === id); },
    at(id)  { const it = this.by(id); return it ? it.y : 0; },
    mid(id) { const it = this.by(id); return it ? it.y + it.h / 2 : 0; },
    /* Точка, где игрок стоит перед дверью: у самой грани стены. */
    stand(id, W, side) { return [side === 'L' ? 74 : W - 74, this.mid(id) + 6]; },
  };
}

/* КРЫЛО УНИВЕРСИТЕТА СВЕРХУ.

   Коридор во всю высоту комнаты, толстые стены по бокам, в них — проёмы
   дверей и оконные ниши. Дверь рисуется как ниша в толще стены со
   створкой и табличкой на простенке рядом: понятно, что за дверью есть
   помещение, а не пустота. Окна выходят во внутренний двор и кладут на
   пол длинные косые пятна света — тот же язык, что и в остальной игре. */
function paintWing(ctx, W, H, o) {
  o = o || {};
  const wallW  = o.wallW  || 62;
  const warm   = o.warm   || '#6b5a44';
  const floor  = o.floor  || '#8e7448';
  const floor2 = o.floor2 || '#7a6038';
  const rx = W - wallW;
  const DOOR_SKIN = {
    plain:  { frame:'#372a1c', leaf:'#5f4530', panel:'#4a3524' },
    heavy:  { frame:'#33261a', leaf:'#553f2a', panel:'#3f2c1c' },
    office: { frame:'#33261a', leaf:'#4f3a26', panel:'#3d2c1e' },
    glass:  { frame:'#372a1c', leaf:'#5f4530', panel:'#e8c489' },
    stage:  { frame:'#3a2c1e', leaf:'#5a1024', panel:'#7a1830' },
    shut:   { frame:'#2b2018', leaf:'#413020', panel:'#33251a' },   // закрытое помещение
  };

  /* пол */
  ctx.fillStyle = floor; ctx.fillRect(wallW, 0, rx - wallW, H);
  ctx.fillStyle = floor2;
  for (let y = 0; y < H; y += 24) ctx.fillRect(wallW, y, rx - wallW, 1);
  for (let x = wallW + 16; x < rx; x += 30) ctx.fillRect(x, 0, 1, H);

  /* толща стены с внутренней панелью */
  const band = (x0, dir) => {
    const g = ctx.createLinearGradient(x0, 0, x0 + wallW, 0);
    g.addColorStop(dir > 0 ? 0 : 1, shade(warm, .60));
    g.addColorStop(dir > 0 ? 1 : 0, shade(warm, .94));
    ctx.fillStyle = g; ctx.fillRect(x0, 0, wallW, H);
    ctx.fillStyle = shade(warm, .50);                       // кладка
    for (let y = 6; y < H; y += 14) ctx.fillRect(x0 + ((y / 14) | 0) % 2 * 10, y, wallW - 12, 1);
    const face = dir > 0 ? x0 + wallW : x0;                 // грань, обращённая в коридор
    ctx.fillStyle = shade(warm, .72); ctx.fillRect(face - (dir > 0 ? 9 : 0), 0, 9, H);
    ctx.fillStyle = shade(warm, 1.20); ctx.fillRect(face - (dir > 0 ? 10 : -9), 0, 1, H);
    ctx.fillStyle = 'rgba(0,0,0,.34)'; ctx.fillRect(face - (dir > 0 ? 1 : 0), 0, 1, H);
  };
  band(0, 1); band(rx, -1);

  /* окна: ниша в стене, стекло на просвет и косое пятно на полу */
  const win = (it, dir) => {
    const face = dir > 0 ? wallW : rx;
    const nx = dir > 0 ? face - 26 : face;
    ctx.fillStyle = shade(warm, .44); ctx.fillRect(nx - (dir > 0 ? 4 : 0), it.y - 5, 30, it.h + 10);
    const gl = ctx.createLinearGradient(nx, 0, nx + 26, 0);
    gl.addColorStop(dir > 0 ? 0 : 1, o.glassLow || '#eab873');
    gl.addColorStop(dir > 0 ? 1 : 0, '#fff7e2');
    ctx.fillStyle = gl; ctx.fillRect(nx, it.y, 26, it.h);
    ctx.save(); ctx.globalAlpha = .22;                       // двор за стеклом
    ctx.fillStyle = o.leaf1 || '#a8412c';
    ctx.beginPath(); ctx.arc(nx + 13, it.y + it.h * .34, 8, 0, 6.3); ctx.fill();
    ctx.fillStyle = o.leaf2 || '#c9992f';
    ctx.beginPath(); ctx.arc(nx + 13, it.y + it.h * .70, 6, 0, 6.3); ctx.fill();
    ctx.restore();
    ctx.fillStyle = shade(warm, .40);                        // переплёт
    ctx.fillRect(nx, it.y + Math.round(it.h / 2) - 1, 26, 2);
    for (let i = 1; i < 3; i++) ctx.fillRect(nx + Math.round(i * 26 / 3) - 1, it.y, 2, it.h);
    ctx.fillStyle = shade(warm, 1.24); ctx.fillRect(nx - (dir > 0 ? 4 : 0), it.y - 5, 30, 2);
    /* свет на полу */
    const len = (rx - wallW) * .62;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = dir > 0 ? ctx.createLinearGradient(wallW, 0, wallW + len, 0)
                      : ctx.createLinearGradient(rx, 0, rx - len, 0);
    const a = o.lightA === undefined ? .34 : o.lightA;
    g.addColorStop(0, `rgba(255,242,208,${a.toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,226,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (dir > 0) { ctx.moveTo(wallW, it.y); ctx.lineTo(wallW, it.y + it.h);
                   ctx.lineTo(wallW + len, it.y + it.h + 30); ctx.lineTo(wallW + len, it.y + 30); }
    else         { ctx.moveTo(rx, it.y); ctx.lineTo(rx, it.y + it.h);
                   ctx.lineTo(rx - len, it.y + it.h + 30); ctx.lineTo(rx - len, it.y + 30); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  };

  /* дверь: ниша в толще стены, створка и табличка на простенке */
  const door = (it, dir) => {
    const sk = DOOR_SKIN[it.style] || DOOR_SKIN.plain;
    const face = dir > 0 ? wallW : rx;
    const nx = dir > 0 ? face - 30 : face;
    ctx.fillStyle = sk.frame; ctx.fillRect(nx - (dir > 0 ? 4 : 0), it.y - 4, 34, it.h + 8);
    ctx.fillStyle = sk.leaf;  ctx.fillRect(nx + (dir > 0 ? 2 : 4), it.y, 26, it.h);
    ctx.fillStyle = sk.panel;
    ctx.fillRect(nx + (dir > 0 ? 6 : 8), it.y + 4, 18, Math.round(it.h * .40));
    ctx.fillRect(nx + (dir > 0 ? 6 : 8), it.y + Math.round(it.h * .54), 18, Math.round(it.h * .36));
    ctx.fillStyle = '#c9a05a';                                        // ручка
    ctx.fillRect(dir > 0 ? nx + 26 : nx + 5, it.y + Math.round(it.h / 2) - 2, 3, 4);
    ctx.fillStyle = shade(warm, 1.30); ctx.fillRect(nx - (dir > 0 ? 4 : 0), it.y - 4, 34, 2);
    if (it.label) {                                                   // табличка на простенке
      const lw = Math.max(18, it.label.length * 4 + 6);
      const lx = dir > 0 ? Math.max(2, face - lw - 2)
                         : Math.min(W - lw - 2, face + 2);
      ctx.fillStyle = '#d8cfae'; ctx.fillRect(lx, it.y - 14, lw, 9);
      ctx.fillStyle = '#3a3026'; ctx.font = '5px Courier New';
      ctx.fillText(it.label, lx + 3, it.y - 7);
    }
  };

  [[o.left, 1], [o.right, -1]].forEach(([L, dir]) => {
    if (!L) return;
    L.items.forEach(it => { if (it.k === 'win') win(it, dir); });
    L.items.forEach(it => { if (it.k === 'door') door(it, dir); });
  });

  /* торцы коридора: тёмный проём наверху, светлый выход вниз */
  if (o.capTop !== false) {
    ctx.fillStyle = 'rgba(10,8,12,.34)'; ctx.fillRect(wallW, 0, rx - wallW, 16);
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .30,
                                      W / 2, H / 2, Math.max(W, H) * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(12,7,10,${o.vignette === undefined ? .34 : o.vignette})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* КОМНАТА С ДВЕРЬЮ В БОКОВОЙ СТЕНЕ.

   Помещения крыльев выходят в коридор не сверху, а вбок — иначе здание
   не читается как здание. Художник добавляет к обычному интерьеру толщу
   боковой стены с дверным проёмом ровно там, где стоит точка выхода. */
function paintRoom(ctx, W, H, o) {
  o = o || {};
  paintInterior(ctx, W, H, o);
  const warm = o.side || shade(o.wall || '#5a4a3c', 1.06);
  const bandW = o.bandW || 22;
  const wall = (x0, dir) => {                       // dir: 1 — стена слева
    const g = ctx.createLinearGradient(x0, 0, x0 + bandW, 0);
    g.addColorStop(dir > 0 ? 0 : 1, shade(warm, .58));
    g.addColorStop(dir > 0 ? 1 : 0, shade(warm, .92));
    ctx.fillStyle = g; ctx.fillRect(x0, 0, bandW, H);
    const face = dir > 0 ? x0 + bandW : x0;
    ctx.fillStyle = shade(warm, 1.18); ctx.fillRect(face - (dir > 0 ? 1 : 0), 0, 1, H);
    ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fillRect(face - (dir > 0 ? 3 : -2), 0, 3, H);
  };
  const doorway = (x0, dir, y, h) => {              // проём в толще стены
    ctx.fillStyle = '#241a12'; ctx.fillRect(x0, y - 3, bandW, h + 6);
    ctx.fillStyle = '#0f0b08'; ctx.fillRect(x0 + (dir > 0 ? 0 : 4), y, bandW - 4, h);
    ctx.fillStyle = '#3a2c1e';
    ctx.fillRect(dir > 0 ? x0 + bandW - 4 : x0, y - 3, 4, h + 6);
    ctx.fillStyle = shade(warm, 1.24); ctx.fillRect(x0, y - 4, bandW, 2);
  };
  if (o.left)  { wall(0, 1);          if (o.left.door)  doorway(0, 1, o.left.door[0], o.left.door[1]); }
  if (o.right) { wall(W - bandW, -1); if (o.right.door) doorway(W - bandW, -1, o.right.door[0], o.right.door[1]); }
  if (o.label) {
    ctx.fillStyle = 'rgba(200,184,160,.55)'; ctx.font = '6px Courier New';
    ctx.fillText(o.label, o.labelAt ? o.labelAt[0] : 26, o.labelAt ? o.labelAt[1] : H - 12);
  }
}

/* Окно, выходящее во внутренний двор: одинаковое во всех помещениях,
   которые смотрят на двор, — так двор читается как одно место. */
function paintYardWindow(ctx, x, y, w, h, o) {
  o = o || {};
  ctx.fillStyle = '#4a4136'; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  const sky = ctx.createLinearGradient(0, y, 0, y + h);
  sky.addColorStop(0, o.top || '#9db0c4'); sky.addColorStop(1, o.bot || '#c2c0ac');
  ctx.fillStyle = sky; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#a8412c'; ctx.beginPath(); ctx.arc(x + w * .30, y + h * .42, w * .17, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#c2702c'; ctx.beginPath(); ctx.arc(x + w * .68, y + h * .34, w * .13, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#5e6338'; ctx.fillRect(x, y + h - Math.round(h * .22), w, Math.round(h * .22));
  ctx.fillStyle = '#3f382e';
  ctx.fillRect(x + Math.round(w / 2) - 1, y, 2, h);
  ctx.fillRect(x, y + Math.round(h / 2) - 1, w, 2);
  ctx.fillStyle = '#7d6d5c'; ctx.fillRect(x - 4, y - 4, w + 8, 3);
  ctx.fillStyle = '#4a4136'; ctx.fillRect(x - 6, y + h + 2, w + 12, 5);
}

/* Small shared painters */
function paintDoor(ctx, x, y, w=30, h=15) {
  ctx.fillStyle = '#2a1810'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#8a6040'; ctx.fillRect(x+2, y+2, w-4, h-2);
  ctx.fillStyle = '#c0a060'; ctx.fillRect(x+w-7, y+h-6, 3, 3);
}
function paintRunes(ctx, pts, color='#40a0ff', t=0) {
  ctx.save();
  ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t/300);
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  pts.forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-r*.7, y); ctx.lineTo(x+r*.7, y);
    ctx.moveTo(x, y-r*.7); ctx.lineTo(x, y+r*.7); ctx.stroke();
  });
  ctx.restore();
}

/* =====================================================================
   ROOMS
   NPCs and interactables may carry `when()` — evaluated from flags, so
   the world rebuilds itself correctly after any save/load.
===================================================================== */
function roomNPCs(room) { return (room.npcs || []).filter(n => !n.when || n.when()); }
/* Фоновые NPC ходят по заранее заданным точкам: сложный AI ради трёх
   студентов не нужен, а коридор от этого сразу становится живым.
   Маршруты замкнутые, поэтому персонаж может ходить по кругу бесконечно. */
/* Кристалл рядом с ведьмой.

   Не компас: он не говорит «ведьма рядом» и не показывает направление.
   Просто изредка вздрагивает искрой и коротко звенит, когда в комнате
   есть та, на кого он отзывается. Вывод делает игрок, а не подсказка. */
/* ОХРАНА УНИВЕРСИТЕТА.

   Ная не студентка, и бесконечно ходить по корпусу ей никто не даст.
   Каждый разговор со студентом или сотрудником добавляет внимания; на
   четвёртом кто-то доносит охране. Наказание не приходит после первого
   разговора — игрок должен успеть понять, что корпус живой и за доступом
   следят. После высылки прямой вход закрыт, и остаётся обходной путь. */
const Campus = {
  LIMIT: 4,
  UNI_ROOMS: ['uniHall','uniWestHall','uniEastHall','uniCourtyard',
              'uniRehearsal','uniDressing','uniCostume','uniTeachersRoom','uniTheatre',
              'uniLibrary','uniMorelOffice','uniAud14','uniMusicRoom','uniArtRoom',
              'uniCorr2','uniWest2','uniEast2','uniOldWing'],
  inside() { return gameState && this.UNI_ROOMS.includes(gameState.currentRoom); },

  /* Зовётся из диалогов со студентами и сотрудниками. */
  noticed() {
    if (!gameState || F('universityAccessRestricted') || !this.inside()) return;
    addC('campusHeat');
    const n = C('campusHeat');
    if (n === this.LIMIT - 1 && !F('universityWarned')) {
      setFlag('universityWarned');
      UI.toast('На тебя оглядываются', 2400);
    }
    if (n < this.LIMIT) return;
    /* Пока идёт глава «Женевьева Морель», внимание не выставляет Наю сразу:
       оно копится в жалобу, по которой её остановят на четвёртый день. Это
       та самая жалоба из сценария, а не отдельная случайная сцена. */
    const d = C('uniDay');
    if (d >= 1 && d <= 4) {
      if (!F('complaintFiled')) {
        setFlag('complaintFiled');
        UI.toast('Кто-то пошёл к охране', 2600);
      }
      return;
    }
    setTimeout(()=> Scene.play('securityEject'), 600);
  },
};

/* СМЕНА В КАФЕ — Ная работает официанткой.

   Петля простая и вся видна на экране: посетитель садится за столик, над
   ним появляется вопрос — Ная подходит и принимает заказ. С заказом она
   бежит к стойке, называет блюдо Крису, тот три секунды готовит и ставит
   тарелку на выдачу. Ная забирает её и несёт тому, кто заказывал. Пока
   она бегает, приходят следующие — и главная задача не перепутать, кому
   что нести.

   Рецептов нет и знать их не нужно: заказ виден в пузыре над гостем и
   продублирован в блокноте внизу экрана. Ошибка не наказывает — блюдо
   уходит в мойку, и его можно приготовить заново. Смена всё равно
   заканчивается по таймеру, даже если игрок не выдал ни одного заказа. */
const Shift = {
  W:240, H:340,
  SHIFT_MS: 120000,                 // две минуты — ровно столько, чтобы устать
  SPEED: 0.075,                     // пикселей в миллисекунду
  COOK_MS: 3000,                    // Крис готовит три секунды
  PASS_MAX: 2,                      // больше двух тарелок на выдачу не влезает

  /* Меню: шесть позиций, каждая со своей формой и цветом, чтобы иконки
     различались в пузыре размером с ноготь. */
  MENU: [
    { id:'espresso', n:'Эспрессо',  c:'#3a2416', k:'cup'  },
    { id:'cappu',    n:'Капучино',  c:'#8a6242', k:'cup'  },
    { id:'latte',    n:'Латте',     c:'#c9a274', k:'glass'},
    { id:'choco',    n:'Шоколад',   c:'#5a3020', k:'mug'  },
    { id:'muffin',   n:'Кекс',      c:'#6a4428', k:'cake' },
    { id:'croissant',n:'Круассан',  c:'#d8a860', k:'horn' },
  ],
  TABLES: [ {x:52,y:168}, {x:188,y:168}, {x:52,y:262}, {x:188,y:262} ],
  FACES: ['customer','student','acolyte','neighbor','friend'],
  ORDER_LINES: [
    'Мне, пожалуйста,', 'Один', 'Будьте добры,', 'Можно', 'Мне бы',
  ],
  CHRIS: [
    'Крис: «Кофемашина сегодня добрая. Не буди её.»',
    'Крис: «Слушай, ты вообще ела сегодня?»',
    'Крис: «За окном уже темно. Ты заметила?»',
    'Крис: «Последний. Дальше я сам.»',
  ],
  PHASES: [
    ['ДНЕВНАЯ СМЕНА',  '#2a1c14'],
    ['ПОСЛЕ ОБЕДА',    '#33200f'],
    ['ЗА ОКНОМ СЕРЕЕТ','#241a1c'],
    ['КОНЕЦ СМЕНЫ',    '#1a1420'],
  ],

  /* ---------------- состояние ---------------- */
  naya:null, guests:[], pass:[], carry:null, cooking:null, menuOpen:false,
  served:0, missed:0, wrong:0, left:0, raf:0, resolve:null, last:0, flash:0, spawnIn:0,

  run() {
    return new Promise(res => {
      this.resolve = res;
      this.naya = { x:120, y:300, tx:120, ty:300, step:0 };
      this.guests = []; this.pass = []; this.carry = null; this.cooking = null;
      this.menuOpen = false; this.served = 0; this.missed = 0; this.wrong = 0;
      this.left = this.SHIFT_MS; this.spawnIn = 900; this.flash = 0;
      this.cv = document.getElementById('shiftCanvas');
      this.ctx = this.cv.getContext('2d');
      this.bind();
      document.getElementById('shiftScreen').classList.add('show');
      Game.mode = 'shift';
      UI.dimControls(true);
      this.phase();
      this.say('Подойди к гостю, чтобы принять заказ.');
      this.last = performance.now();
      const loop = t => {
        this.raf = requestAnimationFrame(loop);      // кадр планируем первым:
        const dt = Math.min(60, t - this.last);      // ошибка в отрисовке не
        this.last = t;                               // должна замораживать смену
        try { this.update(dt); this.draw(); } catch (e) { console.error('shift', e); }
      };
      this.raf = requestAnimationFrame(loop);
    });
  },

  /* Управление одно на мышь и палец: тап — Ная идёт туда. Никаких
     джойстиков поверх и без того тесного экрана. */
  bind() {
    if (this._bound) return;
    this._bound = true;
    const at = e => {
      const r = this.cv.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return [ (p.clientX - r.left) * this.W / r.width, (p.clientY - r.top) * this.H / r.height ];
    };
    const tap = e => {
      if (!this.resolve) return;
      e.preventDefault();
      const [x, y] = at(e);
      if (this.menuOpen) return this.pickDish(x, y);
      this.naya.tx = clamp(x, 14, this.W - 14);
      this.naya.ty = clamp(y, 112, this.H - 46);
    };
    this.cv.addEventListener('pointerdown', tap);
    this.cv.addEventListener('touchstart', tap, { passive:false });
  },

  phase() {
    const k = Math.min(3, Math.floor((1 - this.left / this.SHIFT_MS) * 4));
    document.getElementById('shiftPhase').textContent = this.PHASES[k][0];
    this.bg = this.PHASES[k][1];
    if (k !== this._k) { this._k = k; this.say(this.CHRIS[k]); }
  },
  say(t) { document.getElementById('shiftSay').textContent = t; },
  dish(id) { return this.MENU.find(m => m.id === id); },

  /* ---------------- логика ---------------- */
  update(dt) {
    this.left -= dt;
    if (this.left <= 0) return this.finish();
    this.phase();
    if (this.flash > 0) this.flash -= dt;

    // Ная идёт к точке тапа
    const n = this.naya, dx = n.tx - n.x, dy = n.ty - n.y;
    const d = Math.hypot(dx, dy);
    if (d > 1.5) {
      const s = Math.min(d, this.SPEED * dt);
      n.x += dx / d * s; n.y += dy / d * s;
      n.step += s;
    }

    // новые гости
    this.spawnIn -= dt;
    if (this.spawnIn <= 0) {
      const free = this.TABLES.map((t, i) => i).filter(i => !this.guests.some(g => g.table === i));
      if (free.length) {
        const i = free[(Math.random() * free.length) | 0];
        const m = this.MENU[(Math.random() * this.MENU.length) | 0];
        this.guests.push({
          table:i, dish:m.id, state:'waiting',
          face:this.FACES[(Math.random() * this.FACES.length) | 0],
          line:this.ORDER_LINES[(Math.random() * this.ORDER_LINES.length) | 0],
          pat:1, patMs: 26000 + Math.random() * 10000, t0:0,
        });
      }
      this.spawnIn = 5200 + Math.random() * 3600;
    }

    // терпение
    this.guests.forEach(g => {
      if (g.state === 'served') { g.t0 += dt; return; }
      g.pat -= dt / g.patMs;
      if (g.pat <= 0) { g.state = 'left'; this.missed++; this.flash = 260; this.say('Гость ушёл, не дождавшись.'); }
    });
    this.guests = this.guests.filter(g => !(g.state === 'left') && !(g.state === 'served' && g.t0 > 2200));

    // Крис готовит
    if (this.cooking) {
      this.cooking.ms -= dt;
      if (this.cooking.ms <= 0 && this.pass.length < this.PASS_MAX) {
        this.pass.push(this.cooking.id);
        Audio.beep(660, .08, 'sine', .05);
        this.cooking = null;
      }
    }

    this.contacts();
  },

  /* Всё взаимодействие — от того, куда Ная дошла ногами. */
  contacts() {
    const n = this.naya;
    // стойка: слева заказ Крису, справа выдача
    if (n.y < 126) {
      if (n.x > 122 && this.pass.length && !this.carry) {
        this.carry = this.pass.shift();
        Audio.click();
        this.say('В руках: ' + this.dish(this.carry).n + '. Кому?');
        n.ty = 150;
        return;
      }
      if (n.x <= 122 && !this.menuOpen && !this.cooking) {
        const pend = this.guests.filter(g => g.state === 'ordered');
        if (pend.length) { this.menuOpen = true; this.say('Что готовим?'); n.ty = 150; }
        else if (!this.carry) this.say('Сначала прими у кого-нибудь заказ.');
        return;
      }
      return;
    }
    // столики
    this.TABLES.forEach((t, i) => {
      const g = this.guests.find(x => x.table === i && x.state !== 'served');
      if (!g) return;
      if (Math.hypot(n.x - t.x, n.y - (t.y + 26)) > 24) return;
      if (g.state === 'waiting') {
        g.state = 'ordered';
        Audio.select();
        this.say('Стол ' + (i + 1) + ': ' + this.dish(g.dish).n + '.');
      } else if (g.state === 'ordered' && this.carry) {
        if (this.carry === g.dish) {
          g.state = 'served'; g.t0 = 0;
          this.served++; this.carry = null;
          Audio.item(); this.flash = -220;
          this.say('Отдано. ' + this.served + ' за смену.');
        } else {
          this.wrong++;
          this.say('Это не его заказ. В мойку.');
          this.carry = null; this.flash = 260; Audio.beep(160, .12, 'sawtooth', .06);
        }
      }
    });
  },

  /* Панель выбора блюда у стойки: шесть позиций меню, три в ряд. */
  MENU_BOX: { x:16, y:118, w:208, h:104 },
  pickDish(x, y) {
    const b = this.MENU_BOX;
    if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) { this.menuOpen = false; return; }
    const col = Math.min(2, Math.max(0, Math.floor((x - b.x - 6) / 66)));
    const row = Math.min(1, Math.max(0, Math.floor((y - b.y - 18) / 42)));
    const m = this.MENU[row * 3 + col];
    if (!m) return;
    this.menuOpen = false;
    this.cooking = { id:m.id, ms:this.COOK_MS, total:this.COOK_MS };
    Audio.click();
    this.say('Крис взялся за ' + m.n.toLowerCase() + '.');
  },

  finish() {
    if (!this.resolve) return;
    cancelAnimationFrame(this.raf);
    document.getElementById('shiftScreen').classList.remove('show');
    Game.mode = 'cutscene';
    setFlag('cafeShiftFinished');
    setCounter('cafeMinigameProgress', this.served);
    saveGame();
    const r = this.resolve; this.resolve = null;
    if (r) r();
  },

  /* ---------------- рисование ---------------- */
  draw() {
    const g = this.ctx, W = this.W, H = this.H;
    g.fillStyle = this.bg || '#2a1c14'; g.fillRect(0, 0, W, H);
    this.drawRoom(g);
    // порядок по глубине: гости, тарелки, Ная
    const items = [];
    this.guests.forEach(x => items.push({ y:this.TABLES[x.table].y, f:() => this.drawGuest(g, x) }));
    items.push({ y:this.naya.y, f:() => this.drawNaya(g) });
    items.sort((a, b) => a.y - b.y).forEach(i => i.f());
    this.guests.forEach(x => this.drawBubble(g, x));
    this.drawHud(g);
    if (this.menuOpen) this.drawMenu(g);
    if (this.flash) {
      g.fillStyle = this.flash > 0 ? 'rgba(200,60,70,' + (this.flash / 900) + ')'
                                   : 'rgba(120,220,150,' + (-this.flash / 900) + ')';
      g.fillRect(0, 0, W, H);
    }
  },

  drawRoom(g) {
    const W = this.W, H = this.H;
    // пол
    g.fillStyle = '#6b4f38'; g.fillRect(0, 100, W, H - 100);
    g.fillStyle = '#5e452f';
    for (let y = 106; y < H; y += 14) g.fillRect(0, y, W, 1);
    for (let x = 0; x < W; x += 22) g.fillRect(x, 100, 1, H - 100);
    // стена и окно
    g.fillStyle = '#3f2c20'; g.fillRect(0, 0, W, 100);
    g.fillStyle = '#4a3427'; for (let x = 0; x < W; x += 9) g.fillRect(x, 0, 3, 100);
    g.fillStyle = '#2a1d16'; g.fillRect(0, 96, W, 6);
    // стойка
    g.fillStyle = '#4e3524'; g.fillRect(28, 62, 184, 40);
    g.fillStyle = '#6a4a32'; g.fillRect(28, 62, 184, 8);
    g.fillStyle = '#3a2718'; g.fillRect(28, 96, 184, 6);
    g.fillStyle = '#8a6a48'; g.fillRect(28, 60, 184, 3);
    // кофемашина и полки за спиной Криса
    g.fillStyle = '#7d7d86'; g.fillRect(38, 30, 32, 30);
    g.fillStyle = '#9a9aa4'; g.fillRect(40, 32, 28, 8);
    g.fillStyle = '#2e2e34'; g.fillRect(46, 44, 6, 10); g.fillRect(56, 44, 6, 10);
    g.fillStyle = '#5a4030'; g.fillRect(150, 26, 62, 5); g.fillRect(150, 42, 62, 5);
    ['#c9a06a','#8a6242','#d8c0a0','#6a4428'].forEach((c, i) => {
      g.fillStyle = c; g.fillRect(154 + i * 14, 18, 9, 8); g.fillRect(156 + i * 14, 34, 8, 8);
    });
    // Крис за стойкой — его должно быть видно: к нему бегут с каждым заказом
    this.drawChris(g, 104, 64);
    g.font = '6px Courier New'; g.fillStyle = 'rgba(240,224,192,.62)'; g.fillText('КРИС', 108, 70);
    // подписи зон
    g.font = '6px Courier New';
    g.fillStyle = 'rgba(240,224,192,.75)'; g.fillText('ЗАКАЗ', 56, 80);
    g.fillText('ВЫДАЧА', 148, 80);
    g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(28, 82, 90, 14);
    g.fillRect(122, 82, 90, 14);
    // тарелки на выдаче
    this.pass.forEach((id, i) => this.drawDish(g, 146 + i * 26, 88, id));
    // прогресс готовки
    if (this.cooking) {
      const k = 1 - this.cooking.ms / this.cooking.total;
      g.fillStyle = '#2a1d16'; g.fillRect(52, 88, 44, 6);
      g.fillStyle = '#e8b84a'; g.fillRect(53, 89, 42 * k, 4);
      this.drawDish(g, 74, 74, this.cooking.id, .5);
    }
    // столики
    this.TABLES.forEach((t, i) => {
      g.fillStyle = 'rgba(0,0,0,.22)';
      g.beginPath(); g.ellipse(t.x, t.y + 16, 22, 8, 0, 0, 6.3); g.fill();
      g.fillStyle = '#5a4030'; g.fillRect(t.x - 4, t.y + 2, 8, 14);
      g.fillStyle = '#7d5a3c'; g.beginPath(); g.ellipse(t.x, t.y, 21, 12, 0, 0, 6.3); g.fill();
      g.fillStyle = '#8f6a48'; g.beginPath(); g.ellipse(t.x, t.y - 2, 21, 12, 0, 0, 6.3); g.fill();
      g.fillStyle = 'rgba(255,255,255,.10)'; g.beginPath(); g.ellipse(t.x - 6, t.y - 5, 8, 4, 0, 0, 6.3); g.fill();
      g.fillStyle = 'rgba(240,224,192,.45)'; g.font = '6px Courier New';
      g.fillText(String(i + 1), t.x - 2, t.y + 30);
    });
  },

  drawChris(g, x, y) {
    g.fillStyle = '#2a231c'; g.fillRect(x - 1, y - 26, 34, 28);      // силуэт
    g.fillStyle = '#4a6a8a'; g.fillRect(x + 2, y - 24, 28, 26);      // рубашка
    g.fillStyle = '#3d5a76'; g.fillRect(x + 2, y - 24, 28, 4);
    g.fillStyle = '#d8d2c4'; g.fillRect(x + 5, y - 8, 22, 10);       // фартук
    g.fillStyle = '#c4bcac'; g.fillRect(x + 5, y - 8, 22, 2);
    g.fillStyle = '#4a6a8a'; g.fillRect(x - 3, y - 20, 5, 14); g.fillRect(x + 30, y - 20, 5, 14);
    g.fillStyle = '#e8c9a0'; g.fillRect(x + 7, y - 40, 18, 16);      // голова
    g.fillStyle = '#3a2a1e'; g.fillRect(x + 6, y - 43, 20, 9);       // волосы
    g.fillRect(x + 5, y - 39, 3, 7); g.fillRect(x + 24, y - 39, 3, 7);
    g.fillStyle = '#241a12'; g.fillRect(x + 11, y - 34, 2, 3); g.fillRect(x + 19, y - 34, 2, 3);
    g.fillStyle = '#b08878'; g.fillRect(x + 13, y - 29, 6, 1);
  },

  drawNaya(g) {
    const n = this.naya;
    const b = Math.sin(n.step / 7) * 1.4;
    g.fillStyle = 'rgba(0,0,0,.26)';
    g.beginPath(); g.ellipse(n.x, n.y + 2, 8, 3.4, 0, 0, 6.3); g.fill();
    g.fillStyle = '#2b2230'; g.fillRect(n.x - 6, n.y - 14 + b, 12, 14);
    g.fillStyle = '#c0304d'; g.fillRect(n.x - 6, n.y - 14 + b, 12, 5);
    g.fillStyle = '#d8d2c4'; g.fillRect(n.x - 5, n.y - 6 + b, 10, 5);
    g.fillStyle = '#e8c9a0'; g.fillRect(n.x - 5, n.y - 25 + b, 10, 11);
    g.fillStyle = '#2a1a20'; g.fillRect(n.x - 6, n.y - 27 + b, 12, 8);
    g.fillRect(n.x - 7, n.y - 24 + b, 3, 9); g.fillRect(n.x + 4, n.y - 24 + b, 3, 9);
    g.fillStyle = '#241a12'; g.fillRect(n.x - 3, n.y - 20 + b, 2, 2); g.fillRect(n.x + 1, n.y - 20 + b, 2, 2);
    if (this.carry) this.drawDish(g, n.x + 11, n.y - 12 + b, this.carry, .8);
  },

  drawGuest(g, x) {
    const t = this.TABLES[x.table];
    const gx = t.x, gy = t.y - 18;
    g.fillStyle = 'rgba(0,0,0,.22)';
    g.beginPath(); g.ellipse(gx, gy + 14, 7, 3, 0, 0, 6.3); g.fill();
    const img = (typeof Assets !== 'undefined' && Assets.images) ? Assets.images[x.face] : null;
    if (img) g.drawImage(img, Math.round(gx - img.width / 2), Math.round(gy + 12 - img.height));
    else { g.fillStyle = '#6a5a70'; g.fillRect(gx - 6, gy - 2, 12, 16); }
    if (x.state !== 'served') {                          // терпение
      const w = 20, k = Math.max(0, x.pat);
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(gx - w / 2, gy + 16, w, 3);
      g.fillStyle = k > .5 ? '#7bc47f' : k > .25 ? '#e8b84a' : '#c0304d';
      g.fillRect(gx - w / 2, gy + 16, w * k, 3);
    }
  },

  drawBubble(g, x) {
    const t = this.TABLES[x.table];
    const bx = t.x, by = t.y - 46;
    if (x.state === 'served') {
      g.fillStyle = '#f2ead8'; g.beginPath(); g.ellipse(bx, by + 6, 11, 9, 0, 0, 6.3); g.fill();
      g.strokeStyle = '#7bc47f'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(bx - 4, by + 6); g.lineTo(bx - 1, by + 9); g.lineTo(bx + 5, by + 2); g.stroke();
      return;
    }
    g.fillStyle = '#f2ead8';
    g.beginPath(); g.ellipse(bx, by + 6, 13, 10, 0, 0, 6.3); g.fill();
    g.beginPath(); g.moveTo(bx - 4, by + 14); g.lineTo(bx + 2, by + 14); g.lineTo(bx - 1, by + 20); g.fill();
    if (x.state === 'waiting') {
      g.fillStyle = '#3a2a20'; g.font = 'bold 11px Courier New'; g.fillText('?', bx - 3, by + 10);
    } else {
      this.drawDish(g, bx, by + 6, x.dish, .85);
    }
  },

  /* Иконка блюда: своя форма на каждую позицию меню. */
  drawDish(g, x, y, id, s) {
    s = s || 1;
    const m = this.dish(id); if (!m) return;
    const w = 14 * s, h = 12 * s;
    g.save(); g.translate(x, y);
    g.fillStyle = 'rgba(0,0,0,.20)';
    g.beginPath(); g.ellipse(0, h / 2 + 1, w / 2, 2.4 * s, 0, 0, 6.3); g.fill();
    if (m.k === 'cup' || m.k === 'mug') {
      g.fillStyle = '#efe8dc'; g.fillRect(-w / 2, -h / 2, w, h * .82);
      g.fillStyle = m.c; g.fillRect(-w / 2 + 1.5 * s, -h / 2 + 1.5 * s, w - 3 * s, h * .34);
      g.fillStyle = '#d8d0c2'; g.fillRect(-w / 2 - 1, h * .30, w + 2, 2 * s);
      if (m.k === 'mug') { g.fillStyle = '#f6d8e0'; g.fillRect(-2 * s, -h / 2 + 1, 4 * s, 2.4 * s); }
      g.fillStyle = '#efe8dc'; g.fillRect(w / 2, -h / 4, 2 * s, h * .4);
    } else if (m.k === 'glass') {
      g.fillStyle = 'rgba(240,240,240,.55)'; g.fillRect(-w / 3, -h / 2 - 1 * s, w * .66, h);
      g.fillStyle = m.c; g.fillRect(-w / 3 + 1, -h / 6, w * .66 - 2, h * .6);
      g.fillStyle = '#f4ead8'; g.fillRect(-w / 3 + 1, -h / 2, w * .66 - 2, h * .3);
    } else if (m.k === 'cake') {
      g.fillStyle = '#dcd6cc'; g.beginPath(); g.ellipse(0, h / 3, w / 2, 3 * s, 0, 0, 6.3); g.fill();
      g.fillStyle = m.c; g.fillRect(-w / 3, -h / 3, w * .66, h * .6);
      g.fillStyle = '#3f2416'; g.beginPath(); g.ellipse(0, -h / 3, w * .34, 2.6 * s, 0, 0, 6.3); g.fill();
    } else {                                                    // круассан
      g.fillStyle = '#dcd6cc'; g.beginPath(); g.ellipse(0, h / 3, w / 2, 3 * s, 0, 0, 6.3); g.fill();
      g.fillStyle = m.c;
      g.beginPath(); g.arc(0, h / 6, w * .40, Math.PI * 1.05, Math.PI * 1.95); 
      g.lineWidth = 4 * s; g.strokeStyle = m.c; g.stroke();
      g.fillStyle = '#b07f38'; g.fillRect(-1 * s, -h / 4, 2 * s, 3 * s);
    }
    g.restore();
  },

  drawHud(g) {
    const W = this.W, H = this.H;
    // блокнот заказов
    const taken = this.guests.filter(x => x.state === 'ordered');
    g.fillStyle = 'rgba(20,14,12,.72)'; g.fillRect(0, H - 40, W, 40);
    g.fillStyle = 'rgba(240,224,192,.20)'; g.fillRect(0, H - 40, W, 1);
    g.font = '6px Courier New';
    g.fillStyle = 'rgba(240,224,192,.55)'; g.fillText('БЛОКНОТ', 6, H - 30);
    if (!taken.length) {
      g.fillStyle = 'rgba(240,224,192,.35)'; g.fillText('пусто', 6, H - 18);
    } else taken.slice(0, 4).forEach((x, i) => {
      const bx = 6 + i * 58;
      g.fillStyle = 'rgba(240,224,192,.70)'; g.fillText('стол ' + (x.table + 1), bx, H - 20);
      this.drawDish(g, bx + 44, H - 22, x.dish, .7);
    });
    // счётчик и время
    g.fillStyle = 'rgba(20,14,12,.66)'; g.fillRect(0, 0, W, 14);
    g.fillStyle = '#f0e4c0'; g.font = '7px Courier New';
    g.fillText('ВЫДАНО: ' + this.served, 6, 10);
    const sec = Math.max(0, Math.ceil(this.left / 1000));
    g.fillText('ДО КОНЦА: ' + ((sec / 60) | 0) + ':' + String(sec % 60).padStart(2, '0'), 128, 10);
    if (this.carry) {
      g.fillStyle = 'rgba(240,224,192,.55)'; g.font = '6px Courier New';
      g.fillText('в руках: ' + this.dish(this.carry).n, 6, 22);
    }
  },

  drawMenu(g) {
    const b = this.MENU_BOX;
    g.fillStyle = 'rgba(10,8,10,.82)'; g.fillRect(0, 0, this.W, this.H);
    g.fillStyle = '#241a16'; g.fillRect(b.x, b.y, b.w, b.h);
    g.strokeStyle = '#8a6a48'; g.lineWidth = 1; g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    g.fillStyle = '#f0e4c0'; g.font = '7px Courier New';
    g.fillText('ЧТО ГОТОВИМ?', b.x + 8, b.y + 12);
    this.MENU.forEach((m, i) => {
      const col = i % 3, row = (i / 3) | 0;
      const cx = b.x + 6 + col * 66, cy = b.y + 18 + row * 42;
      g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(cx, cy, 62, 38);
      g.strokeStyle = 'rgba(200,170,120,.35)'; g.strokeRect(cx + .5, cy + .5, 61, 37);
      this.drawDish(g, cx + 31, cy + 14, m.id, .9);
      g.fillStyle = '#e8dcc0'; g.font = '6px Courier New';
      g.fillText(m.n, cx + 31 - m.n.length * 1.8, cy + 32);
    });
    g.fillStyle = 'rgba(240,224,192,.45)'; g.font = '6px Courier New';
    g.fillText('нажми мимо, чтобы вернуться', b.x + 8, b.y + b.h + 12);
  },
};

      t:'Осмотреть стенды в холле.', s:'Афиши, награды, выпускники, преподаватели.' },
    { w:()=> F('cafeSceneComplete'), t:'Зайти за Сью в университет.' },
    { w:()=> F('metSue'),            t:'Доработать смену в кафе.' },
    { w:()=> F('backstoryDone'),     t:'Начать день.' },
    { w:()=> F('prologueComplete'),  t:'Собраться и уехать из дома отца.' },
    { w:()=> true,                   t:'...' },
  ],
  cur:'', curSub:'',
  /* Уточнение к цели может зависеть от флагов, поэтому s допускается
     и строкой, и функцией. */
  sub(g) {
    if (!g || !g.s) return '';
    try { return typeof g.s === 'function' ? (g.s() || '') : g.s; } catch (e) { return ''; }
  },
  goal() {
    if (!gameState) return null;
    for (const g of this.GOALS) { try { if (g.w()) return g; } catch (e) {} }
    return null;
  },
  /* Дёргается каждый кадр, но перерисовывает панель только когда цель
     действительно сменилась — иначе тост всплывал бы без конца. */
  refresh(announce) {
    const g = this.goal();
    if (!g) return;
    const changed = g.t !== this.cur;
    this.cur = g.t; this.curSub = this.sub(g);
    const el = document.getElementById('questPanel');
    if (!el) return;
    const shown = (Game.mode === 'explore' || Game.mode === 'dialogue');
    if (!shown || g.t === '...') { el.classList.remove('show'); return; }
    el.textContent = 'ЦЕЛЬ: ' + g.t;
    el.classList.add('show');
    if (changed && announce) { UI.toast('Новая цель: ' + g.t, 2600); Audio.beep(660, .10, 'sine', .04); }
  },
};

    folderFound:  { d:4, t:'Пропавшая папка нашлась в цокольном архиве. Морель знала Медею лично.' },
    premiere:     { d:4, t:'Сью сыграла Элису от начала до конца. Премьера прошла без остановок.' },
    morelTruth:   { d:4, t:'Морель призналась: она знала Медею и знала, что сила перешла ко мне.' },
    communeInvite:{ d:4, t:'Морель зовёт меня в коммуну ведьм — завтра после заката.' },
  },
  has(k) { return !!(gameState && gameState.journal && gameState.journal.includes(k)); },
  add(k) {
    if (!gameState || !this.FACTS[k]) return false;
    if (!gameState.journal) gameState.journal = [];
    if (gameState.journal.includes(k)) return false;
    gameState.journal.push(k);
    if (typeof UI !== 'undefined' && UI.toast) UI.toast('Записано в журнал', 1800);
    if (typeof Audio !== 'undefined' && Audio.beep) Audio.beep(520, .07, 'sine', .03);
    return true;
  },
  /* Факты в журнале сгруппированы по дням: так видно, что расследование
     заняло четыре вечера, а не один осмотр стенда. */
  entries() {
    if (!gameState || !gameState.journal) return [];
    return gameState.journal
      .filter(k => this.FACTS[k])
      .map(k => Object.assign({ k }, this.FACTS[k]));
  },

const Patrol = {
  update(dt, room) {
    if (Game.mode === 'menu' || Game.montage) return;
    for (const n of (room.npcs || [])) {
      if (!n.path || n.path.length < 2) continue;
      if (n.when && !n.when()) continue;
      const st = n._p || (n._p = { i:1, wait:0, sx:n.x, sy:n.y });
      if (st.wait > 0) { st.wait -= dt; n.moving = false; continue; }
      const [tx, ty] = n.path[st.i];
      const dx = tx - n.x, dy = ty - n.y;
      const d = Math.hypot(dx, dy);
      if (d < 1.6) {                       // дошёл до точки — постоять и оглядеться
        st.i = (st.i + 1) % n.path.length;
        st.wait = (n.pause === 0) ? 0 : (400 + Math.random() * 2100);
        n.moving = false;
        continue;
      }
      const sp = (n.speed || 0.42) * (dt / 16.6);
      n.x += dx / d * sp; n.y += dy / d * sp;
      n.moving = true;
    }
  },
  /* при загрузке комнаты вернуть всех на исходные места */
  reset(room) {
    for (const n of (room.npcs || [])) {
      if (!n.path || !n._p) continue;
      n.x = n._p.sx; n.y = n._p.sy; n._p.i = 1; n._p.wait = 0; n.moving = false;
    }
  }
};

/* ДОМ ВЕДЬМЫ — план этажа, а не одна комната.

   Перегородки настоящие: у них есть проёмы, и чтобы дойти до спальни,
   надо пройти через другие зоны. Снаружи это обычный жилой дом, внутри —
   обычный быт, в котором ведьминское проступает не сразу.

   plan = { wall, floor, floor2, wallH, zones:[{x,y,w,h,name,floor,floor2,tiles}],
            parts:[{x,y,w,h}] } — зоны красят свой пол, parts рисуют
   перегородки, которые комната дублирует в walls с теми же проёмами.     */
function paintHousePlan(ctx, W, H, plan) {
  const wallH = plan.wallH || 52;
  paintInterior(ctx, W, H, { wall:plan.wall, wall2:plan.wall2,
                             floor:plan.floor, floor2:plan.floor2, wallH });
  (plan.zones || []).forEach(z => {
    if (!z.floor) return;
    ctx.fillStyle = z.floor; ctx.fillRect(z.x, z.y, z.w, z.h);
    if (!z.floor2) return;
    ctx.fillStyle = z.floor2;
    if (z.tiles) {
      for (let y = z.y; y < z.y + z.h; y += 10)
        for (let x = z.x + (((y / 10) | 0) % 2) * 5; x < z.x + z.w; x += 10) ctx.fillRect(x, y, 4, 4);
    } else {
      for (let y = z.y + 6; y < z.y + z.h; y += 12) ctx.fillRect(z.x, y, z.w, 1);
      for (let x = z.x; x < z.x + z.w; x += 46) ctx.fillRect(x, z.y, 1, z.h);
    }
  });
  (plan.parts || []).forEach(w => {
    ctx.fillStyle = shade(plan.wall || '#5a4a3a', .70); ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = shade(plan.wall || '#5a4a3a', 1.08); ctx.fillRect(w.x, w.y, w.w, 2);
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.fillRect(w.x, w.y + w.h - 2, w.w, 2);
  });
  ctx.fillStyle = plan.label || 'rgba(226,206,172,.42)';
  ctx.font = '6px Courier New';
  (plan.zones || []).forEach(z => { if (z.name) ctx.fillText(z.name, z.x + 5, z.y + 10); });
}

/* Детская площадка. Одна планировка, две эпохи: playground — детство,
   playgroundNow — та же площадка сегодня, на окраине города. Ключевые
   объекты стоят там же, чтобы место узнавалось, но всё заметно старее. */
function paintPlayground(ctx, worn) {
  const W = 300;
  // небо занимает узкую полосу: за площадкой должен быть жилой квартал
  const sky = ctx.createLinearGradient(0,0,0,52);
  if (worn) { sky.addColorStop(0,'#6f7480'); sky.addColorStop(1,'#98917f'); }
  else      { sky.addColorStop(0,'#8ea0b0'); sky.addColorStop(1,'#c0b294'); }
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,52);
  // дальние крыши
  ctx.fillStyle = worn ? '#4a4650' : '#59606a';
  for (let x=-6;x<W;x+=34) ctx.fillRect(x, 30 + ((x*7)%10), 30, 24);
  // жилые дома: стены, крыши, окна
  const houses = [[-4,44,72],[74,38,64],[144,46,58],[208,36,68],[280,44,40]];
  houses.forEach(([hx,hy,hw], i) => {
    const body = worn ? ['#6a6058','#5f5a52','#6f6258'][i%3] : ['#7d7268','#877a68','#6f665e'][i%3];
    ctx.fillStyle = worn ? '#3f3a3c' : '#4a4248';                 // крыша
    ctx.beginPath(); ctx.moveTo(hx-4, hy); ctx.lineTo(hx+hw/2, hy-14); ctx.lineTo(hx+hw+4, hy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = body; ctx.fillRect(hx, hy, hw, 100 - hy + 12);
    ctx.fillStyle = worn ? 'rgba(0,0,0,.20)' : 'rgba(0,0,0,.14)';
    ctx.fillRect(hx, hy, hw, 3);
    for (let r=0;r<2;r++) for (let c=0;c<Math.floor(hw/20);c++) {
      const wx = hx + 6 + c*20, wy = hy + 10 + r*22;
      const lit = !worn && ((i+c+r) % 4 === 0);
      ctx.fillStyle = lit ? '#e8c880' : (worn ? '#3a3a40' : '#48505c');
      ctx.fillRect(wx, wy, 11, 13);
      ctx.fillStyle = worn ? '#565056' : '#5f5a58';
      ctx.fillRect(wx, wy, 11, 1); ctx.fillRect(wx+5, wy, 1, 13);
    }
  });
  // деревья вдоль домов
  ctx.fillStyle = worn ? '#4a4032' : '#5a4a34';
  [30, 118, 196, 268].forEach(tx => ctx.fillRect(tx, 78, 4, 26));
  [30, 118, 196, 268].forEach((tx, i) => {
    ctx.fillStyle = worn ? ['#5a5236','#6a5c34','#4e4a30'][i%3] : ['#a8622c','#c08a2c','#8a5a26'][i%3];
    ctx.beginPath(); ctx.arc(tx+2, 70, 15 - (i%2)*3, 0, 6.3); ctx.fill();
  });
  // дорога и тротуар перед кварталом
  ctx.fillStyle = worn ? '#4e4a4c' : '#585458'; ctx.fillRect(0, 96, W, 12);
  ctx.fillStyle = worn ? '#6a6660' : '#7a746c'; ctx.fillRect(0, 92, W, 4);
  ctx.fillStyle = worn ? '#8a8878' : '#9a9484';
  for (let x=6;x<W;x+=26) ctx.fillRect(x, 101, 12, 2);
  // забор между кварталом и площадкой
  ctx.fillStyle = worn ? '#5a5244' : '#6f6250';
  ctx.fillRect(0, 108, W, 3);
  for (let x=2;x<W;x+=14) ctx.fillRect(x, 106, 3, 12);

  // сама площадка
  ctx.fillStyle = worn ? '#5f6448' : PAL.grassDry; ctx.fillRect(0,112,W,188);
  ctx.fillStyle = worn ? '#525a3a' : '#535a33';
  for (let i=0;i<120;i++) ctx.fillRect((i*47)%W, 116+((i*29)%180), 2, 1);
  ctx.fillStyle = worn ? '#5e5340' : '#6a5a42';
  ctx.beginPath(); ctx.ellipse(150, 196, 84, 44, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = worn ? '#6a5f48' : '#77684d';
  ctx.beginPath(); ctx.ellipse(150, 192, 78, 39, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = PAL.grassDry; ctx.fillRect(0,294,W,26);
    ctx.fillStyle = '#4e5533';
    for (let i=0;i<60;i++) ctx.fillRect((i*53)%W, 296+((i*17)%22), 2, 1);

    ctx.fillStyle = '#22212a';

      for(let i=0;i<4;i++) ctx.fillRect(x+2+i*4,243,2,3); ctx.fillStyle='#22212a'; });

  bgPaint(ctx) {
    /* большая общая комната: ведьмы живут почти обычной жизнью,
       и всё «страшное» стоит на полках между вареньем и книгами */
    paintInterior(ctx, 300, 300, { wall:'#3f4a3e', wall2:'#354034', floor:'#6b5a42', floor2:'#5b4c37', wallH:62 });
    if (F('evilTrialOffered')) {                                   // люк в подпол открывают только для испытания
      ctx.fillStyle = '#2a3428'; ctx.fillRect(240, 66, 46, 56);
      ctx.fillStyle = '#1d251c'; ctx.fillRect(244, 70, 38, 52);
      ctx.fillStyle = '#c9a05a'; ctx.font = '6px Courier New'; ctx.fillText('ВНИЗ', 250, 130);
    } else {
      ctx.fillStyle = '#3f4a3e'; ctx.fillRect(240, 66, 46, 56);     // просто стена с полкой
      ctx.fillStyle = '#354034'; ctx.fillRect(244, 70, 38, 52);
      ctx.fillStyle = '#5a4636'; ctx.fillRect(244, 88, 38, 4);
      ctx.fillStyle = '#8a9a7a'; ctx.fillRect(250, 76, 6, 12); ctx.fillRect(262, 78, 6, 10);

    /* меловой круг для собраний — вытоптан за десятки лет */
    ctx.strokeStyle = F('communeWarded') ? '#40a0ff' : '#7d7a5a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(150,196,92,44,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(150,196,72,34,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ctx.beginPath(); ctx.ellipse(150,196,88,41,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a8560';
    for (let i=0;i<12;i++) { const a=i*Math.PI/6; ctx.fillRect(150+Math.cos(a)*86-1, 196+Math.sin(a)*41-1, 3, 2); }
    /* знаки над кругом — мелом по стене, а не огнём */
    ctx.fillStyle = '#8a9a7a';
    for (let i=0;i<8;i++) ctx.fillRect(28+i*32, 20, 12, 2);
    for (let i=0;i<8;i++) ctx.fillRect(32+i*32, 26, 5, 2);
    paintDoor(ctx, 135, 285);

     свечение читалось на тёмных стенах.                                */
  RUNES: [
    { x:35,  y:116, c:'#6ad8ff' },   // над печью в гостиной: холодная, чтобы не тонуть в её свете
    { x:199, y:70,  c:'#8a7aff' },   // на стене кабинета
    { x:215, y:278, c:'#c060ff' },   // в ритуальной, у ларца
  ],
  overPaint(ctx) {
    if (F('thirdAmulet')) return;
    const done = C('runesDisarmed') || 0;
    const t = Date.now();
    this.RUNES.forEach((r, i) => {
      const live = i >= done;
      const puls = live ? 0.60 + 0.34 * Math.sin(t / 340 + i * 2.1) : 0.14;
      ctx.save();
      ctx.translate(r.x, r.y);
      if (live) {                                   // ореол
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 20);
        g.addColorStop(0, r.c);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.20 * puls; ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, 6.3); ctx.fill();
      }
      ctx.globalAlpha = puls;
      ctx.strokeStyle = live ? r.c : '#4a4658';
      ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, 6.3); ctx.stroke();
      ctx.beginPath();
      if (i === 0) {                                // косой крест с засечками
        ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.moveTo(6, -6); ctx.lineTo(-6, 6);
        ctx.moveTo(-9, 0); ctx.lineTo(-5, 0); ctx.moveTo(5, 0); ctx.lineTo(9, 0);
      } else if (i === 1) {                         // вертикаль с двумя ветвями
        ctx.moveTo(0, -8); ctx.lineTo(0, 8);
        ctx.moveTo(0, -3); ctx.lineTo(6, -7); ctx.moveTo(0, 3); ctx.lineTo(-6, 7);
      } else {                                      // треугольник в круге
        ctx.moveTo(0, -7); ctx.lineTo(6, 4); ctx.lineTo(-6, 4); ctx.closePath();
        ctx.moveTo(0, -1); ctx.lineTo(0, 4);
      }
      ctx.stroke();
      if (live) {                                   // четыре точки по сторонам
        ctx.globalAlpha = puls * .9; ctx.fillStyle = r.c;
        [[0,-12],[12,0],[0,12],[-12,0]].forEach(([dx,dy]) => ctx.fillRect(dx - 1, dy - 1, 2, 2));
      }
      ctx.restore();
    });
  },
